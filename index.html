<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>The Den</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0d0b14;
  --s1:#171225;
  --s2:#1d1731;
  --amber:#f5b942;
  --amber-deep:#e09e28;
  --text:#f4efe8;
  --muted:#8d85a3;
  --line:rgba(244,239,232,.08);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(880px 400px at 50% -10%, rgba(245,185,66,.15), transparent 68%),
    radial-gradient(640px 460px at 106% 4%, rgba(150,96,235,.14), transparent 66%),
    radial-gradient(560px 520px at -12% 34%, rgba(66,120,245,.08), transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px}

/* ---------- marquee header ---------- */
.top{padding:22px 0 14px;text-align:center}
.bulbs{
  display:block;height:6px;margin:0 auto 12px;width:132px;
  background-image:radial-gradient(circle, rgba(245,185,66,.95) 36%, transparent 40%);
  background-size:15px 6px;background-repeat:repeat-x;
  filter:drop-shadow(0 0 6px rgba(245,185,66,.55));
  animation:chase 1.7s linear infinite;
}
@keyframes chase{to{background-position:15px 0}}
.marquee{
  font-size:13px;font-weight:800;letter-spacing:.44em;text-indent:.44em;
  color:var(--amber);text-shadow:0 0 22px rgba(245,185,66,.5);
}
.sub{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.mechip{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  padding:5px 12px 5px 6px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--muted);
}
.mechip .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}

/* ---------- structure ---------- */
.eyebrow{
  font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}
h1.h{font-size:27px;font-weight:800;letter-spacing:-.028em;margin:4px 0 16px;line-height:1.08}
.card{
  background:linear-gradient(158deg,var(--s2),var(--s1));
  border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.34);
}
.card + .card{margin-top:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between;align-items:flex-start}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.mt{margin-top:16px}
.sec{margin:26px 0 0}

/* ---------- tonight ---------- */
.date{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:5px}
.theme{margin-top:6px;font-size:13px;color:var(--amber);font-weight:600}
.pill{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 10px;border-radius:999px;color:var(--amber);
  background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.3);
}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.seg button{
  font:inherit;font-weight:700;font-size:13px;color:var(--text);cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:15px;padding:12px 4px;transition:transform .12s ease, background .18s ease;
}
.seg button:active{transform:scale(.96)}
.seg button.on{
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  color:#221806;border-color:transparent;box-shadow:0 8px 22px rgba(245,185,66,.26);
}
.plusrow{display:flex;align-items:center;gap:11px;margin-top:9px}
.plus{
  flex:none;font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:var(--text);
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:999px;padding:9px 15px;transition:transform .12s ease, background .18s ease;
}
.plus:active{transform:scale(.96)}
.plus.on{
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  color:#221806;border-color:transparent;box-shadow:0 8px 22px rgba(245,185,66,.26);
}
.heads{margin-top:14px;font-size:13px;font-weight:700;color:var(--amber)}
.whenline{margin-top:5px;font-size:13px;color:var(--muted);font-weight:600}
.notes{margin:14px 0 0;font-size:13px;line-height:1.5;color:#c3bcd4}
.snackrow{display:flex;gap:8px;margin-top:10px}
.snackrow input{
  flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:13px;padding:10px 13px;outline:none;
}
.snackrow input::placeholder{color:#6d6685}
.snackrow input:focus{border-color:rgba(245,185,66,.45);background:rgba(255,255,255,.07)}
.ghostbtn{
  flex:none;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:13px;padding:0 14px;
}
.ghostbtn:active{color:var(--text)}
.spread{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.spread .faces{margin-top:9px}
.faces{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.face{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;
  border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  font-size:12px;font-weight:600;
}
.face .av{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.face.maybe{opacity:.72}
.face.out{opacity:.4}

/* ---------- posters ---------- */
.poster{
  aspect-ratio:2/3;width:100%;display:block;border-radius:16px;object-fit:cover;
  background:#221b33;border:1px solid var(--line);
  min-height:0;overflow:hidden;   /* aspect-ratio boxes otherwise grow to fit their text */
}
.ph{display:flex;flex-direction:column;justify-content:space-between;padding:11px;overflow:hidden}
.ph-t{font-weight:800;font-size:15px;line-height:1.12;letter-spacing:-.025em;padding-right:46px;
  text-shadow:0 2px 12px rgba(0,0,0,.55)}
.ph-f{font-size:20px;opacity:.65;align-self:flex-end}
.tile{position:relative}
.badge{
  position:absolute;top:8px;right:8px;z-index:2;
  font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--amber);
  padding:4px 8px;border-radius:999px;
  background:rgba(13,11,20,.74);border:1px solid rgba(245,185,66,.34);
  backdrop-filter:blur(8px);
}
.tags{position:absolute;top:8px;left:8px;z-index:2;display:flex;gap:5px;align-items:center}
.tag{
  font-size:11px;font-weight:800;line-height:1;padding:5px 7px;border-radius:999px;
  background:rgba(13,11,20,.72);border:1px solid var(--line);backdrop-filter:blur(8px);
}
.tag.vote{color:var(--amber);border-color:rgba(245,185,66,.34)}
.tag.out{font-weight:700;letter-spacing:.04em;color:var(--muted)}

/* ---------- coming up ---------- */
.up{margin-top:14px;padding:16px;border-radius:18px;
  background:linear-gradient(158deg,var(--s2),var(--s1));border:1px solid var(--line)}
.up + .up{margin-top:10px}
.up .when{font-size:16px;font-weight:800;letter-spacing:-.02em}
.up .th{margin-top:3px;font-size:12px;color:var(--amber);font-weight:600}
.up .meta{margin-top:4px;font-size:11px;color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pick{
  font:inherit;font-size:11px;font-weight:700;cursor:pointer;color:var(--text);text-align:left;
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:11px;padding:7px 10px;
  max-width:100%;
}
.pick.on{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#221806;border-color:transparent}
.pick:disabled{opacity:.38;cursor:default}
.pick .yr{opacity:.6;font-weight:600}
.throw{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.35}
.throw.sep{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.throw .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}
.tag.vote.mine{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#221806;border-color:transparent}
.ownnote{margin-top:10px;padding:11px 13px;border-radius:13px;font-size:12px;
  line-height:1.45;color:#e2c6ff;background:rgba(200,150,255,.1);
  border:1px solid rgba(200,150,255,.3)}
.lockbar{
  margin:14px 0 2px;padding:10px 14px;border-radius:14px;text-align:center;
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#221806;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  box-shadow:0 10px 26px rgba(245,185,66,.24);
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .tile{display:flex;flex-direction:column}
.grid .tile .acts{margin-top:auto}
.acts{display:flex;gap:7px}
.acts .ghost{flex:1;min-width:0}
.t-title{margin-top:9px;font-size:13px;font-weight:700;line-height:1.25;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-by{margin-top:4px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.ghost{
  margin-top:8px;width:100%;font:inherit;font-size:11px;font-weight:700;cursor:pointer;
  color:var(--muted);background:transparent;border:1px solid var(--line);
  border-radius:11px;padding:7px 0;
}
.ghost:active{color:var(--text)}

/* ---------- rail (horizontal poster strip) ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .tile{flex:none;width:104px}
.rail .tile.picked .poster{border-color:var(--amber);box-shadow:0 0 0 2px rgba(245,185,66,.45),0 10px 26px rgba(245,185,66,.2)}
.picked-tag{margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}

/* ---------- suggest ---------- */
.field{display:flex;gap:9px;margin-top:14px}
.field input{
  flex:1;min-width:0;font:inherit;font-size:15px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:15px;padding:13px 15px;outline:none;
}
.field input::placeholder{color:#6d6685}
.field input:focus{border-color:rgba(245,185,66,.45);background:rgba(255,255,255,.07)}
.field button{
  flex:none;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#221806;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  border:none;border-radius:15px;padding:0 20px;
}
.field button:disabled{opacity:.45}
.prev{display:none;gap:12px;margin-top:14px;align-items:center;animation:fade .28s ease}
.prev.on{display:flex}
.prev .poster{width:44px;height:66px;aspect-ratio:auto;border-radius:9px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- history ---------- */
.hrow{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:start}
.hnight + .hnight{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.hrow.more{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(244,239,232,.09)}
.paws{display:flex;gap:3px;font-size:14px;line-height:1}
.paws span{opacity:.2;cursor:pointer}
.paws span.on{opacity:1;filter:drop-shadow(0 0 6px rgba(245,185,66,.4))}
.paws.small{font-size:12px}
.avg{font-size:12px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mine-label{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- stats ---------- */
.stat{position:relative;overflow:hidden;border-radius:24px;padding:20px;
  background:linear-gradient(152deg,var(--s2),var(--s1));border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(0,0,0,.34)}
.stat + .stat{margin-top:14px}
.stat::after{
  content:"";position:absolute;top:-70px;right:-60px;width:210px;height:210px;border-radius:50%;
  background:var(--accent,#f5b942);opacity:.17;filter:blur(34px);pointer-events:none;
}
.stat .bd{position:relative;z-index:1}
.stat .badge2{font-size:22px;line-height:1}
.stat .st-title{margin-top:10px;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stat .st-head{margin-top:5px;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.12}
.stat .st-sub{margin-top:5px;font-size:15px;font-weight:700;color:var(--amber)}
.stat .st-line{margin-top:9px;font-size:14px;color:#c3bcd4;line-height:1.5}
.stat .st-who{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  padding:5px 12px 5px 5px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.stat .st-who .av{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.summary .card{padding:16px;text-align:center;margin:0}
.summary .big{font-size:28px;font-weight:800;letter-spacing:-.03em}

/* ---------- the shared language, at phone scale ---------- */
.seatrow{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.sdot{height:24px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;line-height:1;overflow:hidden}
.sdot.free{background:rgba(255,255,255,.014);border-style:dashed;border-color:rgba(244,239,232,.13)}
.sdot.guest{opacity:.62}
.capline{margin-top:9px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.capline b{color:var(--amber);font-weight:800;font-variant-numeric:tabular-nums}
.frame{border-radius:16px;border:1px dashed rgba(244,239,232,.13);background:rgba(255,255,255,.014);
  aspect-ratio:2/3;position:relative}
.frame::after{content:"";position:absolute;left:50%;top:44%;width:24px;height:24px;
  margin:-12px 0 0 -12px;border-radius:50%;border:1px dashed rgba(244,239,232,.14)}
.rail .frame{width:104px;flex:none}
.slotcount{margin-top:6px;font-size:11px;color:var(--muted);text-align:center}

/* ---------- empty / skeleton / toast ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:10px;opacity:.8}
.empty p{margin:0;font-size:14px;max-width:250px;margin-inline:auto;line-height:1.5}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));
  background-size:220% 100%;animation:sh 1.25s linear infinite;border-radius:14px}
@keyframes sh{to{background-position:-220% 0}}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:40;max-width:330px;padding:11px 17px;border-radius:14px;font-size:13px;font-weight:600;
  background:rgba(29,23,49,.96);border:1px solid var(--line);color:var(--text);
  box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .24s ease;
  backdrop-filter:blur(10px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(219,87,109,.5)}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  background:rgba(13,11,20,.86);backdrop-filter:blur(18px);border-top:1px solid var(--line);
}
.tabs button{
  font:inherit;font-size:12px;font-weight:700;letter-spacing:.02em;cursor:pointer;
  background:none;border:none;color:var(--muted);padding:8px 0 6px;position:relative;
}
.tabs button.on{color:var(--amber)}
.tabs button.on::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 10px rgba(245,185,66,.9);
}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:32px;background:var(--bg)}
.gate .box{text-align:center;max-width:300px}
.gate .big{font-size:44px;margin-bottom:18px}
.gate h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.gate .gatebtn{
  display:inline-block;margin-top:24px;font-size:15px;font-weight:800;text-decoration:none;
  color:#221806;background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  border-radius:15px;padding:13px 22px;box-shadow:0 10px 26px rgba(245,185,66,.26);
}
.gate .after{margin-top:14px;font-size:13px;opacity:.85}
.gate .after b{color:var(--text)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- entry, jokers, library ---------- */
.mine{margin-top:14px;padding:16px;border-radius:18px;
  background:linear-gradient(158deg,var(--s2),var(--s1));border:1px solid var(--line)}
.mine.slot{border-style:dashed}
.mine .poster{width:52px;height:78px;aspect-ratio:auto;border-radius:10px;flex:none}
.mine .t{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.cta{margin-top:12px;display:flex;gap:8px}
.cta button{
  flex:1;font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;padding:11px 8px;
}
.cta button.go{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#221806;border-color:transparent}
.jokerbar{display:flex;align-items:center;gap:11px;margin-top:14px}
.jokerbtn{
  flex:none;font:inherit;font-size:13px;font-weight:800;cursor:pointer;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:10px 16px;
}
.jokerbtn.armed{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#221806;border-color:transparent}
.jokerbtn:disabled{opacity:.4}
.chiprow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bar{display:flex;gap:2px;margin-top:7px;align-items:flex-end}
.vs{flex:1;min-width:3px;height:7px;border-radius:2px;background:rgba(255,255,255,.08);
  border:1px solid var(--line)}
.vs.on{background:linear-gradient(180deg,var(--amber),var(--amber-deep));border-color:transparent}
.vs.tick{position:relative}
.vs.tick::after{content:"";position:absolute;right:-2px;top:-4px;bottom:-4px;width:1px;
  background:rgba(245,185,66,.75)}
.mini{font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.mini.v{color:var(--amber);border-color:rgba(245,185,66,.3)}
.mini.j{color:#e2c6ff;border-color:rgba(200,150,255,.32)}
.filters{display:flex;gap:8px;margin:16px 0 4px}
.filters button{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
}
.filters button.on{color:#221806;background:linear-gradient(180deg,var(--amber),var(--amber-deep));border-color:transparent}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
.lib .t-title{font-size:11px;margin-top:6px}
.seen{position:absolute;bottom:6px;left:6px;z-index:2;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:999px;background:rgba(13,11,20,.82);border:1px solid var(--line);
  color:var(--amber)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.74);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end}
.sheet .inner{position:relative;width:100%;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;
  background:linear-gradient(158deg,var(--s2),var(--s1));border:1px solid var(--line);
  padding:22px 18px calc(28px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;top:14px;right:16px;font:inherit;font-size:11px;font-weight:800;
  color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
.sheet .hd{display:flex;gap:14px;padding-right:56px}
.sheet .hd .poster{width:84px;height:126px;aspect-ratio:auto;border-radius:12px;flex:none}
.sheet .pw{position:relative;flex:none}
/* A thumb has no hover: the trailer badge just lives on the poster. */
.sheet .playbtn{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none}
.sheet .playbtn span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  padding-left:3px;font-size:15px;color:var(--amber);background:rgba(13,11,20,.72);
  border:1px solid var(--line)}
/* The cinema: the trailer plays here, inside the app. */
#cinema{position:fixed;inset:0;z-index:60;display:none}
#cinema.on{display:block}
#cinema .cscrim{position:absolute;inset:0;background:rgba(8,6,14,.92)}
#cinema .cframe{position:absolute;inset:0;margin:auto;width:100%;aspect-ratio:16/9;
  max-height:70vh}
#cinema iframe{width:100%;height:100%;border:0;background:#000}
#cinema .cx{position:absolute;top:-44px;right:14px;font:inherit;font-size:11px;
  font-weight:800;color:var(--text);background:rgba(255,255,255,.08);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sheet h2{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0}
.gen{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.syn{margin-top:15px;font-size:13px;line-height:1.55;color:#c3bcd4}
.castline{margin-top:10px;font-size:12px;line-height:1.45;color:var(--muted)}
/* Where to watch it. Same block as the big screen, sized for a thumb. */
.watch{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.watch .wrow{display:flex;align-items:flex-start;gap:9px;margin-top:9px}
.watch .wrow:first-of-type{margin-top:0}
.watch .wk{flex:none;width:46px;padding-top:4px;font-size:10px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.watch .wp{display:flex;flex-wrap:wrap;gap:6px}
.watch .wp a{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:4px 9px 4px 4px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);color:var(--text);text-decoration:none}
.watch .wp a:active{border-color:var(--amber)}
.watch .wp img{width:18px;height:18px;border-radius:5px;display:block}
.watch .wlink{display:inline-block;margin-top:11px;font-size:12px;font-weight:800;
  color:var(--amber);text-decoration:none}
.watch .wattr{margin-top:8px;font-size:10px;color:var(--muted);opacity:.7}
.tl{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.tlrow{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:9px 0}
.tlrow + .tlrow{border-top:1px dashed rgba(244,239,232,.08)}
.tlrow .w{color:var(--amber);font-weight:800;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="bulbs"></span>
    <div class="marquee">THE DEN</div>
    <div class="sub" id="sub">one film each &middot; the wheel decides</div>
    <div id="whoami"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="tonight" class="on">Tonight</button>
  <button data-tab="library">Library</button>
  <button data-tab="history">History</button>
  <button data-tab="stats">Stats</button>
</nav>

<div class="toast" id="toast"></div>
<div id="sheet"></div>
<div id="cinema"></div>

<script>
(function(){
  var W = window.Telegram && window.Telegram.WebApp;
  if (W) {
    try { W.ready(); W.expand(); } catch (e) {}
    try { W.setHeaderColor('#0d0b14'); W.setBackgroundColor('#0d0b14'); } catch (e) {}
  }
  var initData = (W && W.initData) || '';
  /* This page is hosted on GitHub Pages, so the API is a different origin entirely. */
  var API = 'https://psomtujaikgcvblklzgv.supabase.co/functions/v1/app/api/';

  var S = null;               /* everything /api/me returned */
  var tab = 'tonight';
  var busy = false;
  var query = '';             /* live entry-search text */
  var themeDraft = '';        /* live theme-idea box text */
  var previewTimer = null;
  var pickerFor = null;       /* night id whose entry picker is open */
  var jokerArmed = false;     /* next tap on a film burns my joker */
  var ownNoteFor = '';        /* night whose own-film explanation is showing */
  var ownNoteFilm = '';       /* the film that was tapped */
  var libFilter = 'all';
  var dossier = null;         /* the open film sheet */

  var view = document.getElementById('view');
  var sheetEl = document.getElementById('sheet');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  /* ------------------------------------------------ helpers */
  var ENT = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ENT[c]; });
  }
  function safeColor(c){
    return /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? String(c) : '#b48ef2';
  }
  function hash(s){
    var h = 0, str = String(s || '');
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  function haptic(kind){
    try { W.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {}
  }
  function toast(msg, bad){
    toastEl.textContent = msg;
    toastEl.className = 'toast on' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = 'toast' + (bad ? ' bad' : ''); }, 2600);
  }
  function api(name, body){
    var payload = Object.assign({ initData: initData }, body || {});
    return fetch(API + name, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.json().catch(function(){ return { ok:false, error:'bad_json' }; }).then(function(j){
        j.__status = res.status;
        return j;
      });
    });
  }

  /* Poster, or a placeholder built from the title's own hash. */
  function poster(title, url, cls){
    var extra = cls ? ' ' + cls : '';
    if (url) {
      return '<img class="poster' + extra + '" loading="lazy" alt="" src="' + esc(url) + '">';
    }
    var h = hash(title);
    var a = h % 360, b = (h >>> 7) % 360;
    return '<div class="poster ph' + extra + '" style="background:linear-gradient(158deg,hsl(' +
      a + ' 42% 27%),hsl(' + b + ' 52% 13%))">' +
      '<span class="ph-t">' + esc(title) + '</span><span class="ph-f">&#127916;</span></div>';
  }
  function avatar(m, cls){
    var c = safeColor(m && m.color);
    return '<span class="av' + (cls ? ' ' + cls : '') + '" style="background:' + c + '33;box-shadow:inset 0 0 0 1px ' +
      c + '88">' + ((m && m.emoji) ? esc(m.emoji) : '&#128062;') + '</span>';
  }
  function pawRow(n, opts){
    var out = [], i;
    for (i = 1; i <= 5; i++) {
      out.push('<span class="' + (i <= n ? 'on' : '') + '"' +
        (opts && opts.act
          ? ' data-act="rate" data-night="' + esc(opts.night) + '" data-film="' + esc(opts.film) +
            '" data-paws="' + i + '"'
          : '') +
        '>&#128062;</span>');
    }
    return '<div class="paws' + (opts && opts.small ? ' small' : '') + '">' + out.join('') + '</div>';
  }
  function odds(c){ return Math.round((c.odds || 0) * 100) + '%'; }
  function empty(icon, text){
    return '<div class="empty"><div class="big">' + icon + '</div><p>' + esc(text) + '</p></div>';
  }
  function statusPill(status){
    var map = { planned:'Entries open', locked:'Voting open', spun:'Picked', watched:'Watched' };
    return map[status] || status;
  }
  function fmtDate(iso){
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    } catch (e) { return ''; }
  }
  function myId(){ return (S && S.me && S.me.telegram_id) || 0; }
  /* Rule one has a doorway: you say you are coming, then you put a film up. */
  function attending(rsvp){
    var st = (rsvp || {}).status;
    return st === 'in' || st === 'maybe';
  }
  var GATE = 'You must mark yourself attending before you can enter a movie';
  /* The in/maybe pair an upcoming night needs, since its RSVP buttons live elsewhere. */
  function rsvpPair(nightId){
    return '<div class="cta">' +
      '<button class="go" data-act="rsvpthen" data-night="' + esc(nightId) +
      '" data-status="in">&#127881; In</button>' +
      '<button data-act="rsvpthen" data-night="' + esc(nightId) +
      '" data-status="maybe">&#129300; Maybe</button></div>';
  }

  /* The lock rule, drawn: one slot per human vote with a tick at the landslide line.
     Jokers never appear here — they cannot lock a night, so they cannot move this bar. */
  function voteBar(votes, threshold){
    var slots = Math.max(threshold + 1, votes + 1);
    var out = [];
    for (var i = 0; i < slots; i++) {
      out.push('<span class="vs' + (i < votes ? ' on' : '') +
        (i + 1 === threshold ? ' tick' : '') + '"></span>');
    }
    return out.join('');
  }

  /* A candidate card: the film, who entered it, and what the room has put on it. */
  function entryTile(c, opts){
    opts = opts || {};
    var maj = opts.majority || {};
    var isLock = !!(maj.locked && maj.leading && c.film_id === maj.leading);
    var mine = c.member_id === myId();
    var act = opts.act ? ' data-act="' + opts.act + '" data-id="' + esc(c.film_id) + '"' : '';
    var chips = [];
    if (c.votes) chips.push('<span class="mini v">' + c.votes + ' &#128499;&#65039;</span>');
    /* A joker is public: show whose it was, and fall back to a count if the name is missing. */
    var players = c.joker_players || [];
    if (players.length) {
      players.forEach(function(j){
        chips.push('<span class="mini j">&#127183; ' + esc(j.emoji) + ' ' + esc(j.name) + '</span>');
      });
    } else if (c.jokers) {
      chips.push('<span class="mini j">' + c.jokers + ' &#127183;</span>');
    }
    return '<div class="tile' + (opts.picked ? ' picked' : '') + '"' + act + '>' +
      '<span class="badge">' + (isLock ? 'LOCKED' : odds(c)) + '</span>' +
      (mine ? '<div class="tags"><span class="tag out" title="Your own film. Play a joker on it instead.">yours</span></div>' : '') +
      poster(c.title, c.poster) +
      '<div class="t-title">' + esc(c.title) + '</div>' +
      '<div class="t-by"><span class="dot" style="background:' + safeColor(c.color) + '"></span>' +
        esc(c.emoji) + ' ' + esc(c.member) + '</div>' +
      (opts.threshold
        ? '<div class="bar">' + voteBar(c.votes || 0, opts.threshold) + '</div>'
        : '') +
      (chips.length ? '<div class="chiprow">' + chips.join('') + '</div>' : '') +
      (opts.picked ? '<div class="picked-tag">your vote</div>' : '') +
      '</div>';
  }

  /* ------------------------------------------------ views */
  function skeleton(){
    return '<div class="card"><div class="sk" style="height:14px;width:80px"></div>' +
      '<div class="sk" style="height:28px;width:70%;margin-top:12px"></div>' +
      '<div class="sk" style="height:44px;margin-top:20px"></div></div>' +
      '<div class="card"><div class="sk" style="height:14px;width:110px"></div>' +
      '<div class="sk" style="height:150px;margin-top:14px"></div></div>';
  }

  function viewTonight(){
    var n = S.night;
    if (!n) {
      return '<div class="card">' + empty('&#127871;',
        'No night planned yet. A host will set up the next one.') +
        '</div>' + comingUp(null);
    }
    var out = [];
    out.push('<div class="card">');
    out.push('<div class="row between"><div>');
    out.push('<div class="eyebrow">' + (n.status === 'watched' ? 'Last night' : 'Next up') + '</div>');
    out.push('<div class="date">' + esc(n.label) + '</div>');
    if (n.date_label) out.push('<div class="whenline">' + esc(n.date_label) + '</div>');
    if (n.theme) out.push('<div class="theme">&#127917; ' + esc(n.theme) + '</div>');
    out.push('</div><span class="pill">' + esc(statusPill(n.status)) + '</span></div>');
    if (n.notes) out.push('<p class="notes">' + esc(n.notes) + '</p>');

    var mine = S.my_rsvp || {};
    var mineStatus = mine.status || null;
    var minePlus = mine.plus_ones === 1;
    out.push('<div class="seg">' +
      '<button data-act="rsvp" data-status="in" class="' + (mineStatus === 'in' ? 'on' : '') + '">&#127881; In</button>' +
      '<button data-act="rsvp" data-status="maybe" class="' + (mineStatus === 'maybe' ? 'on' : '') + '">&#129300; Maybe</button>' +
      '<button data-act="rsvp" data-status="out" class="' + (mineStatus === 'out' ? 'on' : '') + '">&#128575; Out</button>' +
      '</div>');
    out.push('<div class="plusrow">' +
      '<button class="plus' + (minePlus ? ' on' : '') + '" data-act="plus">&#10133; +1</button>' +
      '<span class="tiny muted">' +
      (minePlus ? 'Bringing one guest. Tap to remove them.' : 'Bringing someone? Tap +1.') +
      '</span></div>');

    if (n.status !== 'watched') {
      out.push('<div class="snackrow"><input id="sn" type="text" autocomplete="off" maxlength="60" ' +
        'placeholder="bringing something?" value="' + esc(mine.snack || '') + '">' +
        '<button class="ghostbtn" data-act="snack">Save</button>' +
        (mine.snack ? '<button class="ghostbtn" data-act="snackclear">Clear</button>' : '') +
        '</div>');
    }

    var list = n.rsvps || [];
    if (list.length) {
      var order = { 'in':0, 'maybe':1, 'out':2 };
      var sorted = list.slice().sort(function(a, b){ return order[a.status] - order[b.status]; });
      out.push('<div class="faces">' + sorted.map(function(r){
        return '<span class="face ' + esc(r.status) + '">' + avatar(r) + esc(r.name) +
          (r.plus_ones === 1 ? ' +1' : '') + '</span>';
      }).join('') + '</div>');
      out.push(seatRow(n));
      var spread = n.snacks || [];
      if (spread.length) {
        out.push('<div class="spread"><div class="eyebrow">&#127871; On the table</div>' +
          '<div class="faces">' + spread.map(function(s){
            return '<span class="face">' + avatar(s) + esc(s.name) +
              ' <span class="muted">&mdash; ' + esc(s.snack) + '</span></span>';
          }).join('') + '</div></div>');
      }
    } else {
      out.push('<div class="tiny muted mt">Are you coming? Select one of the options above.</div>');
      out.push(seatRow(n));
    }
    out.push('</div>');

    if (n.entries_open) out.push(myEntryCard(n));
    out.push(lineUp(n));
    out.push(comingUp(n));
    return out.join('');
  }

  /* The same fourteen-seat picture the Big Screen draws, at phone scale. */
  function seatRow(n){
    var cap = n.seat_cap || 14;
    var taken = [];
    (n.rsvps || []).forEach(function(r){
      if (r.status !== 'in') return;
      taken.push({ r: r, guest: false });
      if (r.plus_ones === 1) taken.push({ r: r, guest: true });
    });
    var dots = [];
    for (var i = 0; i < cap; i++) {
      var t = taken[i];
      dots.push(t
        ? '<span class="sdot' + (t.guest ? ' guest' : '') + '" title="' +
          esc(t.r.name) + (t.guest ? ' +1' : '') + '">' + esc(t.r.emoji) + '</span>'
        : '<span class="sdot free"></span>');
    }
    var seats = n.seats == null ? taken.length : n.seats;
    return '<div class="seatrow">' + dots.join('') + '</div>' +
      '<div class="capline"><b>' + seats + ' of ' + cap + '</b><span>seats taken</span></div>';
  }

  /* Rule one: one film each, and entering means you are coming. */
  function myEntryCard(n){
    var mineFilm = null;
    (n.entries || []).forEach(function(c){ if (c.member_id === myId()) mineFilm = c; });
    var canEnter = attending(S.my_rsvp);
    var out = ['<div class="sec"><div class="eyebrow">Your entry</div>'];
    if (!canEnter && !mineFilm) {
      out.push('<div class="mine slot">' +
        '<div class="t">' + GATE + '</div>' +
        '<div class="tiny muted" style="margin-top:6px">The In and Maybe buttons are ' +
        'just above &mdash; then the film.</div></div></div>');
      return out.join('');
    }
    if (mineFilm) {
      out.push('<div class="mine"><div class="row">' +
        poster(mineFilm.title, mineFilm.poster) +
        '<div><div class="t">' + esc(mineFilm.title) +
        (mineFilm.year ? ' <span class="muted" style="font-weight:600">(' + esc(mineFilm.year) + ')</span>' : '') +
        '</div><div class="tiny muted" style="margin-top:5px">Your film for this night. ' +
        'Everyone votes for someone else&rsquo;s.</div></div></div>' +
        (canEnter
          ? '<div class="cta">' +
            '<button class="go" data-act="picker" data-night="' + esc(n.id) + '">Swap it</button>' +
            '<button data-act="withdraw" data-night="' + esc(n.id) + '">Withdraw</button>' +
            '</div>'
          : '<div class="tiny muted" style="margin-top:11px">' + GATE +
            ' &mdash; the buttons are just above.</div>' +
            '<div class="cta"><button data-act="withdraw" data-night="' + esc(n.id) +
            '">Withdraw</button></div>') +
        '</div>');
    } else {
      out.push('<div class="mine slot">' +
        '<div class="t">No film entered yet</div>' +
        '<div class="tiny muted" style="margin-top:6px">Choose one film for this night. ' +
        'It goes straight on the wheel.</div>' +
        '<div class="cta"><button class="go" data-act="picker" data-night="' + esc(n.id) +
        '">Enter a film</button></div></div>');
    }
    if (pickerFor === n.id && canEnter) out.push(picker(n));
    out.push('</div>');
    return out.join('');
  }

  /* Search the world, or re-enter something the Den already owns. */
  function picker(n){
    var lib = S.library || [];
    var taken = {};
    (n.entries || n.taken_film_ids || []).forEach(function(c){
      if (typeof c === 'string') taken[c] = true;
      else if (c.member_id !== myId()) taken[c.film_id] = true;
    });
    var minefirst = lib.filter(function(f){
      return f.brought_by && f.brought_by.member_id === myId();
    });
    var pick = (minefirst.length ? minefirst : lib).slice(0, 6);
    var out = ['<div class="card" style="margin-top:12px">'];
    out.push('<div class="eyebrow">Find one</div>' +
      '<div class="field"><input id="q" type="text" autocomplete="off" placeholder="The Iron Giant">' +
      '<button id="add" data-act="entertitle" data-night="' + esc(n.id) + '">Enter</button></div>' +
      '<div class="prev" id="prev"></div>');
    if (pick.length) {
      out.push('<div class="eyebrow" style="margin-top:18px">' +
        (minefirst.length ? 'Films you have brought' : 'On the shelf') + '</div>');
      out.push('<div class="lib">' + pick.map(function(f){
        var isTaken = !!taken[f.film_id];
        return '<div class="tile"' +
          (isTaken ? '' : ' data-act="enterfilm" data-id="' + esc(f.film_id) +
            '" data-night="' + esc(n.id) + '"') + '>' +
          poster(f.title, f.poster) +
          '<div class="t-title">' + esc(f.title) + '</div>' +
          (isTaken ? '<div class="tiny muted">taken tonight</div>' : '') +
          '</div>';
      }).join('') + '</div>');
    }
    out.push('<div class="tiny muted" style="margin-top:12px">' +
      'No two people can enter the same film on the same night.</div>');
    out.push('</div>');
    return out.join('');
  }

  /* The night's line-up: vote when it opens, burn a joker whenever you like. */
  function lineUp(n){
    var entries = n.entries || [];
    if (!entries.length) {
      return '<div class="sec"><div class="eyebrow">The line-up</div>' +
        '<h1 class="h">Nothing entered yet</h1>' +
        '<div class="card">' + empty('&#127916;',
          'No films yet.') + '</div></div>';
    }
    var maj = n.majority || {};
    var voting = n.status === 'locked';
    var ownNote = ownNoteFor === n.id ? ownNoteFilm : '';
    var mineStatus = (S.my_rsvp || {}).status || null;
    var canAct = mineStatus === 'in' || mineStatus === 'maybe';
    var picked = S.my_vote;
    var out = ['<div class="sec"><div class="eyebrow">The line-up</div>' +
      '<h1 class="h">' + (voting ? 'Vote for one' : entries.length + ' in the running') + '</h1>'];
    if (maj.locked) {
      out.push('<div class="lockbar">Locked by majority &middot; ' + (maj.leading_votes || 0) +
        ' of ' + (maj.attendee_basis || 0) + '</div>');
    }
    var cap = n.seat_cap || 14;
    var slots = entries.map(function(c){
      var own = c.member_id === myId();
      /* Your own film still answers a tap — with the reason, and the joker route. */
      var act = jokerArmed ? 'joker' : (voting && canAct ? (own ? 'ownfilm' : 'vote') : null);
      return entryTile(c, { act: act, picked: c.film_id === picked, majority: maj,
        threshold: voting ? (maj.threshold || 4) : 0 });
    });
    /* A few empty frames so a thin line-up reads as room to fill, not as a fault. */
    var openSlots = Math.max(0, Math.min(4, cap - entries.length));
    for (var g = 0; g < openSlots; g++) {
      slots.push('<div class="tile"><div class="frame"></div>' +
        '<div class="slotcount">open</div></div>');
    }
    out.push('<div class="rail">' + slots.join('') + '</div>');
    if (ownNote) {
      var bal = (S.me && S.me.jokers) || 0;
      out.push('<div class="ownnote">You cannot vote for your own submission. ' +
        'A joker is the way to back it &mdash; ' +
        (S.my_joker
          ? 'and yours is already on the table tonight.'
          : bal > 0
          ? 'you have ' + bal + ' banked.'
          : 'you have none banked yet.') +
        '</div>' +
        (canAct && bal > 0 && !S.my_joker
          ? '<div class="cta"><button class="go" data-act="joker" data-id="' + esc(ownNote) +
            '">&#127183; Play a joker on it</button></div>'
          : ''));
    }

    if (jokerArmed) {
      out.push('<div class="tiny muted" style="margin-top:6px">' +
        'Choose a film for your joker. Your own counts too.</div>');
    } else if (voting) {
      out.push('<div class="tiny muted" style="margin-top:6px">' +
        (canAct
          ? 'Choose one film &mdash; not your own. If ' + (maj.threshold || 2) +
            ' of you choose the same one and it is clearly ahead, it wins outright.'
          : 'Are you coming? Select one of the options above, then vote.') +
        '</div>');
    } else {
      out.push('<div class="tiny muted" style="margin-top:6px">' +
        'Voting opens when a host calls it. Weight is 1 + votes + jokers.</div>');
    }

    var bal = (S.me && S.me.jokers) || 0;
    var played = S.my_joker;
    var canJoker = voting && canAct && bal > 0 && !played;
    out.push('<div class="jokerbar">' +
      '<button class="jokerbtn' + (jokerArmed ? ' armed' : '') + '" data-act="armjoker"' +
      (canJoker ? '' : ' disabled') + '>&#127183; ' + (jokerArmed ? 'Pick a film' : bal + ' banked') +
      '</button><span class="tiny muted">' +
      (played
        ? 'Joker played for tonight.'
        : bal === 0
        ? 'No jokers banked. You earn one when a night you entered does not win.'
        : !voting
        ? 'You can play it once voting opens.'
        : !canAct
        ? 'Mark yourself attending first.'
        : '+1 weight on any film, yours included. It never counts toward the majority.') +
      '</span></div>');
    out.push('</div>');
    return out.join('');
  }

  /* Nights already on the books beyond tonight. */
  function comingUp(current){
    var list = (S.upcoming || []).filter(function(u){ return !current || u.id !== current.id; });
    if (!list.length) return '';
    var out = ['<div class="sec"><div class="eyebrow">Coming up</div>' +
      '<h1 class="h">' + list.length + (list.length === 1 ? ' night booked' : ' nights booked') +
      '</h1>'];
    out.push(list.map(function(u){
      var bits = [];
      if (u.date_label) bits.push(esc(u.date_label));
      else if (u.starts_at) bits.push(esc(fmtDate(u.starts_at)));
      if (u.headcount) bits.push(u.headcount + ' coming');
      bits.push(u.entry_count + (u.entry_count === 1 ? ' entry' : ' entries'));
      var canEnter = attending(u.my_rsvp);
      var gate = '<div class="tiny muted" style="margin-top:11px">' + GATE + '</div>' +
        rsvpPair(u.id);
      var body = u.my_entry
        ? '<div class="row" style="margin-top:11px;gap:11px">' +
          poster(u.my_entry.title, u.my_entry.poster) +
          '<div><div class="tiny muted">Your entry</div><div class="t">' +
          esc(u.my_entry.title) + '</div></div></div>' +
          (canEnter
            ? '<div class="cta"><button class="go" data-act="picker" data-night="' + esc(u.id) +
              '">Swap it</button><button data-act="withdraw" data-night="' + esc(u.id) +
              '">Withdraw</button></div>'
            : gate + '<div class="cta"><button data-act="withdraw" data-night="' + esc(u.id) +
              '">Withdraw</button></div>')
        : (canEnter
          ? '<div class="cta"><button class="go" data-act="picker" data-night="' + esc(u.id) +
            '">Enter a film</button></div>'
          : gate);
      return '<div class="up"><div class="when">' + esc(u.label) + '</div>' +
        (u.theme ? '<div class="th">&#127917; ' + esc(u.theme) + '</div>' : '') +
        (bits.length ? '<div class="meta">' + bits.join(' &middot; ') + '</div>' : '') +
        body +
        (pickerFor === u.id && canEnter ? picker(u) : '') +
        '</div>';
    }).join(''));
    out.push('</div>');

  }

  /* The shelf: everything the Den has ever brought in. */
  function viewLibrary(){
    var lib = S.library || [];
    var shown = lib.filter(function(f){
      return libFilter === 'all' || (libFilter === 'watched' ? f.watched : !f.watched);
    });
    var out = ['<div class="eyebrow">The library</div><h1 class="h">' + lib.length +
      (lib.length === 1 ? ' film on the shelf' : ' films on the shelf') + '</h1>'];

      ['all', 'watched', 'unwatched'].map(function(f){
        return '<button data-act="filter" data-f="' + f + '" class="' +
          (libFilter === f ? 'on' : '') + '">' + f + '</button>';
      }).join('') + '</div>');
    if (!shown.length) {
      out.push('<div class="card" style="margin-top:14px">' +
        empty('&#128218;', lib.length
          ? 'No films match that filter.'
          : 'No films yet. Anything entered lands here.') + '</div>');
      return out.join('');
    }
    out.push('<div class="lib">' + shown.map(function(f){
      var avg = f.avg_paws == null ? null : Math.round(f.avg_paws * 10) / 10;
      return '<div class="tile" data-act="dossier" data-id="' + esc(f.film_id) + '">' +
        (avg != null ? '<span class="badge">&#128062; ' + avg.toFixed(1) + '</span>' : '') +
        (f.watched ? '<span class="seen">seen</span>' : '') +
        poster(f.title, f.poster) +
        '<div class="t-title">' + esc(f.title) + '</div></div>';
    }).join('') + '</div>');
    return out.join('');
  }

    if (!h.length) {
      return '<div class="eyebrow">History</div><h1 class="h">Nothing yet</h1><div class="card">' +

            (n.queued && avg == null

            pawRow(f.my_paws || 0, { act:true, night:n.night_id, film:f.film_id, small:true }) +

  function viewStats(){
    var st = S.stats || { cards:[] };
    var avg = st.avg_paws == null ? null : Math.round(st.avg_paws * 10) / 10;
    var out = ['<div class="eyebrow">Folklore</div><h1 class="h">The receipts</h1>'];
    out.push('<div class="summary">' +

    out.push((st.cards || []).map(function(c){
      var accent = safeColor(c.member && c.member.color);

        ? esc(c.member.emoji) + ' ' + esc(c.headline)
        : esc(c.headline);
      return '<div class="stat" style="--accent:' + accent + '"><div class="bd">' +
        '<div class="badge2">' + esc(c.badge) + '</div>' +
        '<div class="st-title">' + esc(c.title) + '</div>' +

  /* The group's running list of theme ideas. Hosts pick from it when they announce a night. */
  function themePanel(){
    var list = S.themes || [];
    var out = ['<div class="sec"><div class="eyebrow">Theme ideas</div>' +
      '<h1 class="h">What should we watch?</h1>'];

  /* TMDB serves the logos; w92 is their own recommendation for a chip this size. */
  var TMDB_IMG = 'https://image.tmdb.org/t/p/w92';

  /**
   * The closest thing each storefront has to a front door for one film: a search for the
   * exact title on the big services, and the TMDB watch page (real deep links, kept by
   * JustWatch) for anything we don't know a pattern for. Same map as the big screen.
   */
  function providerUrl(name, title, fallback){
    var n = String(name || '').toLowerCase();
    var q = encodeURIComponent(title || '');
    if (n.indexOf('netflix') >= 0) return 'https://www.netflix.com/search?q=' + q;
    if (n.indexOf('disney') >= 0) return 'https://www.disneyplus.com/search?q=' + q;
    /* Amazon channels (Crave/Starz "…Amazon Channel") play inside Prime Video. */
    if (n.indexOf('amazon') >= 0 || n.indexOf('prime') >= 0) {
      return 'https://www.primevideo.com/search?phrase=' + q;
    }
    if (n.indexOf('apple tv') >= 0) return 'https://tv.apple.com/ca/search?term=' + q;
    if (n.indexOf('crave') >= 0) return 'https://www.crave.ca/en/search?q=' + q;
    if (n.indexOf('google play') >= 0) {
      return 'https://play.google.com/store/search?c=movies&q=' + q;
    }
    if (n.indexOf('youtube') >= 0) return 'https://www.youtube.com/results?search_query=' + q;
    if (n.indexOf('tubi') >= 0) return 'https://tubitv.com/search/' + q;
    if (n.indexOf('plex') >= 0) return 'https://watch.plex.tv/search?q=' + q;
    return fallback || ('https://www.google.com/search?q=' + q + '+watch+' +
      encodeURIComponent(name || ''));
  }

  function watchRow(key, list, title, fallback){
    if (!list || !list.length) return '';
    return '<div class="wrow"><span class="wk">' + key + '</span><span class="wp">' +
      list.map(function(p){
        return '<a href="' + esc(providerUrl(p.name, title, fallback)) +
          '" target="_blank" rel="noopener">' +
          (p.logo ? '<img src="' + esc(TMDB_IMG + p.logo) + '" alt="">' : '') +
          esc(p.name) + '</a>';
      }).join('') + '</span></div>';
  }

  /**
   * Where to watch it. Nothing at all when the film has never been looked up or has nothing
   * on offer. The attribution line is required by TMDB's terms and is never optional.
   */
  function watchBlock(w, title){
    if (!w) return '';
    var rows = watchRow('Stream', w.flatrate, title, w.link) +
      watchRow('Rent', w.rent, title, w.link) + watchRow('Buy', w.buy, title, w.link);
    if (!rows && !w.link) return '';
    return '<div class="watch">' + rows +
      (w.link ? '<a class="wlink" href="' + esc(w.link) + '" target="_blank" rel="noopener">' +
        'more on TMDB &#8599;</a>' : '') +
      '<div class="wattr">streaming data by JustWatch via TMDB</div></div>';
  }

  /* The trailer, one tap away. A known key plays right here in the cinema overlay; with
     no key the badge falls back to an exact-title YouTube search. */
  function trailerBtn(f){
    var w = f.watch_providers;
    var key = w && w.trailer ? String(w.trailer) : '';
    var href = key
      ? 'https://www.youtube.com/watch?v=' + encodeURIComponent(key)
      : 'https://www.youtube.com/results?search_query=' +
        encodeURIComponent(f.title + ' ' + (f.year || '') + ' trailer');
    return '<a class="playbtn" href="' + esc(href) + '" target="_blank" rel="noopener"' +
      (key ? ' data-trailer="' + esc(key) + '"' : '') +
      ' aria-label="Watch the trailer"><span>&#9654;</span></a>';
  }

  /* ---------------- the cinema overlay ---------------- */
  function openCinema(key){

    el.innerHTML = '<div class="cscrim" data-cclose="1"></div>' +
      '<div class="cframe"><button class="cx" data-cclose="1">close</button>' +
      '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(key) +
      '?autoplay=1&rel=0&playsinline=1" title="Trailer"' +
      ' allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>';
    el.className = 'on';
  }
  /* Emptying the overlay is what stops the sound. */
  function closeCinema(){
    var el = document.getElementById('cinema');
    el.className = '';
    el.innerHTML = '';
  }

  /* ------------------------------------------------ the dossier sheet */
  function renderSheet(){
    if (!dossier) { sheetEl.innerHTML = ''; return; }
    if (dossier.loading) {
      sheetEl.innerHTML = '<div class="sheet"><div class="inner">' +
        '<div class="tiny muted">Loading...</div></div></div>';
      return;
    }
    var f = dossier.film || {};
    var st = dossier.stats || {};
    var tl = dossier.timeline || [];
    var avg = st.avg_paws == null ? null : Math.round(st.avg_paws * 10) / 10;
    var facts = [];
    if (f.year) facts.push(esc(f.year));
    if (f.runtime) facts.push(esc(f.runtime));
    if (avg != null) facts.push('&#128062; ' + avg.toFixed(1) + ' from ' + st.rating_count);
    var out = ['<div class="sheet" data-act="closesheet"><div class="inner">'];
    out.push('<button class="x" data-act="closesheet">close</button>');
    out.push('<div class="hd"><div class="pw">' + poster(f.title, f.poster) + trailerBtn(f) +
      '</div><div><h2>' + esc(f.title) + '</h2>' +
      (facts.length ? '<div class="tiny muted" style="margin-top:7px">' + facts.join(' &middot; ') + '</div>' : '') +
      (f.brought_by
        ? '<div class="tiny muted" style="margin-top:6px">brought in by ' + esc(f.brought_by.emoji) +
          ' ' + esc(f.brought_by.name) + '</div>'
        : '') +
      ((f.genres && f.genres.length)
        ? '<div class="gen">' + f.genres.map(function(g){
            return '<span class="mini">' + esc(g) + '</span>';
          }).join('') + '</div>'
        : '') +
      '</div></div>');
    if (f.synopsis) out.push('<p class="syn">' + esc(f.synopsis) + '</p>');
    var cast = (f.cast_list || []).slice(0, 3);
    if (cast.length) {
      out.push('<div class="castline">with ' + cast.map(esc).join(', ') +
        ((f.cast_list || []).length > 3 ? '...' : '') + '</div>');
    }
    out.push('<div class="tl"><div class="eyebrow">In the Den</div>');
    if (!tl.length) {
      out.push('<div class="tiny muted" style="margin-top:10px">On the shelf, not entered yet.</div>');
    } else {
      out.push(tl.map(function(t){
        var bits = [];
        if (t.votes) bits.push(t.votes + ' &#128499;&#65039;');
        if (t.jokers) bits.push(t.jokers + ' &#127183;');
        return '<div class="tlrow"><div>' + esc(t.label) +
          (t.entered_by ? ' <span class="muted">&middot; ' + esc(t.entered_by.name) + '</span>' : '') +
          (bits.length ? ' <span class="muted">&middot; ' + bits.join(' ') + '</span>' : '') +
          '</div><div class="w">' +
          (t.won ? (t.by_majority ? 'won by majority' : 'won') : 'lost') + '</div></div>';
      }).join(''));
    }
    out.push('</div>');
    var totals = [];
    if (f.director) {
      out.push('<div class="castline"><b style="color:var(--text)">Directed by</b> ' +
        esc(f.director) + '</div>');
    }
    totals.push(st.times_entered + (st.times_entered === 1 ? ' entry' : ' entries'));
    if (st.total_votes) totals.push(st.total_votes + ' votes');
    if (st.total_jokers) totals.push(st.total_jokers + ' jokers burned');
    out.push('<div class="tiny muted" style="margin-top:14px">' + totals.join(' &middot; ') + '</div>');
    out.push(watchBlock(f.watch_providers, f.title));
    out.push('</div></div>');
    sheetEl.innerHTML = out.join('');
  }

  function render(){
    if (!S) { view.innerHTML = skeleton(); return; }
    var me = S.me;
    document.getElementById('whoami').innerHTML =
      '<span class="mechip">' + avatar(me) + esc(me.name) +
      ' &middot; ' + (me.jokers || 0) + '&#127183;' +
      (me.is_host ? ' &middot; host' : '') + '</span>';
    if (tab === 'tonight') view.innerHTML = viewTonight();
    else if (tab === 'library') view.innerHTML = viewLibrary();
    else if (tab === 'history') view.innerHTML = viewHistory();
    else view.innerHTML = viewStats();

    var q = document.getElementById('q');
    if (q) {
      q.value = query;
      q.addEventListener('input', onQuery);
      q.addEventListener('keydown', function(e){ if (e.key === 'Enter') doEnterTitle(); });
      if (query) renderPreview(lastPreview);
    }
    var sn = document.getElementById('sn');
    if (sn) {
      sn.addEventListener('keydown', function(e){
        if (e.key === 'Enter') doSnack(sn.value.trim());
      });
    }
    var th = document.getElementById('th');
    if (th) {
      th.value = themeDraft;
      th.addEventListener('input', function(e){ themeDraft = e.target.value; });
      th.addEventListener('keydown', function(e){ if (e.key === 'Enter') doSuggestTheme(); });
    }
    renderSheet();
  }

  function gate(){
    document.body.innerHTML =
      '<div class="gate"><div class="box"><div class="big">&#127917;</div>' +
      '<h2>Open me from Telegram</h2>' +
      '<p>The Den opens from inside Telegram. Tap below, then open it from the bot. ' +
      '&#128062;</p>' +
      '<a class="gatebtn" href="https://t.me/kits_movienight_bot">Open @kits_movienight_bot</a>' +
      '<p class="after">then tap the menu button and pick <b>The Den</b></p>' +
      '</div></div>';
  }

  /* ------------------------------------------------ data */
  function load(){
    return api('me').then(function(j){
      if (j.__status === 401) { gate(); return; }
      if (!j.ok) { toast('That did not load. Try again in a moment.', true); return; }
      S = j;
      render();
    }).catch(function(){
      toast('No signal from the Den.', true);
    });
  }

  /* Every night-writing endpoint hands back the same shape. */
  function applyNight(j){
    if (j.entries && S.night) S.night.entries = j.entries;
    if (j.majority && S.night) S.night.majority = j.majority;
    if (j.upcoming) S.upcoming = j.upcoming;
    if (typeof j.my_entry !== 'undefined') S.my_entry = j.my_entry;
  }

  /* ------------------------------------------------ actions */
  function doRsvp(status, plusOnes){
    if (!S.night || busy) return;
    busy = true;
    haptic('light');
    var was = S.my_rsvp;
    var next = {
      status: status,
      plus_ones: plusOnes == null ? ((was && was.plus_ones) || 0) : plusOnes,
      snack: (was && was.snack) || null
    };
    if (next.plus_ones === 1) next.status = 'in';
    if (next.status === 'out') next.plus_ones = 0;
    S.my_rsvp = next;
    render();
    var payload = { night_id: S.night.id, status: status };
    if (plusOnes != null) payload.plus_ones = plusOnes;
    api('rsvp', payload).then(function(j){
      busy = false;
      if (!j.ok) { S.my_rsvp = was; render(); toast('Could not save that.', true); return; }
      S.my_rsvp = j.my_rsvp || next;
      S.night.rsvps = j.rsvps || S.night.rsvps;
      if (j.snacks) S.night.snacks = j.snacks;
      if (typeof j.headcount === 'number') S.night.headcount = j.headcount;
      render();
      if (plusOnes === 1) toast('+1 riding along.');
      else if (plusOnes === 0) toast('+1 dropped.');
      else toast(status === 'in' ? 'You are in.' : status === 'maybe' ? 'Marked as maybe.' : 'Marked as out.');
    }).catch(function(){ busy = false; S.my_rsvp = was; render(); toast('Could not save that.', true); });
  }

  /* The gate's own buttons: mark attending, then open the film picker for that night. */
  function doRsvpThen(nightId, status){
    if (busy) return;
    busy = true;
    haptic('light');
    api('rsvp', { night_id: nightId, status: status }).then(function(j){
      busy = false;
      if (!j.ok) { toast('Could not save that.', true); return; }
      pickerFor = nightId;
      load();
      toast(status === 'in' ? 'You are in. Now the film.' : 'Noncommittal. Now the film.');
    }).catch(function(){ busy = false; toast('Could not save that.', true); });
  }

  function doSnack(text){
    if (!S.night || busy) return;
    busy = true;
    haptic('light');
    api('rsvp', { night_id: S.night.id, snack: text }).then(function(j){
      busy = false;
      if (!j.ok) { toast('That did not save.', true); return; }
      S.my_rsvp = j.my_rsvp || S.my_rsvp;
      S.night.rsvps = j.rsvps || S.night.rsvps;
      if (j.snacks) S.night.snacks = j.snacks;
      if (typeof j.headcount === 'number') S.night.headcount = j.headcount;
      render();
      toast(text ? 'On the table.' : 'Taken off the table.');
    }).catch(function(){ busy = false; toast('That did not save.', true); });
  }

  /* Enter, swap or withdraw. The server enforces one each and one copy of a film. */
  function doEnter(payload, okMsg){
    if (busy) return;
    busy = true;
    haptic('medium');
    api('enter', payload).then(function(j){
      busy = false;
      if (!j.ok) {
        toast(j.message || (j.error === 'entries_closed'
          ? 'Entries for that night are closed.'
          : 'That did not go in.'), true);
        return;
      }
      pickerFor = null;
      query = '';
      lastPreview = null;
      applyNight(j);
      toast(okMsg);
      load();
    }).catch(function(){ busy = false; toast('That did not go in.', true); });
  }

  function doEnterTitle(){
    var q = document.getElementById('q');
    if (!q || !pickerFor) return;
    var title = q.value.trim();
    if (title.length < 2) { toast('Give it a title first.', true); return; }
    doEnter({ night_id: pickerFor, title: title }, 'Entered. Good luck.');
  }

  function doVote(filmId){
    if (!S.night || busy) return;
    busy = true;
    haptic('light');
    var was = S.my_vote;
    S.my_vote = filmId;
    render();
    api('vote', { night_id: S.night.id, film_id: filmId }).then(function(j){
      busy = false;
      if (!j.ok) {
        S.my_vote = was; render();
        toast(j.message || (j.error === 'voting_closed'
          ? 'Voting is closed. The wheel has moved on.'
          : 'Vote did not stick.'), true);
        return;
      }
      applyNight(j);
      render();
      toast(j.majority && j.majority.locked && j.majority.leading === filmId
        ? 'That is a majority. It is locked in unless the room changes its mind.'
        : 'Vote counted. +1 weight on that film.');
    }).catch(function(){ busy = false; S.my_vote = was; render(); toast('Vote did not stick.', true); });
  }

  function doJoker(filmId){
    if (!S.night || busy) return;
    busy = true;
    haptic('medium');
    api('joker', { night_id: S.night.id, film_id: filmId }).then(function(j){
      busy = false;
      jokerArmed = false;
      if (!j.ok) { render(); toast(j.message || 'The joker stayed in the bank.', true); return; }
      S.my_joker = filmId;
      if (typeof j.jokers_left === 'number') S.me.jokers = j.jokers_left;
      applyNight(j);
      render();
      toast('Joker played. +1 weight, and it does not count toward the majority.');
    }).catch(function(){ busy = false; jokerArmed = false; render(); toast('The joker stayed in the bank.', true); });
  }

  function doRate(nightId, filmId, paws){
    if (busy || !filmId) return;
    busy = true;
    haptic('light');
    api('rate', { night_id: nightId, film_id: filmId, paws: paws }).then(function(j){
      busy = false;
      if (!j.ok) { toast(j.message || 'Rating did not save.', true); return; }
      (S.history || []).forEach(function(n){
        if (n.night_id !== nightId) return;
        (n.films || []).forEach(function(f){
          if (f.film_id === filmId) {
            f.my_paws = paws;
            f.avg_paws = j.avg_paws;
            f.rating_count = j.rating_count;
          }
        });
      });
      render();
      toast('Rating saved.');
    }).catch(function(){ busy = false; toast('Rating did not save.', true); });
  }

  function doSuggestTheme(){
    var box = document.getElementById('th');
    if (!box || busy) return;
    var text = box.value.trim();
    if (text.length < 2) { toast('Give the theme a name first.', true); return; }
    busy = true;
    api('suggesttheme', { text: text }).then(function(j){
      busy = false;
      if (!j.ok) { toast(j.message || 'That did not go up.', true); return; }
      themeDraft = '';
      S.themes = j.themes || S.themes;
      render();
      toast('On the list. Hosts pick from it.');
      haptic('medium');
    }).catch(function(){ busy = false; toast('That did not go up.', true); });
  }

  function openDossier(filmId){
    dossier = { loading: true };
    renderSheet();
    api('film', { film_id: filmId }).then(function(j){
      if (!j.ok) { dossier = null; renderSheet(); toast('Could not load that one.', true); return; }
      dossier = j;
      renderSheet();
    }).catch(function(){ dossier = null; renderSheet(); toast('Could not load that one.', true); });
  }

  /* ------------------------------------------------ live lookup preview */
  var lastPreview = null;
  function onQuery(e){
    query = e.target.value;
    clearTimeout(previewTimer);
    var q = query.trim();
    if (q.length < 3) { lastPreview = null; renderPreview(null); return; }
    previewTimer = setTimeout(function(){ fetchPreview(q); }, 420);
  }
  function fetchPreview(q){
    fetch('https://v3-cinemeta.strem.io/catalog/movie/top/search=' + encodeURIComponent(q) + '.json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (query.trim() !== q) return;
        var m = d && d.metas && d.metas[0];
        lastPreview = m ? { title:m.name, year:m.releaseInfo, poster:m.poster } : null;
        renderPreview(lastPreview);
      })
      .catch(function(){ /* preview is a nicety; the server does the real lookup */ });
  }
  function renderPreview(p){
    var el = document.getElementById('prev');
    if (!el) return;
    if (!p) { el.className = 'prev'; el.innerHTML = ''; return; }
    el.className = 'prev on';
    el.innerHTML = poster(p.title, p.poster) +
      '<div><div style="font-weight:700;font-size:14px;letter-spacing:-.02em">' + esc(p.title) + '</div>' +
      '<div class="tiny muted" style="margin-top:3px">' +
      (p.year ? esc(p.year) + ' &middot; ' : '') + 'looks like this one</div></div>';
  }

  /* ------------------------------------------------ wiring */
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.getAttribute('data-tab');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
      x.className = x.getAttribute('data-tab') === tab ? 'on' : '';
    });
    haptic('light');
    render();
    window.scrollTo(0, 0);
  });

  sheetEl.addEventListener('click', function(e){
    /* A play badge with a known key stays in the app: the cinema, not the browser. */
    var tr = e.target.closest('[data-trailer]');
    if (tr) { e.preventDefault(); openCinema(tr.getAttribute('data-trailer')); return; }
    /* A link is a departure, not a dismissal — leave the sheet as they left it. */
    if (e.target.closest('a')) return;
    var el = e.target.closest('[data-act]');
    if (el && el.getAttribute('data-act') === 'closesheet') { dossier = null; renderSheet(); }
  });
  document.getElementById('cinema').addEventListener('click', function(e){
    if (e.target.closest('[data-cclose]')) closeCinema();
  });

  view.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el || !S) return;
    var act = el.getAttribute('data-act');
    if (act === 'rsvp') doRsvp(el.getAttribute('data-status'), null);
    else if (act === 'plus') {
      var mineNow = S.my_rsvp || {};
      var adding = mineNow.plus_ones !== 1;
      doRsvp(adding ? 'in' : (mineNow.status || 'in'), adding ? 1 : 0);
    }
    else if (act === 'snack') {
      var sn = document.getElementById('sn');
      doSnack(sn ? sn.value.trim() : '');
    }
    else if (act === 'snackclear') doSnack('');
    else if (act === 'picker') {
      var nid = el.getAttribute('data-night');
      pickerFor = pickerFor === nid ? null : nid;
      query = '';
      render();
    }
    else if (act === 'withdraw') {
      doEnter({ night_id: el.getAttribute('data-night'), withdraw: true }, 'Withdrawn.');
    }
    else if (act === 'rsvpthen') {
      doRsvpThen(el.getAttribute('data-night'), el.getAttribute('data-status'));
    }
    else if (act === 'entertitle') doEnterTitle();
    else if (act === 'enterfilm') {
      doEnter({ night_id: el.getAttribute('data-night'), film_id: el.getAttribute('data-id') },
        'Entered. Good luck.');
    }
    else if (act === 'ownfilm') {
      ownNoteFor = (S.night && S.night.id) || '';
      ownNoteFilm = el.getAttribute('data-id');
      haptic('light');
      render();
    }
    else if (act === 'vote') doVote(el.getAttribute('data-id'));
    else if (act === 'joker') doJoker(el.getAttribute('data-id'));
    else if (act === 'armjoker') { jokerArmed = !jokerArmed; haptic('light'); render(); }
    else if (act === 'filter') { libFilter = el.getAttribute('data-f'); render(); }
    else if (act === 'dossier') openDossier(el.getAttribute('data-id'));
    else if (act === 'suggesttheme') doSuggestTheme();
    else if (act === 'rate') {
      doRate(el.getAttribute('data-night'), el.getAttribute('data-film'),
        Number(el.getAttribute('data-paws')));
    }
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && S) load();
  });

  render();
  load();
})();
</script>
</body>
</html>
