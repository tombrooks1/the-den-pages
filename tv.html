<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Den &middot; TV</title>
<style>
:root{
  --bg:#0d0b14;
  --s1:#171225;
  --s2:#1d1731;
  --amber:#f5b942;
  --amber-deep:#e09e28;
  --text:#f4efe8;
  --muted:#8d85a3;
  --line:rgba(244,239,232,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07060b}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
/* Video-player behaviour: the pointer fades after a few still seconds, and any movement
   brings it back. The host has buttons to press up here. */
body.idlecursor, body.idlecursor *{cursor:none}
#stage{
  position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
  background:
    radial-gradient(1200px 700px at 22% -12%, rgba(245,185,66,.13), transparent 66%),
    radial-gradient(1000px 800px at 100% 10%, rgba(150,96,235,.15), transparent 64%),
    radial-gradient(900px 900px at -8% 90%, rgba(66,120,245,.09), transparent 70%),
    var(--bg);
  overflow:hidden;
}
.vignette{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(115% 92% at 50% 46%, transparent 52%, rgba(0,0,0,.62) 100%);
}
.grain{
  position:absolute;inset:-100px;z-index:7;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  animation:grain .8s steps(3) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)} 33%{transform:translate(-14px,9px)} 66%{transform:translate(11px,-12px)} 100%{transform:translate(0,0)}
}

/* ---------------- layout ---------------- */
#lobby{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:900px 1fr;gap:60px;padding:64px}
.left{display:flex;flex-direction:column;justify-content:space-between;gap:44px;min-height:0}
.right{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.panel{transition:opacity .9s ease, transform .9s ease;opacity:.6}
.panel.spot{opacity:1;transform:scale(1.012)}
#stage.busy .left{opacity:.25;filter:blur(3px);transition:opacity .7s ease, filter .7s ease}
.left{transition:opacity .7s ease, filter .7s ease}

/* ---------------- header ---------------- */
.bulbs{
  display:block;height:9px;width:250px;margin-bottom:20px;
  background-image:radial-gradient(circle, rgba(245,185,66,.95) 34%, transparent 38%);
  background-size:22px 9px;background-repeat:repeat-x;
  filter:drop-shadow(0 0 9px rgba(245,185,66,.6));animation:chase 1.6s linear infinite;
}
@keyframes chase{to{background-position:22px 0}}
.brand{font-size:19px;font-weight:800;letter-spacing:.52em;color:var(--amber);text-shadow:0 0 30px rgba(245,185,66,.55)}
.label{margin-top:16px;font-size:88px;font-weight:800;letter-spacing:-.045em;line-height:.98}
.theme{margin-top:16px;font-size:31px;font-weight:600;color:var(--amber);letter-spacing:-.01em;
  text-shadow:0 0 34px rgba(245,185,66,.35)}
.status{
  display:inline-block;margin-top:22px;font-size:14px;font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;color:var(--amber);padding:9px 16px;border-radius:999px;
  background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.32);
}
.status.lock{
  color:#231806;border-color:transparent;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  box-shadow:0 0 48px rgba(245,185,66,.42);
}
.whenline{margin-top:14px;font-size:30px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.whenline:empty{display:none}
.notes{margin-top:18px;max-width:820px;font-size:21px;line-height:1.4;color:#b3aac6}
.notes:empty{display:none}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.heads{margin-left:18px;color:var(--amber);text-shadow:0 0 26px rgba(245,185,66,.4)}
.snacks{margin-top:18px;font-size:20px;color:var(--muted);line-height:1.5}
.snacks:empty{display:none}
.snacks b{color:var(--text);font-weight:700}
.snacks .sep{opacity:.45;margin:0 10px}

/* ---------------- rsvp roll ---------------- */
.roll{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.chip{
  display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 10px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:23px;font-weight:700;
  animation:arrive .55s cubic-bezier(.2,.9,.3,1) both;
}
.chip .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px}
/* A "maybe" must never read as an "in" from the couch: own row, own label, dashed and muted. */
.roll + .roll{margin-top:12px}
.rtag{align-self:center;font-size:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted)}
.chip.maybe{background:transparent;border-style:dashed;border-color:rgba(244,239,232,.26);
  color:var(--muted)}
.chip.maybe .av{opacity:.65}
.chip.maybe .q{margin-left:3px;font-weight:800;color:var(--amber);opacity:.85}
.outline{margin-top:16px;font-size:17px;color:var(--muted);opacity:.7;letter-spacing:.02em}
@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

/* ---------------- poster wall ----------------
   An index, not the show: posters cap at 120px tall so a dozen films still compose at 1080p. */
.wall{display:grid;grid-template-columns:repeat(auto-fill,80px);gap:16px 16px;margin-top:18px;
  align-items:start}
.pw{position:relative;width:80px;animation:arrive .6s cubic-bezier(.2,.9,.3,1) both}
.poster{
  width:100%;aspect-ratio:2/3;border-radius:14px;object-fit:cover;display:block;
  background:#221b33;border:1px solid var(--line);box-shadow:0 16px 34px rgba(0,0,0,.5);
  min-height:0;overflow:hidden;   /* aspect-ratio boxes otherwise grow to fit their text */
}
.ph{display:flex;flex-direction:column;justify-content:space-between;padding:12px;overflow:hidden}
.ph-t{font-size:17px;font-weight:800;line-height:1.1;letter-spacing:-.02em;padding-right:52px;
  text-shadow:0 2px 12px rgba(0,0,0,.55)}
.ph-f{font-size:22px;opacity:.6;align-self:flex-end}
.wall .poster{width:80px;height:120px;aspect-ratio:auto;border-radius:9px;
  box-shadow:0 10px 22px rgba(0,0,0,.5)}
.wall .ph{padding:7px}
.wall .ph-t{font-size:11px;line-height:1.08;padding-right:18px;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.wall .ph-f{font-size:13px}
.pw .odds{
  position:absolute;top:5px;right:5px;font-size:10px;font-weight:800;color:var(--amber);
  padding:3px 6px;border-radius:999px;background:rgba(13,11,20,.82);
  border:1px solid rgba(245,185,66,.34);
}
.pw .tally{
  position:absolute;top:5px;left:5px;font-size:10px;font-weight:800;color:var(--text);
  padding:3px 5px;border-radius:999px;background:rgba(13,11,20,.82);border:1px solid var(--line);
}
.pw .tally.off{display:none}
.pw.dim{filter:grayscale(1);opacity:.36}
.pw .odds.sitting{color:var(--muted);border-color:var(--line);font-size:8px;letter-spacing:.04em}
.pw.lock .poster{
  border-color:rgba(245,185,66,.7);
  box-shadow:0 0 0 3px rgba(245,185,66,.42), 0 12px 30px rgba(245,185,66,.22);
}
.pw .who{margin-top:6px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{margin-top:14px;font-size:15px;color:var(--muted);letter-spacing:.04em}
.pw .dot{width:6px;height:6px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:26px;margin-top:26px;font-weight:600}

/* ---------------- wheel ---------------- */
.needle{
  width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;
  border-top:44px solid var(--amber);filter:drop-shadow(0 6px 16px rgba(245,185,66,.6));z-index:4;
}
.wheelbox{position:relative;width:720px;height:720px;margin-top:8px}
#wheel{
  position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 12px rgba(13,11,20,.9), 0 0 0 15px rgba(245,185,66,.35),
             0 40px 110px rgba(0,0,0,.65), inset 0 0 90px rgba(0,0,0,.55);
  will-change:transform;
}
.lab{
  position:absolute;left:50%;top:50%;width:268px;height:36px;margin-left:-134px;margin-top:-18px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:20px;font-weight:800;letter-spacing:-.015em;color:#0f0c17;
  text-shadow:0 1px 0 rgba(255,255,255,.26);white-space:nowrap;overflow:hidden;
}
.lab .o{font-size:17px;font-weight:800;opacity:.6}
.lab .o.j{opacity:.85}
.hub{
  position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #241d3a, #120e1e);
  border:3px solid rgba(245,185,66,.5);z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 0 44px rgba(0,0,0,.7), 0 0 30px rgba(245,185,66,.18);
}
.hub .paw{font-size:46px;line-height:1}
.hub .t{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--amber);opacity:.85}
#spin{
  margin-top:30px;font:inherit;font-size:23px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#231806;background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  border:none;border-radius:999px;padding:22px 74px;cursor:pointer;
  box-shadow:0 20px 54px rgba(245,185,66,.32);transition:transform .16s ease, box-shadow .16s ease;
}
#spin:hover{transform:translateY(-2px);box-shadow:0 26px 64px rgba(245,185,66,.42)}
#spin:disabled{opacity:.35;box-shadow:none;transform:none;cursor:default}
.hint{margin-top:16px;font-size:15px;color:var(--muted);letter-spacing:.06em}

/* ---------------- reveal ---------------- */
#reveal{
  position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;gap:70px;
  padding:90px;background:rgba(8,6,14,.9);backdrop-filter:blur(16px);
}
#reveal.on{display:flex;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#reveal .art{width:400px;flex:none;display:flex;gap:22px}
#reveal .art.double{width:560px}
#reveal .art .poster{border-radius:22px;box-shadow:0 50px 120px rgba(0,0,0,.75),0 0 0 1px rgba(245,185,66,.28)}
#reveal .art.double .poster{width:auto;flex:1;min-width:0;border-radius:16px}
#reveal .meta{max-width:1010px}
#reveal .first{
  margin-top:22px;font-size:22px;font-weight:600;color:var(--muted);
}
#reveal .first b{color:var(--text);font-weight:800}
/* The reveal is a room you can leave and come back to. */
#revClose{
  position:absolute;top:34px;right:44px;z-index:3;font:inherit;font-size:14px;font-weight:800;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;
  padding:11px 22px;
}
#revClose:hover{color:var(--text);border-color:rgba(244,239,232,.28)}
.navlink.right{position:absolute;right:64px;bottom:30px;z-index:12}
.navlink.hidden{display:none}
#again{
  margin-top:38px;font:inherit;font-size:19px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);background:rgba(245,185,66,.1);
  border:1px solid rgba(245,185,66,.4);border-radius:999px;padding:16px 40px;cursor:pointer;
}
#again:hover{background:rgba(245,185,66,.18)}
#again:disabled{opacity:.35;cursor:default}
#reveal .kicker{font-size:15px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--amber)}
#reveal h1{margin-top:20px;font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:.97}
#reveal .yr{font-weight:600;color:var(--muted)}
#reveal .by{margin-top:26px;display:inline-flex;align-items:center;gap:14px;font-size:26px;font-weight:700;
  padding:12px 26px 12px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
#reveal .by .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px}
#reveal .voted{margin-top:40px}
#reveal .voted .eyebrow{margin-bottom:14px;display:block}
#reveal .votedrow{display:flex;flex-wrap:wrap;gap:12px}
#confetti{position:absolute;inset:0;z-index:9;pointer-events:none}

/* ---------------- history & stats board ---------------- */
.navrow{position:absolute;left:64px;bottom:30px;z-index:12;display:flex;gap:12px}
.spinnote{margin-top:30px;font-size:19px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.spinnote:empty{display:none}
.navlink{
  font-size:14px;font-weight:800;
  letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-decoration:none;
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);
}
.navlink:hover{color:var(--amber);border-color:rgba(245,185,66,.4)}
#board, #libboard, #admin{position:absolute;inset:0;z-index:11;display:none;
  padding:56px 64px 90px;overflow:hidden;background:var(--bg)}
#admin.on{display:grid;grid-template-columns:1fr 560px;gap:48px;overflow-y:auto}
#libboard.on{display:block}
.libwall{display:grid;grid-template-columns:repeat(auto-fill,132px);gap:26px 22px;margin-top:22px}
.lf{position:relative;width:132px}
.lf .poster{width:132px;height:198px;aspect-ratio:auto;border-radius:11px;
  box-shadow:0 12px 26px rgba(0,0,0,.5)}
.lf .ph{padding:9px}
.lf .ph-t{font-size:13px;line-height:1.1;padding-right:20px;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.lf .ph-f{font-size:15px}
.lf .lt{margin-top:9px;font-size:14px;font-weight:700;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lf .lb{margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.lf .seen{position:absolute;top:7px;left:7px;font-size:11px;font-weight:800;padding:4px 8px;
  border-radius:999px;background:rgba(13,11,20,.84);border:1px solid rgba(245,185,66,.34);
  color:var(--amber)}
.lf .pawavg{position:absolute;top:7px;right:7px;font-size:11px;font-weight:800;padding:4px 8px;
  border-radius:999px;background:rgba(13,11,20,.84);border:1px solid var(--line)}
#board.on{display:grid;grid-template-columns:1fr 620px;gap:54px}
#board h2{font-size:15px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);margin-bottom:20px}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  padding:13px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:none}
.bposters{display:flex;gap:7px}
.bposters .poster{width:56px;height:84px;aspect-ratio:auto;border-radius:7px;
  box-shadow:0 8px 18px rgba(0,0,0,.5)}
.bposters .ph{padding:5px}
.bposters .ph-t{font-size:9px;line-height:1.05;padding-right:0;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bposters .ph-f{font-size:10px}
.bt{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.bm{margin-top:5px;font-size:14px;color:var(--muted)}
.bp{font-size:22px;font-weight:800;white-space:nowrap;color:var(--amber)}
.bp span{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.scard{position:relative;overflow:hidden;padding:18px;border-radius:20px;
  background:linear-gradient(152deg,var(--s2),var(--s1));border:1px solid var(--line)}
.scard::after{content:"";position:absolute;top:-60px;right:-50px;width:170px;height:170px;
  border-radius:50%;background:var(--accent,#f5b942);opacity:.16;filter:blur(30px)}
.scard .in{position:relative;z-index:1}
.scard .bdg{font-size:20px;line-height:1}
.scard .st{margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.scard .hd{margin-top:4px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.scard .ln{margin-top:7px;font-size:13px;color:#c3bcd4;line-height:1.4}
.bempty{color:var(--muted);font-size:20px}

/* ---------------- admin panel: a control room, not a document ---------------- */
.err{margin-bottom:18px;padding:14px 18px;border-radius:14px;font-size:17px;font-weight:600;
  color:#ffd9df;background:rgba(219,87,109,.16);border:1px solid rgba(219,87,109,.45)}
.nrow{padding:18px 20px;border-radius:18px;background:linear-gradient(158deg,var(--s2),var(--s1));
  border:1px solid var(--line)}
.nrow + .nrow{margin-top:14px}
.nrow.open{border-color:rgba(245,185,66,.4)}
.nhead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;cursor:pointer}
.ntitle{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.nmeta{margin-top:6px;font-size:15px;color:var(--muted)}
.chip2{flex:none;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;color:var(--amber);background:rgba(245,185,66,.1);
  border:1px solid rgba(245,185,66,.32)}
.chip2.spun{color:#9fe0c0;background:rgba(99,192,138,.12);border-color:rgba(99,192,138,.35)}
.chip2.done{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.abtn{
  font:inherit;font-size:16px;font-weight:800;cursor:pointer;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;
  padding:14px 22px;min-height:52px;
}
.abtn:hover{border-color:rgba(244,239,232,.3)}
.abtn.go{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#231806;
  border-color:transparent}
.abtn.warn{color:#ffc2cc;border-color:rgba(219,87,109,.4)}
.abtn:disabled{opacity:.45;cursor:default}
.elist{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.erow{display:flex;align-items:center;gap:16px;padding:10px 0;font-size:17px}
.erow + .erow{border-top:1px dashed rgba(244,239,232,.08)}
.erow .et{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .ew{flex:none;color:var(--muted);font-size:15px}
.form label{display:block;margin-top:18px;font-size:13px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.form input, .form select, .form textarea{
  width:100%;margin-top:8px;font:inherit;font-size:18px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;outline:none;
}
.form textarea{min-height:88px;resize:vertical}
.form input:focus, .form select:focus, .form textarea:focus{border-color:rgba(245,185,66,.45)}
.form option{background:#171225}

@media (prefers-reduced-motion: reduce){
  .grain,.bulbs,.chip,.pw{animation:none}
  .panel{transition:none}
}
</style>
</head>
<body>
<div id="stage">
  <div id="lobby">
    <div class="left">
      <section class="panel spot" id="hdr">
        <span class="bulbs"></span>
        <div class="brand">THE DEN</div>
        <div class="label" id="label">Loading the projector</div>
        <div class="whenline" id="whenline"></div>
        <div class="theme" id="theme"></div>
        <div><span class="status" id="status">standby</span></div>
        <div class="notes" id="notes"></div>
      </section>

      <section class="panel" id="roll">
        <div class="eyebrow">Who is coming<span class="heads" id="rollHeads"></span></div>
        <div id="rollList"></div>
        <div class="snacks" id="snackList"></div>
      </section>

      <section class="panel" id="wall">
        <div class="eyebrow">Tonight&#39;s entries<span class="heads" id="wallHeads"></span></div>
        <div class="wall" id="wallList"></div>
        <div class="more" id="wallMore"></div>
      </section>
    </div>

    <div class="right">
      <div class="needle"></div>
      <div class="wheelbox">
        <div id="wheel"></div>
        <div class="hub"><span class="paw">&#128062;</span><span class="t">THE DEN</span></div>
      </div>
      <button id="spin">Spin the wheel</button>
      <div class="spinnote" id="spinnote"></div>
      <div class="hint" id="hint">odds are printed on every slice &middot; nothing is rigged</div>
    </div>
  </div>

  <div id="board"></div>
  <div id="libboard"></div>
  <div id="admin"></div>
  <div class="navrow" id="navrow"></div>
  <button class="navlink right hidden" id="navPicks">tonight&#39;s picks</button>

  <div id="reveal"></div>
  <canvas id="confetti" width="1920" height="1080"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<script>
(function(){
  var PARAMS = new URLSearchParams(location.search);
  var KEY = PARAMS.get('key') || '';
  /* The group link carries ?key= and shows everything. The hosts' bookmark adds &host=,
     and only that can turn the wheel. */
  var HOSTKEY = PARAMS.get('host') || '';
  var IS_HOST = HOSTKEY.length > 0;
  function spinUrl(){
    return API + 'spin?key=' + encodeURIComponent(KEY) + '&host=' + encodeURIComponent(HOSTKEY);
  }
  /* This page is hosted on GitHub Pages, so the API is a different origin entirely. */
  var API = 'https://psomtujaikgcvblklzgv.supabase.co/functions/v1/app/api/';
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var wheel = document.getElementById('wheel');
  var spinBtn = document.getElementById('spin');
  var revealEl = document.getElementById('reveal');
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');

  var rotation = 0;         /* current wheel angle, degrees, monotonically increasing */
  var drawn = [];           /* candidates currently painted on the wheel */
  var shownSpins = {};      /* spin ids already revealed */
  var spinning = false;
  var firstState = true;
  var features = [];        /* every film that has won tonight, in running order */
  var canRollAgain = false; /* is there anything left for a second feature? */
  var lastReveal = null;    /* the reveal we can put back on screen */
  var sigs = {};            /* last-painted signature per section — the anti-flicker record */
  var wallNodes = {};       /* film id -> the live nodes of its wall tile */

  /* Slice colours come from this by INDEX, so neighbours always differ. Who suggested what
     is carried by the label, not the colour. */
  var WHEEL_COLORS = [
    '#e0736f', '#e09455', '#d9b356', '#a9c05e', '#63c08a', '#4fb9b0',
    '#5aa6dd', '#7d8ce4', '#a97ae0', '#d071c8', '#dd6f9c', '#c08a6a'
  ];

  function sliceColors(n){
    var out = [], i, c;
    for (i = 0; i < n; i++) {
      c = WHEEL_COLORS[i % WHEEL_COLORS.length];
      if (i > 0 && c === out[i - 1]) c = WHEEL_COLORS[(i + 1) % WHEEL_COLORS.length];
      /* The last slice touches the first one, so close the loop too. */
      if (i === n - 1 && n > 2 && c === out[0]) c = WHEEL_COLORS[(i + 2) % WHEEL_COLORS.length];
      out.push(c);
    }
    return out;
  }

  /* Pointer fades out of the way after a few still seconds, like a video player. */
  var idleTimer = null;
  function wakeCursor(){
    document.body.className = '';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.className = 'idlecursor'; }, 3000);
  }
  document.addEventListener('mousemove', wakeCursor);
  wakeCursor();

  /* ------------------------------------------------ helpers */
  var ENT = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ENT[c]; }); }
  function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? String(c) : '#b48ef2'; }
  function hash(s){
    var h = 0, str = String(s || '');
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  function rgba(hex, a){
    var h = safeColor(hex).slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h.slice(0, 6), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function poster(title, url){
    if (url) return '<img class="poster" alt="" src="' + esc(url) + '">';
    var h = hash(title), a = h % 360, b = (h >> 7) % 360;
    return '<div class="poster ph" style="background:linear-gradient(158deg,hsl(' + a +
      ' 42% 27%),hsl(' + b + ' 52% 13%))"><span class="ph-t">' + esc(title) +
      '</span><span class="ph-f">&#127916;</span></div>';
  }
  function avatar(m){
    var c = safeColor(m && m.color);
    return '<span class="av" style="background:' + c + '33;box-shadow:inset 0 0 0 2px ' + c + '99">' +
      ((m && m.emoji) ? esc(m.emoji) : '&#128062;') + '</span>';
  }
  function pct(o){ return Math.round((o || 0) * 100) + '%'; }
  function fmtDate(iso){
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    } catch (e) { return ''; }
  }
  function statusText(s){
    var map = { planned:'Entries open', locked:'Voting is open', spun:'The wheel has chosen', watched:'Watched' };
    return map[s] || 'standby';
  }

  /* ------------------------------------------------ stage fit */
  function fit(){
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ------------------------------------------------ the wheel */
  function signature(list){
    return list.map(function(c){
      return c.film_id + ':' + Math.round((c.odds || 0) * 1000) + ':' +
        (c.votes || 0) + ':' + (c.jokers || 0);
    }).join('|');
  }

  /**
   * Slices run clockwise from 12 o'clock, matching CSS conic-gradient's own origin,
   * so a slice's on-screen angle is exactly its cumulative-odds position.
   *
   * The odds handed in are already honest about a majority lock (the winner is on 100%,
   * everyone else on 0), so a locked wheel is one full slice and the rest vanish. Slivers too
   * thin to read get no label.
   */
  function buildWheel(list, majority){
    drawn = list.slice();
    var maj = majority || {};
    if (!drawn.length) {
      wheel.style.background = 'radial-gradient(circle, #1d1731, #120e1e)';
      wheel.innerHTML = '';
      return;
    }
    var stops = [], labels = [], acc = 0, i;
    var colors = sliceColors(drawn.length);
    for (i = 0; i < drawn.length; i++) {
      var c = drawn[i];
      var start = acc * 360;
      acc += (c.odds || 0);
      var end = acc * 360;
      var span = end - start;
      var tone = rgba(colors[i], 0.9);
      stops.push('rgba(244,239,232,.24) ' + start.toFixed(3) + 'deg ' + (start + 0.4).toFixed(3) + 'deg');
      stops.push(tone + ' ' + (start + 0.4).toFixed(3) + 'deg ' + end.toFixed(3) + 'deg');
      if (span < 6) continue;

      var full = span >= 359;
      var mid = full ? 0 : (start + end) / 2;
      var title = String(c.title || '');
      if (title.length > 14) title = title.slice(0, 13) + '…';
      var flip = mid > 180;
      labels.push('<div class="lab" style="transform:rotate(' + mid.toFixed(3) +
        'deg) translateY(-218px) rotate(' + (flip ? '90' : '-90') + 'deg)">' +
        '<span>' + esc(c.emoji || '') + '</span>' +
        '<span>' + esc(title) + '</span>' +
        (c.votes ? '<span class="o">' + c.votes + '&#128499;&#65039;</span>' : '') +
        (c.jokers ? '<span class="o j">' + c.jokers + '&#127183;</span>' : '') +
        '<span class="o">' + (maj.locked && full ? 'LOCKED' : pct(c.odds)) + '</span></div>');
    }
    wheel.style.background = 'conic-gradient(from 0deg, ' + stops.join(', ') + ')';
    wheel.innerHTML = labels.join('');
  }

  /**
   * Land the winner's slice under the needle at 12 o'clock.
   *   slice centre (clockwise from top) = 360 * (cumulative odds before it + own odds / 2)
   *   final rotation R must satisfy (centre + R) = 0 (mod 360), plus whole extra turns.
   * The landing point is nudged inside the slice by the server's own roll, so the stop
   * position is deterministic and always strictly within the winning wedge.
   */
  function landingAngle(list, winnerId, roll){
    var acc = 0, i;
    for (i = 0; i < list.length; i++) {
      var o = list[i].odds || 0;
      if (list[i].film_id === winnerId) {
        var span = o * 360;
        var centre = acc * 360 + span / 2;
        var jitter = ((roll == null ? 0.5 : roll) - 0.5) * span * 0.6;
        return centre + jitter;
      }
      acc += o;
    }
    return null;
  }

  function runSpinAnimation(spin, voters){
    var res = spin && spin.result;
    if (!res || !res.candidates || !res.candidates.length) return;
    spinning = true;
    stage.classList.add('busy');
    spinBtn.disabled = true;

    buildWheel(res.candidates, res.majority);
    var land = landingAngle(res.candidates, res.winner_film_id, res.roll);
    if (land == null) { spinning = false; spinBtn.disabled = false; return; }

    var target = ((-land) % 360 + 360) % 360;
    var delta = ((target - (rotation % 360)) % 360 + 360) % 360;
    var TURNS = 6;
    var end = rotation + TURNS * 360 + delta;

    if (REDUCED) {
      wheel.style.transition = 'none';
      wheel.style.transform = 'rotate(' + (rotation + delta) + 'deg)';
      rotation = rotation + delta;
      showReveal(res, voters);
      return;
    }

    wheel.style.transition = 'transform 4.5s cubic-bezier(.16,.72,.16,1)';
    wheel.style.transform = 'rotate(' + end.toFixed(3) + 'deg)';
    rotation = end;
    setTimeout(function(){ showReveal(res, voters); }, 4700);
  }

  /* ------------------------------------------------ reveal + confetti */
  function showReveal(res, voters, quiet){
    var cands = (res && res.candidates) || [];
    var maj = (res && res.majority) || {};
    var winner = null, i;
    for (i = 0; i < cands.length; i++) {
      if (cands[i].film_id === res.winner_film_id) winner = cands[i];
    }
    if (!winner) { spinning = false; return; }

    var backers = (voters || []).filter(function(p){ return p.for_winner; });
    var others = (voters || []).length - backers.length;

    var tally = '';
    if ((voters || []).length) {
      tally = '<div class="voted"><span class="eyebrow">' +
        (maj.locked ? 'The majority' : backers.length ? 'Who voted for it' : 'The vote') +
        '</span><div class="votedrow">' +
        (backers.length
          ? backers.map(function(p){
              return '<span class="chip">' + avatar(p) + esc(p.name) + '</span>';
            }).join('')
          : '<span class="chip" style="opacity:.6">No votes for this one</span>') +
        '</div>' +
        (backers.length && others
          ? '<div class="hint" style="margin-top:14px">' + others + ' voted elsewhere.</div>'
          : '') +
        '</div>';
    }

    /* A locked win was decided by the room, so it is quoted as a majority, not as odds. */
    var line = maj.locked
      ? 'locked by majority &middot; ' + (winner.votes || 0) + ' of ' + (maj.attendee_basis || 0)
      : pct(winner.odds) + ' odds';

    /* The bill so far. A second roll makes this a double feature. */
    var bill = features.filter(function(f){ return f.film_id !== winner.film_id; });
    var second = (res.round === 2) || bill.length > 0;
    var art = second && bill.length
      ? '<div class="art double">' + bill.map(function(f){
          return poster(f.title, f.poster);
        }).join('') + poster(winner.title, winner.poster) + '</div>'
      : '<div class="art">' + poster(winner.title, winner.poster) + '</div>';

    var firstLine = '';
    if (second && bill.length) {
      firstLine = '<div class="first">First feature: <b>' + esc(bill[0].title) + '</b>' +
        (bill[0].year ? ' (' + esc(bill[0].year) + ')' : '') +
        ' &middot; ' + esc(bill[0].member) + '</div>';
    }

    var again = '';
    if (IS_HOST && canRollAgain && !second) {
      again = '<button id="again">Roll a second movie</button>';
    }

    revealEl.innerHTML =
      '<button id="revClose">back to the lobby</button>' + art +
      '<div class="meta">' +
      '<div class="kicker">' +
        (second ? 'A double bill' : maj.locked ? 'The room locked it in' : 'Tonight you are watching') +
        '</div>' +
      '<h1>' + esc(winner.title) +
        (winner.year ? ' <span class="yr">(' + esc(winner.year) + ')</span>' : '') + '</h1>' +
      '<div class="by">' + avatar(winner) + 'suggested by ' + esc(winner.member) +
        '<span style="color:var(--muted);font-weight:600"> &middot; ' + line + '</span></div>' +
      firstLine + tally + again + '</div>';
    revealEl.className = 'on';
    lastReveal = { res: res, voters: voters };
    var againBtn = document.getElementById('again');
    if (againBtn) againBtn.addEventListener('click', rollAgain);
    var closeBtn = document.getElementById('revClose');
    if (closeBtn) closeBtn.addEventListener('click', hideReveal);
    syncPicksLink();
    var head = revealEl.querySelector('h1');
    var len = head.textContent.length;
    head.style.fontSize = (len > 34 ? 52 : len > 26 ? 60 : len > 18 ? 68 : 84) + 'px';
    if (!REDUCED && !quiet) confetti(winner.color);
    spinning = false;
    stage.classList.remove('busy');
  }

  /* The reveal can be dismissed and reopened — nobody should be stranded on it. */
  function hideReveal(){
    revealEl.className = '';
    syncPicksLink();
  }

  function reopenReveal(){
    if (!lastReveal) return;
    showReveal(lastReveal.res, lastReveal.voters, true);
  }

  /* The way back in, only offered when there is something to go back to. */
  function syncPicksLink(){
    var want = Boolean(lastReveal) && revealEl.className !== 'on' && !fullScreen() && !spinning;
    var el = document.getElementById('navPicks');
    var cls = 'navlink right' + (want ? '' : ' hidden');
    if (el.className !== cls) el.className = cls;
  }

  /* Host asked for a second feature: hide the reveal, run the wheel again on what is left. */
  function rollAgain(){
    if (spinning) return;
    var btn = document.getElementById('again');
    if (btn) { btn.disabled = true; btn.textContent = 'Rolling...'; }
    spinning = true;
    fetch(spinUrl(), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ again: true })
    })
      .then(function(r){ return r.json(); })
      .then(function(j){
        spinning = false;
        if (!j || !j.ok || !j.spin) {
          if (btn) { btn.disabled = false; btn.textContent = 'Roll a second movie'; }
          if (j && j.message) {
            document.getElementById('hint').textContent = j.message;
          }
          return;
        }
        if (shownSpins[j.spin.id]) return;
        shownSpins[j.spin.id] = true;
        revealEl.className = '';
        syncPicksLink();
        runSpinAnimation(j.spin, j.votes);
      })
      .catch(function(){
        spinning = false;
        if (btn) { btn.disabled = false; btn.textContent = 'Roll a second movie'; }
      });
  }

  var parts = [];
  var raf = null;
  /* Two cannons at the bottom corners, firing inward across the frame. */
  function confetti(accent){
    var colors = [safeColor(accent), '#f5b942', '#f4efe8', '#8e57db', '#57d0db'];
    var cannons = [{ x: 130, dir: 1 }, { x: 1790, dir: -1 }];
    parts = [];
    for (var c = 0; c < cannons.length; c++) {
      for (var i = 0; i < 105; i++) {
        parts.push({
          x: cannons[c].x + (Math.random() - 0.5) * 90,
          y: 1070,
          vx: cannons[c].dir * (9 + Math.random() * 26),
          vy: -21 - Math.random() * 22,
          w: 7 + Math.random() * 11,
          h: 10 + Math.random() * 16,
          a: Math.random() * Math.PI * 2,
          va: (Math.random() - 0.5) * 0.3,
          c: colors[(Math.random() * colors.length) | 0],
          life: 165 + Math.random() * 70
        });
      }
    }
    if (raf) cancelAnimationFrame(raf);
    tick();
  }
  function tick(){
    ctx.clearRect(0, 0, 1920, 1080);
    var alive = 0;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.life <= 0) continue;
      alive++;
      p.life--;
      p.vy += 0.42;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.a += p.va;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 60));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive) raf = requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, 1920, 1080);
  }

  /* ------------------------------------------------ lobby rendering
     Every section is gated on a signature of its own data. A poll that brings nothing new
     touches no node at all, so nothing repaints and no image is ever recreated. */

  function section(key, sig, paint){
    if (sigs[key] === sig) return;
    sigs[key] = sig;
    paint();
  }

  /* Posters are created once per line-up. Everything that changes on a poll — odds, votes,
     jokers, lock state — is written into the cards that already exist. */
  function buildWall(shown){
    var wallEl = document.getElementById('wallList');
    wallNodes = {};
    if (!shown.length) {
      wallEl.innerHTML = '<div class="empty" style="grid-column:1/-1">' +
        'No films yet. Everyone brings one.</div>';
      return;
    }
    wallEl.innerHTML = shown.map(function(c, i){
      return '<div class="pw" data-id="' + esc(c.film_id) + '" style="animation-delay:' +
        (i * 55) + 'ms"><span class="odds"></span><span class="tally off"></span>' +
        poster(c.title, c.poster) +
        '<div class="who"><span class="dot" style="background:' + safeColor(c.color) + '"></span>' +
        esc(c.emoji) + ' ' + esc(c.member) + '</div></div>';
    }).join('');
    var els = wallEl.querySelectorAll('.pw');
    for (var j = 0; j < els.length; j++) {
      wallNodes[els[j].getAttribute('data-id')] = {
        root: els[j],
        odds: els[j].querySelector('.odds'),
        tally: els[j].querySelector('.tally'),
        cls: '', txt: '', v: ''
      };
    }
  }

  function paintWall(shown, locked, maj){
    for (var i = 0; i < shown.length; i++) {
      var c = shown[i];
      var node = wallNodes[c.film_id];
      if (!node) continue;
      var isLock = !!(locked && maj.leading && c.film_id === maj.leading);
      var lockedOut = !!(locked && maj.leading && c.film_id !== maj.leading);

      var cls = 'pw' + (isLock ? ' lock' : '') + (lockedOut ? ' dim' : '');
      if (node.cls !== cls) { node.cls = cls; node.root.className = cls; }

      var txt = isLock ? 'LOCKED' : pct(c.odds);
      if (node.txt !== txt) { node.txt = txt; node.odds.textContent = txt; }

      /* The weight, spelled out: what the room did to this film. */
      var votes = c.votes || 0, jokers = c.jokers || 0;
      var key = votes + '/' + jokers;
      if (node.v !== key) {
        node.v = key;
        node.tally.className = (votes || jokers) ? 'tally' : 'tally off';
        if (votes || jokers) {
          node.tally.innerHTML = (votes ? votes + '&#128499;&#65039;' : '') +
            (votes && jokers ? ' ' : '') + (jokers ? jokers + '&#127183;' : '');
        }
      }
    }
  }

  function renderLobby(state){
    var n = state.night;
    var maj = state.majority || {};
    var locked = !!(maj.locked && n && n.status === 'locked');

    var label = n ? n.label : 'No night on the books';
    var when = (n && n.date_label) ? n.date_label : '';
    var theme = n && n.theme ? n.theme : '';
    var notes = (n && n.notes) ? n.notes : '';
    section('head', label + '|' + when + '|' + theme + '|' + notes, function(){
      document.getElementById('label').textContent = label;
      document.getElementById('whenline').textContent = when;
      document.getElementById('theme').textContent = theme;
      document.getElementById('notes').textContent = notes;
    });

    var statusHtml = !n
      ? 'waiting for a host to plan the next one'
      : locked
      ? 'Locked by majority &middot; ' + (maj.leading_votes || 0) + ' of ' + (maj.attendee_basis || 0)
      : statusText(n.status);
    section('status', statusHtml + '|' + locked, function(){
      var el = document.getElementById('status');
      el.className = 'status' + (locked ? ' lock' : '');
      el.innerHTML = statusHtml;
    });

    var order = { 'in':0, 'maybe':1, 'out':2 };
    var sorted = (state.rsvps || []).slice().sort(function(a, b){
      return order[a.status] - order[b.status];
    });
    var rollSig = sorted.map(function(r){
      return r.member_id + ':' + r.status + ':' + (r.plus_ones || 0) + ':' + r.name;
    }).join('|') + '#' + (state.headcount || 0);
    section('roll', rollSig, function(){
      var ins = sorted.filter(function(r){ return r.status === 'in'; });
      var maybes = sorted.filter(function(r){ return r.status === 'maybe'; });
      var outs = sorted.filter(function(r){ return r.status === 'out'; });
      function chip(r, i, extra){
        return '<span class="chip' + (extra || '') + '" style="animation-delay:' +
          (i * 60) + 'ms">' + avatar(r) + esc(r.name) +
          (r.plus_ones === 1 ? ' +1' : '') +
          (extra ? '<span class="q">?</span>' : '') + '</span>';
      }
      var html = '';
      if (ins.length) {
        html += '<div class="roll">' + ins.map(function(r, i){ return chip(r, i); }).join('') + '</div>';
      }
      if (maybes.length) {
        html += '<div class="roll"><span class="rtag">maybe</span>' +
          maybes.map(function(r, i){ return chip(r, i, ' maybe'); }).join('') + '</div>';
      }
      /* Out gets one quiet line — never a chip that could pass for someone who is coming. */
      if (outs.length) {
        html += '<div class="outline">out &middot; ' + outs.map(function(r){
          return esc(r.emoji) + ' ' + esc(r.name);
        }).join(' &middot; ') + '</div>';
      }
      document.getElementById('rollList').innerHTML = html ||
        '<div class="empty">Waiting to hear who is coming.</div>';
      document.getElementById('rollHeads').textContent = state.headcount
        ? state.headcount + ' coming'
        : '';
    });

    /* What people are bringing. Quiet when nobody has said. */
    var spread = state.snacks || [];
    var spreadSig = spread.map(function(s){ return s.name + ':' + s.snack; }).join('|');
    section('snacks', spreadSig, function(){
      document.getElementById('snackList').innerHTML = spread.length
        ? '&#127871; ' + spread.map(function(s){
            return '<b>' + esc(s.snack) + '</b> ' + esc(s.emoji) + ' ' + esc(s.name);
          }).join('<span class="sep">&middot;</span>')
        : '';
    });

    /* Tonight's line-up: one film per person, everything that was entered. */
    var entries = state.entries || [];
    var shown = entries.slice(0, 12);

    /* Which cards exist, and with which artwork — the only thing that justifies new nodes. */
    var wallSig = shown.map(function(c){ return c.film_id + ':' + (c.poster || ''); }).join('|');
    section('wall', wallSig, function(){ buildWall(shown); });
    paintWall(shown, locked, maj);

    var moreTxt = entries.length > shown.length
      ? '+ ' + (entries.length - shown.length) + ' more entered'
      : '';
    var headsTxt = entries.length
      ? entries.length + (entries.length === 1 ? ' film in' : ' films in')
      : '';
    section('wallmeta', moreTxt + '|' + headsTxt, function(){
      document.getElementById('wallMore').textContent = moreTxt;
      document.getElementById('wallHeads').textContent = headsTxt;
    });

    var canSpin = IS_HOST && !!n && (n.status === 'planned' || n.status === 'locked') &&
      entries.length > 0 && !spinning;
    section('spinauth', String(IS_HOST), function(){
      spinBtn.style.display = IS_HOST ? '' : 'none';
      document.getElementById('spinnote').textContent = IS_HOST ? '' : 'a host spins the wheel';
    });
    section('spinbtn', String(canSpin), function(){ spinBtn.disabled = !canSpin; });

    var jokersOut = 0;
    for (var k = 0; k < entries.length; k++) jokersOut += (entries[k].jokers || 0);
    var hint = n && n.status === 'spun'
      ? 'the wheel has chosen &middot; every number is on the record'
      : !entries.length
      ? 'waiting on films &middot; everyone brings one'
      : locked
      ? 'the room reached a majority &middot; the wheel makes it official'
      : jokersOut
      ? 'weight is 1 + votes + jokers &middot; every number is on the slice'
      : 'weight is 1 + votes &middot; every slice shows its odds';
    section('hint', hint, function(){
      document.getElementById('hint').innerHTML = hint;
    });
  }

  /* ------------------------------------------------ attention cycle */
  var spots = ['hdr', 'roll', 'wall'];
  var spotAt = 0;
  setInterval(function(){
    if (spinning || revealEl.className === 'on' || fullScreen()) return;
    spotAt = (spotAt + 1) % spots.length;
    spots.forEach(function(id, i){
      var want = 'panel' + (i === spotAt ? ' spot' : '');
      var el = document.getElementById(id);
      if (el.className !== want) el.className = want;
    });
  }, 6000);

  /* ------------------------------------------------ history & stats board */
  function boardOn(){ return location.hash === '#stats'; }
  function libOn(){ return location.hash === '#library'; }
  function fullScreen(){ return boardOn() || libOn() || adminOn(); }

  function pawLine(avg, count){
    if (avg == null) return '<div class="bp">&mdash;<span>no paws</span></div>';
    return '<div class="bp">&#128062; ' + (Math.round(avg * 10) / 10).toFixed(1) +
      '<span>from ' + count + (count === 1 ? ' vote' : ' votes') + '</span></div>';
  }

  function renderBoard(data){
    var hist = (data && data.history) || [];
    var cards = (data && data.stats && data.stats.cards) || [];
    var rows = hist.slice(0, 7).map(function(nt){
      var films = (nt.films && nt.films.length)
        ? nt.films
        : [{ title: nt.title, poster: nt.poster }];
      var bits = [];
      if (nt.watched_at) bits.push(esc(fmtDate(nt.watched_at)));
      if (nt.theme) bits.push(esc(nt.theme));
      bits.push(esc(nt.label));
      return '<div class="brow"><div class="bposters">' +
        films.map(function(f){ return poster(f.title, f.poster); }).join('') + '</div>' +
        '<div><div class="bt">' + films.map(function(f){
          return esc(f.title);
        }).join(' <span style="color:var(--muted)">+</span> ') + '</div>' +
        '<div class="bm">' + bits.join(' &middot; ') + '</div></div>' +
        pawLine(nt.avg_paws, nt.rating_count || 0) + '</div>';
    }).join('');

    document.getElementById('board').innerHTML =
      '<div><h2>What we have watched</h2>' +
      (rows || '<div class="bempty">Nothing watched yet. The first night starts the record.</div>') + '</div>' +
      '<div><h2>The folklore</h2><div class="cards">' +
      cards.slice(0, 6).map(function(c){
        return '<div class="scard" style="--accent:' +
          safeColor(c.member && c.member.color) + '"><div class="in">' +
          '<div class="bdg">' + esc(c.badge) + '</div>' +
          '<div class="st">' + esc(c.title) + '</div>' +
          '<div class="hd">' + esc(c.headline) + '</div>' +
          '<div class="ln">' + esc(c.line) + '</div></div></div>';
      }).join('') + '</div></div>' +
      '<a class="navlink" href="#" id="navBack">back to tonight</a>';
  }

  function loadBoard(){
    document.getElementById('board').innerHTML =
      '<div class="bempty">Loading the history...</div>';
    fetch(API + 'tv-stats?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) {
          document.getElementById('board').innerHTML =
            '<div class="bempty">That did not load. Try again in a moment.</div>';
          return;
        }
        renderBoard(d);
      })
      .catch(function(){
        document.getElementById('board').innerHTML =
          '<div class="bempty">No signal from the Den.</div>';
      });
  }

  /* ------------------------------------------------ the host admin panel */
  var admData = null;      /* last /api/admin/state payload */
  var admBusy = '';        /* the one action currently in flight */
  var admError = '';       /* plain inline message, never an alert */
  var admOpen = '';        /* night whose line-up is expanded */
  var admForm = { title: '', theme: '', own: '', date: '', notes: '' };

  function adminOn(){ return location.hash === '#admin'; }

  function admQs(){
    return '?key=' + encodeURIComponent(KEY) + '&host=' + encodeURIComponent(HOSTKEY);
  }

  function statusChip(status){
    var cls = status === 'spun' ? ' spun'
      : (status === 'watched' || status === 'cancelled') ? ' done' : '';
    var map = { planned:'entries open', locked:'voting open', spun:'picked',
      watched:'watched', cancelled:'called off' };
    return '<span class="chip2' + cls + '">' + esc(map[status] || status) + '</span>';
  }

  function actBtn(id, label, night, action, cls){
    var busy = admBusy === id;
    return '<button class="abtn' + (cls ? ' ' + cls : '') + '" data-adm="' + esc(action) +
      '" data-night="' + esc(night) + '" data-id="' + esc(id) + '"' +
      (admBusy ? ' disabled' : '') + '>' + (busy ? 'working...' : esc(label)) + '</button>';
  }

  function nightBlock(n){
    var open = admOpen === n.id;
    var bits = [];
    if (n.date_label) bits.push(esc(n.date_label));
    if (n.theme) bits.push(esc(n.theme));
    else bits.push('open night');
    bits.push(n.entries.length + (n.entries.length === 1 ? ' entry' : ' entries'));
    if (n.headcount) bits.push(n.headcount + ' coming');

    var acts = [];
    if (n.status === 'planned') {
      acts.push(actBtn('openvote:' + n.id, 'Open voting', n.id, 'openvote', 'go'));
      acts.push(actBtn('cancel:' + n.id, 'Cancel night', n.id, 'cancel', 'warn'));
    } else if (n.status === 'locked') {
      acts.push(actBtn('cancel:' + n.id, 'Cancel night', n.id, 'cancel', 'warn'));
    } else if (n.status === 'spun') {
      acts.push(actBtn('again:' + n.id, 'Roll second feature', n.id, 'again', 'go'));
      acts.push(actBtn('done:' + n.id, 'Done, roll credits', n.id, 'done'));
    }

    var entries = '';
    if (open) {
      entries = '<div class="elist">' + (n.entries.length
        ? n.entries.map(function(e){
            var w = [];
            if (e.votes) w.push(e.votes + ' &#128499;&#65039;');
            if (e.jokers) w.push(e.jokers + ' &#127183;');
            return '<div class="erow"><span class="et">' + esc(e.title) +
              ' <span style="color:var(--muted)">&middot; ' + esc(e.emoji) + ' ' +
              esc(e.member) + '</span></span>' +
              '<span class="ew">' + (w.length ? w.join(' ') : '&mdash;') + '</span>' +
              '<button class="abtn warn" data-adm="eject" data-night="' + esc(n.id) +
              '" data-film="' + esc(e.film_id) + '" data-id="eject:' + esc(e.film_id) + '"' +
              (admBusy ? ' disabled' : '') + '>' +
              (admBusy === 'eject:' + e.film_id ? 'working...' : 'Remove') + '</button></div>';
          }).join('')
        : '<div class="bempty" style="font-size:17px">No films entered yet.</div>') + '</div>';
    }

    return '<div class="nrow' + (open ? ' open' : '') + '">' +
      '<div class="nhead" data-adm="expand" data-night="' + esc(n.id) + '">' +
      '<div><div class="ntitle">' + esc(n.title) + '</div>' +
      '<div class="nmeta">' + bits.join(' &middot; ') + '</div></div>' +
      statusChip(n.status) + '</div>' +
      (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') +
      entries + '</div>';
  }

  function createForm(){
    var ideas = (admData && admData.theme_ideas) || [];
    var opts = ['<option value="">Open night &mdash; anything can be entered</option>'];
    ideas.forEach(function(t){
      opts.push('<option value="' + esc(t.text) + '"' +
        (admForm.theme === t.text ? ' selected' : '') + '>' + esc(t.text) +
        ' &mdash; ' + esc(t.name) + '</option>');
    });
    opts.push('<option value="__own"' + (admForm.theme === '__own' ? ' selected' : '') +
      '>Type my own theme</option>');
    return '<div class="nrow form">' +
      '<div class="ntitle">Create a night</div>' +
      '<label for="admTitle">Name</label>' +
      '<input id="admTitle" type="text" placeholder="The one with the robots">' +
      '<label for="admTheme">Theme</label>' +
      '<select id="admTheme">' + opts.join('') + '</select>' +
      (admForm.theme === '__own'
        ? '<input id="admOwn" type="text" placeholder="Films with terrible dads" ' +
          'style="margin-top:12px">'
        : '') +
      '<label for="admDate">Date and start time</label>' +
      '<input id="admDate" type="text" placeholder="Saturday the 22nd, 8pm">' +
      '<label for="admNotes">Anything else (optional)</label>' +
      '<textarea id="admNotes" placeholder="Parking is awful, get the bus."></textarea>' +
      '<div class="acts">' +
      '<button class="abtn go" data-adm="create" data-id="create"' +
      (admBusy ? ' disabled' : '') + '>' +
      (admBusy === 'create' ? 'announcing...' : 'Create and announce') + '</button></div>' +
      '</div>';
  }

  function renderAdmin(){
    var el = document.getElementById('admin');
    if (!admData) {
      el.innerHTML = '<div class="bempty">Loading the panel...</div>';
      return;
    }
    var nights = admData.nights || [];
    var live = nights.filter(function(n){
      return n.status === 'planned' || n.status === 'locked' || n.status === 'spun';
    });
    var past = nights.filter(function(n){
      return n.status === 'watched' || n.status === 'cancelled';
    });
    el.innerHTML =
      '<div>' + (admError ? '<div class="err">' + esc(admError) + '</div>' : '') +
      '<h2>Nights</h2>' +
      (live.length
        ? live.map(nightBlock).join('')
        : '<div class="bempty">Nothing planned. Create one on the right.</div>') +
      (past.length
        ? '<h2 style="margin-top:32px">Recently</h2>' + past.map(nightBlock).join('')
        : '') +
      '</div><div>' + createForm() +
      '<a class="navlink" href="#" id="navBack3">back to tonight</a></div>';

    /* Put typed values back after the repaint and keep them as they change. */
    var bind = function(id, key){
      var node = document.getElementById(id);
      if (!node) return;
      node.value = admForm[key];
      node.addEventListener('input', function(e){ admForm[key] = e.target.value; });
    };
    bind('admTitle', 'title');
    bind('admDate', 'date');
    bind('admNotes', 'notes');
    bind('admOwn', 'own');
    var sel = document.getElementById('admTheme');
    if (sel) {
      sel.value = admForm.theme;
      sel.addEventListener('change', function(e){
        admForm.theme = e.target.value;
        renderAdmin();
      });
    }
  }

  function loadAdmin(){
    fetch(API + 'admin/state' + admQs())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) {
          admData = { nights: [], theme_ideas: [] };
          admError = (d && d.message) || 'That did not load.';
        } else {
          admData = d;
        }
        renderAdmin();
      })
      .catch(function(){
        admData = { nights: [], theme_ideas: [] };
        admError = 'No signal from the Den.';
        renderAdmin();
      });
  }

  /* One tap, one action, then the panel refetches so the result is the DB's word, not ours. */
  function adminAct(id, action, night, film){
    if (admBusy) return;
    admBusy = id;
    admError = '';
    renderAdmin();

    var done = function(j){
      admBusy = '';
      if (!j || !j.ok) admError = (j && j.message) || 'That did not go through.';
      loadAdmin();
    };
    var failed = function(){
      admBusy = '';
      admError = 'Could not reach the Den. Try again in a moment.';
      renderAdmin();
    };

    /* The second feature is the wheel's own endpoint, the rest are host commands. */
    if (action === 'again') {
      fetch(spinUrl(), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ again: true })
      }).then(function(r){ return r.json(); }).then(done).catch(failed);
      return;
    }

    var payload = { key: KEY, host: HOSTKEY, action: action };
    if (night) payload.night_id = night;
    if (film) payload.film_id = film;
    if (action === 'create_night') {
      var theme = admForm.theme === '__own' ? admForm.own.trim() : admForm.theme;
      payload.title = admForm.title.trim();
      payload.theme = theme ? theme : null;
      payload.date_label = admForm.date.trim();
      payload.notes = admForm.notes.trim() ? admForm.notes.trim() : null;
    }
    fetch(API + 'admin/act', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok && action === 'create_night') {
        admForm = { title: '', theme: '', own: '', date: '', notes: '' };
      }
      done(j);
    }).catch(failed);
  }

  document.getElementById('admin').addEventListener('click', function(e){
    var el = e.target.closest('[data-adm]');
    if (!el) return;
    var what = el.getAttribute('data-adm');
    if (what === 'expand') {
      var nid = el.getAttribute('data-night');
      admOpen = admOpen === nid ? '' : nid;
      renderAdmin();
      return;
    }
    if (what === 'create') {
      if (!admForm.title.trim()) { admError = 'Give the night a name first.'; renderAdmin(); return; }
      if (!admForm.date.trim()) { admError = 'Add a date and start time.'; renderAdmin(); return; }
      adminAct('create', 'create_night', '', '');
      return;
    }
    adminAct(el.getAttribute('data-id'), what, el.getAttribute('data-night'),
      el.getAttribute('data-film'));
  });

  function renderLibBoard(data){
    var films = (data && data.library) || [];
    var wall = films.map(function(f){
      var avg = f.avg_paws == null ? null : Math.round(f.avg_paws * 10) / 10;
      return '<div class="lf">' +
        (f.watched ? '<span class="seen">seen</span>' : '') +
        (avg != null ? '<span class="pawavg">&#128062; ' + avg.toFixed(1) + '</span>' : '') +
        poster(f.title, f.poster) +
        '<div class="lt">' + esc(f.title) + '</div>' +
        '<div class="lb">' +
        (f.brought_by ? esc(f.brought_by.emoji) + ' ' + esc(f.brought_by.name) : '&nbsp;') +
        '</div></div>';
    }).join('');
    document.getElementById('libboard').innerHTML =
      '<h2>The library<span class="heads">' + films.length +
      (films.length === 1 ? ' film' : ' films') + '</span></h2>' +
      (wall
        ? '<div class="libwall">' + wall + '</div>'
        : '<div class="bempty">No films yet. Anything entered lands here.</div>') +
      '<a class="navlink" href="#" id="navBack2">back to tonight</a>';
  }

  function loadLibBoard(){
    document.getElementById('libboard').innerHTML = '<div class="bempty">Loading the shelf...</div>';
    fetch(API + 'tv-library?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) {
          document.getElementById('libboard').innerHTML =
            '<div class="bempty">That did not load. Try again in a moment.</div>';
          return;
        }
        renderLibBoard(d);
      })
      .catch(function(){
        document.getElementById('libboard').innerHTML =
          '<div class="bempty">No signal from the Den.</div>';
      });
  }

  function routeView(){
    var stats = boardOn(), lib = libOn();
    /* A viewer who guesses the hash still gets nothing: the panel needs the host link. */
    var adm = adminOn() && IS_HOST;
    var any = stats || lib || adm;
    document.getElementById('board').className = stats ? 'on' : '';
    document.getElementById('libboard').className = lib ? 'on' : '';
    document.getElementById('admin').className = adm ? 'on' : '';
    document.getElementById('navrow').style.display = any ? 'none' : '';
    document.getElementById('lobby').style.display = any ? 'none' : '';
    revealEl.style.display = any ? 'none' : '';
    syncPicksLink();
    if (stats) loadBoard();
    if (lib) loadLibBoard();
    if (adm) { admError = ''; loadAdmin(); }
  }
  window.addEventListener('hashchange', routeView);

  /* ------------------------------------------------ polling */
  var lastRevealSig = '';
  function revealSig(state){
    return (state.spin ? state.spin.id : '') + '|' + (canRollAgain ? '1' : '0') + '|' +
      features.length;
  }
  function poll(){
    fetch(API + 'tv-state?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(state){
        if (!state || !state.ok) return;
        features = state.features || [];
        canRollAgain = state.second_roll === true;
        renderLobby(state);

        if (state.spin && state.spin.id) {
          if (firstState) {
            /* Opened after the ceremony: show the outcome, do not re-run the theatre. */
            shownSpins[state.spin.id] = true;
            var res = state.spin.result || {};
            buildWheel(res.candidates || [], res.majority);
            var land = landingAngle(res.candidates || [], res.winner_film_id, res.roll);
            if (land != null) {
              rotation = ((-land) % 360 + 360) % 360;
              wheel.style.transition = 'none';
              wheel.style.transform = 'rotate(' + rotation.toFixed(3) + 'deg)';
            }
            showReveal(res, state.votes, true);
            lastRevealSig = revealSig(state);
          } else if (!shownSpins[state.spin.id] && !spinning) {
            shownSpins[state.spin.id] = true;
            runSpinAnimation(state.spin, state.votes);
          } else if (!spinning && revealEl.className === 'on' &&
              revealSig(state) !== lastRevealSig) {
            /* The roll-again button's inputs arrive a poll behind a live spin —
               repaint the reveal when they change so the host actually sees it. */
            lastRevealSig = revealSig(state);
            showReveal(state.spin.result || {}, state.votes, true);
          }
        } else if (!spinning && revealEl.className !== 'on') {
          /* The wheel is tonight's entries, nothing else. */
          var runners = state.entries || [];
          var sig = signature(runners);
          if (sig !== signature(drawn)) buildWheel(runners, state.majority);
        }
        syncPicksLink();
        firstState = false;
      })
      .catch(function(){ /* projector keeps calm and carries on */ });
  }

  document.getElementById('navPicks').addEventListener('click', reopenReveal);

  spinBtn.addEventListener('click', function(){
    if (spinning || spinBtn.disabled) return;
    spinning = true;
    spinBtn.disabled = true;
    fetch(spinUrl(), { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        spinning = false;
        if (!j || !j.ok || !j.spin) { spinBtn.disabled = false; return; }
        if (shownSpins[j.spin.id]) return;
        shownSpins[j.spin.id] = true;
        runSpinAnimation(j.spin, j.votes);
      })
      .catch(function(){ spinning = false; spinBtn.disabled = false; });
  });

  document.getElementById('navrow').innerHTML =
    (IS_HOST ? '<a class="navlink" id="navAdmin" href="#admin">admin</a>' : '') +
    '<a class="navlink" id="navLib" href="#library">library</a>' +
    '<a class="navlink" id="navBoard" href="#stats">history &amp; stats</a>';

  routeView();
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
