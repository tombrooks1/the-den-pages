<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Den &middot; TV</title>
<style>
:root{
  --bg:#0d0b14;
  --s1:#171225;
  --s2:#1d1731;
  --amber:#f5b942;
  --amber-deep:#e09e28;
  --text:#f4efe8;
  --muted:#8d85a3;
  --line:rgba(244,239,232,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07060b}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
/* Video-player behaviour: the pointer fades after a few still seconds, and any movement
   brings it back. The host has buttons to press up here. */
body.idlecursor, body.idlecursor *{cursor:none}
#stage{
  position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
  background:
    radial-gradient(1200px 700px at 22% -12%, rgba(245,185,66,.13), transparent 66%),
    radial-gradient(1000px 800px at 100% 10%, rgba(150,96,235,.15), transparent 64%),
    radial-gradient(900px 900px at -8% 90%, rgba(66,120,245,.09), transparent 70%),
    var(--bg);
  overflow:hidden;
}
.vignette{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(115% 92% at 50% 46%, transparent 52%, rgba(0,0,0,.62) 100%);
}
.grain{
  position:absolute;inset:-100px;z-index:7;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  animation:grain .8s steps(3) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)} 33%{transform:translate(-14px,9px)} 66%{transform:translate(11px,-12px)} 100%{transform:translate(0,0)}
}

/* ---------------- layout ---------------- */
#lobby{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:940px 1fr;gap:52px;padding:56px 64px}
.left{display:flex;flex-direction:column;justify-content:flex-start;gap:16px;min-height:0}
.right{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.panel{transition:opacity .9s ease, transform .9s ease;opacity:.6}
.panel.spot{opacity:1;transform:scale(1.012)}
#stage.busy .left{opacity:.25;filter:blur(3px);transition:opacity .7s ease, filter .7s ease}
.left{transition:opacity .7s ease, filter .7s ease}

/* ---------------- header ---------------- */
.bulbs{
  display:block;height:9px;width:250px;margin-bottom:20px;
  background-image:radial-gradient(circle, rgba(245,185,66,.95) 34%, transparent 38%);
  background-size:22px 9px;background-repeat:repeat-x;
  filter:drop-shadow(0 0 9px rgba(245,185,66,.6));animation:chase 1.6s linear infinite;
}
@keyframes chase{to{background-position:22px 0}}
.brand{font-size:19px;font-weight:800;letter-spacing:.52em;color:var(--amber);text-shadow:0 0 30px rgba(245,185,66,.55)}
.label{margin-top:12px;font-size:50px;font-weight:800;letter-spacing:-.045em;line-height:.98}
.countdown{margin-top:9px;font-size:27px;font-weight:800;letter-spacing:-.01em;color:var(--amber);
  font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(245,185,66,.3)}
.countdown:empty{display:none}
.countdown .u{font-size:19px;font-weight:700;color:var(--muted);letter-spacing:.06em;
  margin:0 12px 0 3px}
.countdown .u:last-child{margin-right:0}
.theme{margin-top:7px;font-size:21px;font-weight:600;color:var(--amber);letter-spacing:-.01em;
  text-shadow:0 0 34px rgba(245,185,66,.35)}
.status{
  display:inline-block;margin-top:12px;font-size:14px;font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;color:var(--amber);padding:9px 16px;border-radius:999px;
  background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.32);
}
.status.lock{
  color:#231806;border-color:transparent;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  box-shadow:0 0 48px rgba(245,185,66,.42);
}
.whenline{margin-top:8px;font-size:21px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.whenline:empty{display:none}
.notes{margin-top:10px;max-width:820px;font-size:16px;line-height:1.35;color:#b3aac6;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.notes:empty{display:none}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.heads{margin-left:18px;color:var(--amber);text-shadow:0 0 26px rgba(245,185,66,.4)}
.snacks{margin-top:8px;font-size:16px;color:var(--muted);line-height:1.5}
.snacks:empty{display:none}
.snacks b{color:var(--text);font-weight:700}
.snacks .sep{opacity:.45;margin:0 10px}

/* ---------------- rsvp roll ---------------- */
.roll{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.seats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
.seat{
  height:42px;border-radius:14px;display:flex;align-items:center;gap:9px;padding:0 12px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);overflow:hidden;
  animation:cardin .4s cubic-bezier(.2,.9,.3,1) both;
}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
/* ---------------- member profiles ---------------- */
.seat[data-member],.chip[data-member]{cursor:pointer;transition:border-color .15s ease}
.seat[data-member]:hover,.chip[data-member]:hover{border-color:rgba(245,185,66,.55)}
#modal .pbox{width:min(1150px,100%)}
#modal .pcol{width:260px;flex:none}
.pface{width:240px;height:240px;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px var(--line)}
.pface.pemoji{display:grid;place-items:center;font-size:104px}
.phost{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#0d0b14;background:var(--amber);border-radius:6px;padding:4px 10px;
  vertical-align:8px;margin-left:10px}
.psec{margin:24px 0 10px;font-size:12px;font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted)}
.prow{display:flex;align-items:center;gap:14px;padding:8px 0;
  border-top:1px solid rgba(244,239,232,.06)}
.prow .poster{width:44px;height:66px;aspect-ratio:auto;border-radius:8px;flex:none}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.prow .pt i{font-style:normal;font-size:13px;color:var(--muted)}
.pwon{flex:none;font-size:13px;font-weight:800;color:var(--amber)}
.pline{padding:6px 0;font-size:15.5px;border-top:1px solid rgba(244,239,232,.06)}
.pline .paws{margin-left:8px}
.dim{color:var(--muted)}
.seat .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  flex:none}
.seat .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.guest{background:rgba(255,255,255,.03)}
.seat.guest .nm{color:var(--muted);font-weight:600}
.seat.free{background:rgba(255,255,255,.014);border-style:dashed;border-color:rgba(244,239,232,.13)}
.seat.free .dot{width:30px;height:30px;border-radius:50%;border:1px dashed rgba(244,239,232,.14);
  flex:none}
.chip{
  display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 10px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:17px;font-weight:700;
  animation:arrive .55s cubic-bezier(.2,.9,.3,1) both;
}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px}
/* A "maybe" must never read as an "in" from the couch: own row, own label, dashed and muted. */
.roll + .roll{margin-top:12px}
.rtag{align-self:center;font-size:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted)}
.chip.maybe{background:transparent;border-style:dashed;border-color:rgba(244,239,232,.26);
  color:var(--muted)}
.chip.maybe .av{opacity:.65}
.chip.maybe .q{margin-left:3px;font-weight:800;color:var(--amber);opacity:.85}
.outline{margin-top:10px;font-size:15px;color:var(--muted);opacity:.7;letter-spacing:.02em}
@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

/* ---------------- the scoreboard ----------------
   Tonight's fourteen slots, each a full row: poster, who brought it, the vote bar, the
   jokers beside it, the odds. Empty slots draw the same skeleton so the format teaches
   itself before anyone acts. Two columns of seven — one column of fourteen cannot be
   legible at this size alongside the header and the seats (the budget test proves it). */
/* Six at a time, ranked: two columns of three, filled DOWN each column so the running
   order reads top to bottom. Six rows instead of fourteen buys the height back, so the
   posters are big enough to recognise from the sofa and the board fills its side of the
   screen. The page turns on its own timer, or by hand. */
.scoreboard{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,auto);gap:12px 20px;margin-top:10px;position:relative;
  opacity:1;transition:opacity .17s ease}
.scoreboard.turning{opacity:0}
.srow{position:relative;display:grid;grid-template-columns:72px 1fr 150px 52px;gap:12px;
  align-items:center;height:114px;animation:cardin .4s cubic-bezier(.2,.9,.3,1) both}
.srow .th{width:72px;height:108px;border-radius:8px;overflow:hidden}
.srow .th .poster{width:72px;height:108px;aspect-ratio:auto;border-radius:8px;box-shadow:none;
  border:none}
.srow .th .ph{padding:6px}
.srow .th .ph-t{font-size:13px;line-height:1.08;padding-right:0;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.srow .th .ph-f{display:none}
.srow .frame{width:72px;height:108px;border-radius:8px;border:1px dashed rgba(244,239,232,.13);
  background:rgba(255,255,255,.014)}
/* Title, who brought it, and their jokers, stacked — the row is tall enough to hold all
   three without crowding, and it leaves the bar its own full-width lane. */
.srow .st{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.srow .st b{display:block;font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.14;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st i{display:block;font-style:normal;font-size:15px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tb{display:flex;gap:3px;align-items:center}
/* One line, in passing: what it is streaming on right now. */
.srow .dstream{margin-top:10px;font-size:14px;font-weight:700;color:var(--amber)}
.srow .dstream:empty{display:none}
.card .detail .cstream{margin-top:8px;font-size:13px;font-weight:700;color:var(--amber)}

/* The dossier. Same manners as the library cards: it lifts out over its neighbours rather
   than pushing them around, in the same fifth of a second. Rows on the bottom of the page
   open it upward so it can never fall off a 1080 screen. */
.srow .dossier{
  position:absolute;left:-10px;right:-10px;top:calc(100% + 6px);z-index:25;
  padding:16px 18px 18px;border-radius:16px;
  /* Solid ground, no alpha anywhere: the rows behind must never read through. */
  background:#221a38;
  border:1px solid #55461f;box-shadow:0 30px 70px rgba(0,0,0,.72);
  opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .15s cubic-bezier(.2,.9,.3,1), transform .15s cubic-bezier(.2,.9,.3,1);
}
.srow.up .dossier{top:auto;bottom:calc(100% + 6px);transform:translateY(8px)}
/* An invisible footbridge across the gap, so the pointer can walk from the row down into
   the panel without the panel vanishing underfoot. */
.srow .dossier::before{content:'';position:absolute;left:-10px;right:-10px;top:-16px;height:16px}
.srow.up .dossier::before{top:auto;bottom:-16px}
.srow:hover{z-index:25}
.srow:hover .dossier{opacity:1;transform:none;pointer-events:auto}
.srow .dfacts{display:flex;flex-wrap:wrap;gap:8px}
.srow .dfacts:empty{display:none}
.srow .dfacts span{font-size:13px;font-weight:700;line-height:1;padding:6px 10px;
  border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.srow .dfacts span.star{color:var(--amber);border-color:rgba(245,185,66,.32);
  background:rgba(245,185,66,.09)}
.srow .dsyn{margin:12px 0 0;font-size:15px;line-height:1.5;color:#c9c2da;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.srow .dwho{margin-top:12px;font-size:14px;font-weight:700;color:var(--muted)}
.srow .dmore{margin-top:14px;min-height:38px;padding:0 20px;font-size:12px}

/* Already played tonight: still on the board, plainly out of the running. */
.srow .wontag{display:none}
.srow.won .wontag{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;
  font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1;
  padding:5px 9px;border-radius:999px;color:#0f0b16;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep))}
.srow.won .st b{color:var(--amber)}
.srow.won .th{box-shadow:0 0 0 2px var(--amber)}
.srow.won .tb, .srow.won .sp{opacity:.4}
.srow .jk{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden}
.srow .jk:empty{display:none}
.srow .jk span{font-size:12px;font-weight:700;line-height:1;padding:5px 9px;border-radius:999px;
  background:rgba(200,150,255,.14);border:1px solid rgba(200,150,255,.34);color:#e2c6ff;
  white-space:nowrap}
.srow .sp{font-size:22px;font-weight:800;text-align:right;color:var(--muted);
  font-variant-numeric:tabular-nums}
/* Which page of the running order is showing, and how to drive it by hand. The targets are
   sized for a mouse used from across the room, and wear the same amber pill states as every
   other control on the screen. */
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;
  height:40px}
.pgbtn{display:grid;place-items:center;box-sizing:border-box;width:40px;height:40px;padding:0;
  font:inherit;font-size:24px;font-weight:800;line-height:1;cursor:pointer;
  color:var(--amber);background:rgba(245,185,66,.08);
  border:1px solid rgba(245,185,66,.32);border-radius:50%;
  transition:background .16s ease, border-color .16s ease, transform .12s ease}
.pgbtn:hover{background:rgba(245,185,66,.16);border-color:rgba(245,185,66,.55)}
.pgbtn:active{transform:scale(.94)}
.pgbtn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(245,185,66,.35)}
.pagedots{display:flex;gap:2px;justify-content:center;align-items:center}
.pagedots .dot{display:grid;place-items:center;width:34px;height:34px;padding:0;cursor:pointer;
  background:none;border:none;border-radius:50%}
.pagedots .dot::before{content:'';display:block;width:10px;height:10px;border-radius:50%;
  background:rgba(244,239,232,.18);
  transition:background .2s ease, transform .2s ease}
.pagedots .dot:hover::before{background:rgba(245,185,66,.6);transform:scale(1.2)}
.pagedots .dot:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(245,185,66,.35)}
.pagedots .dot.on::before{background:var(--amber);transform:scale(1.4)}
.srow.lead .sp{color:var(--amber)}
.srow.lock .st b{color:var(--amber)}
.srow.free .st b{color:var(--muted);font-weight:600}
.seg{height:34px;border-radius:5px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);transition:background .18s ease, border-color .18s ease}
.seg.on{background:linear-gradient(180deg,var(--amber),var(--amber-deep));border-color:transparent}
.seg.over{background:rgba(245,185,66,.32);border-color:rgba(245,185,66,.5)}
.srow.free .seg{border-style:dashed;border-color:rgba(244,239,232,.1);background:transparent}
/* The host's quiet way to cancel a no-show's film, on the row itself. */
.srow .ejx{
  position:absolute;top:10px;right:-8px;z-index:3;width:26px;height:26px;padding:0;
  font:inherit;font-size:15px;font-weight:800;line-height:1;cursor:pointer;
  color:var(--muted);background:rgba(13,11,20,.86);border:1px solid var(--line);
  border-radius:50%;display:grid;place-items:center;
}
.srow .ejx:hover{color:#ffc2cc;border-color:rgba(219,87,109,.5)}
.srow .ejc{display:none}
.srow.arm .ejc{
  display:flex;flex-direction:row;gap:8px;position:absolute;inset:0;z-index:4;
  align-items:center;justify-content:flex-start;padding:0 8px;
  background:rgba(8,6,14,.94);border-radius:8px;
}
.srow.arm .ejc .q{font-size:13px;font-weight:700;line-height:1;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.srow.arm .ejc button{
  font:inherit;font-size:11px;font-weight:800;line-height:1;padding:6px 11px;cursor:pointer;
  border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);
  color:var(--text);flex:none;
}
.srow.arm .ejc .yes{color:#ffc2cc;border-color:rgba(219,87,109,.45)}
.thline{position:absolute;top:16px;bottom:0;width:2px;background:rgba(245,185,66,.5);
  box-shadow:0 0 10px rgba(245,185,66,.4);pointer-events:none}
.thline span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.more{margin-top:10px;font-size:14px;color:var(--muted);letter-spacing:.04em}
.empty{color:var(--muted);font-size:26px;margin-top:26px;font-weight:600}

/* ---------------- wheel ---------------- */
.needle{
  width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;
  border-top:44px solid var(--amber);filter:drop-shadow(0 6px 16px rgba(245,185,66,.6));z-index:4;
}
.wheelbox{position:relative;width:720px;height:720px;margin-top:8px}
#wheel{
  position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 12px rgba(13,11,20,.9), 0 0 0 15px rgba(245,185,66,.35),
             0 40px 110px rgba(0,0,0,.65), inset 0 0 90px rgba(0,0,0,.55);
  will-change:transform;
}
.lab{
  position:absolute;left:50%;top:50%;width:268px;height:36px;margin-left:-134px;margin-top:-18px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:20px;font-weight:800;letter-spacing:-.015em;color:#0f0c17;
  text-shadow:0 1px 0 rgba(255,255,255,.26);white-space:nowrap;overflow:hidden;
}
.lab .o{font-size:17px;font-weight:800;opacity:.6}
.lab .o.j{opacity:.85}
.hub{
  position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #241d3a, #120e1e);
  border:3px solid rgba(245,185,66,.5);z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 0 44px rgba(0,0,0,.7), 0 0 30px rgba(245,185,66,.18);
}
.hub .paw{font-size:46px;line-height:1}
.hub .t{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--amber);opacity:.85}
#spin{
  margin-top:30px;font:inherit;font-size:23px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#231806;background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  border:none;border-radius:999px;padding:22px 74px;cursor:pointer;
  box-shadow:0 20px 54px rgba(245,185,66,.32);transition:transform .16s ease, box-shadow .16s ease;
}
#spin:hover{transform:translateY(-2px);box-shadow:0 26px 64px rgba(245,185,66,.42)}
#spin:disabled{opacity:.35;box-shadow:none;transform:none;cursor:default}
.hint{margin-top:16px;font-size:15px;color:var(--muted);letter-spacing:.06em}

/* ---------------- reveal ---------------- */
#reveal{
  position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;gap:70px;
  padding:90px;background:rgba(8,6,14,.9);backdrop-filter:blur(16px);
}
#reveal.on{display:flex;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#reveal .art{width:400px;flex:none;display:flex;gap:22px}
#reveal .art.double{width:560px}
#reveal .art .poster{border-radius:22px;box-shadow:0 50px 120px rgba(0,0,0,.75),0 0 0 1px rgba(245,185,66,.28)}
#reveal .art.double .poster{width:auto;flex:1;min-width:0;border-radius:16px}
#reveal .meta{max-width:1010px}
#reveal .first{
  margin-top:22px;font-size:22px;font-weight:600;color:var(--muted);
}
#reveal .first b{color:var(--text);font-weight:800}
/* The reveal is a room you can leave and come back to. */
#revClose{
  position:absolute;top:34px;right:44px;z-index:3;font:inherit;font-size:14px;font-weight:800;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;
  padding:11px 22px;
}
#revClose:hover{color:var(--text);border-color:rgba(244,239,232,.28)}
#again{
  margin-top:38px;font:inherit;font-size:19px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);background:rgba(245,185,66,.1);
  border:1px solid rgba(245,185,66,.4);border-radius:999px;padding:16px 40px;cursor:pointer;
}
#again:hover{background:rgba(245,185,66,.18)}
#again:disabled{opacity:.35;cursor:default}
#reveal .kicker{font-size:15px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--amber)}
#reveal h1{margin-top:20px;font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:.97}
#reveal .yr{font-weight:600;color:var(--muted)}
#reveal .by{margin-top:26px;display:inline-flex;align-items:center;gap:14px;font-size:26px;font-weight:700;
  padding:12px 26px 12px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
#reveal .by .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px}
#reveal .voted{margin-top:40px}
#reveal .voted .eyebrow{margin-bottom:14px;display:block}
#reveal .votedrow{display:flex;flex-wrap:wrap;gap:12px}
#confetti{position:absolute;inset:0;z-index:9;pointer-events:none}

/* ---------------- history & stats board ---------------- */
.navrow{position:absolute;right:64px;bottom:30px;z-index:12;display:flex;gap:12px;
  align-items:center}
/* Every navigation pill is the SPIN button with the volume down: same family — pill radius,
   uppercase, wide letterspacing, heavy weight — smaller and quieter. inline-flex with
   line-height:1 and no vertical padding is what actually centres the label, whether the pill
   renders as a link or a button. */
.pillbtn{
  display:inline-flex;align-items:center;justify-content:center;
  box-sizing:border-box;min-height:46px;padding:0 26px;
  font:inherit;font-size:14px;font-weight:800;line-height:1;letter-spacing:.2em;
  text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;
  color:var(--amber);background:rgba(245,185,66,.08);
  border:1px solid rgba(245,185,66,.32);border-radius:999px;
  transition:background .16s ease, border-color .16s ease, transform .12s ease;
}
.pillbtn:hover{background:rgba(245,185,66,.16);border-color:rgba(245,185,66,.55)}
.pillbtn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(245,185,66,.35)}
.pillbtn:active{transform:translateY(1px)}
.pillbtn.corner{}
.pillbtn.back{margin-top:30px}
.pillbtn.hidden{display:none}
/* ---------------- the full-screen views: one chrome, one card language ----------------
   These three screens are fetched on entry and never poll, so unlike the lobby they are free
   to animate. Everything below is built for a 1920x1080 projector viewed from a couch. */
#board, #libboard, #admin{position:absolute;inset:0;z-index:11;display:none;
  padding:0;overflow:hidden;background:var(--bg)}
#libboard.on, #board.on{display:block;overflow-y:auto;overflow-x:hidden}
#admin.on{display:block;overflow-y:auto}
.admgrid{display:grid;grid-template-columns:1fr 560px;gap:48px;align-items:start}
.vwrap{padding:0 64px 90px;min-height:100%}
.vhead{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:26px;
  padding:38px 64px 20px;margin:0 0 26px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(13,11,20,.86) 88%,transparent);
}
.vtitle{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;flex:none}
.vcount{margin-left:14px;font-size:16px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.vspace{flex:1}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vsep{width:1px;height:26px;background:var(--line);margin:0 6px}
.vlabel{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
.fchip{
  display:inline-flex;align-items:center;gap:7px;box-sizing:border-box;min-height:38px;
  padding:0 16px;font:inherit;font-size:13px;font-weight:700;line-height:1;cursor:pointer;
  color:var(--muted);background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:999px;transition:color .16s ease, background .16s ease, border-color .16s ease;
}
.fchip:hover{color:var(--text);border-color:rgba(244,239,232,.26)}
.fchip.on{color:#231806;background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  border-color:transparent}
.fchip .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}

/* ---------------- the film card ---------------- */
.filmwall{display:grid;grid-template-columns:repeat(8,208px);gap:34px 18px;
  justify-content:space-between;align-items:start}
.slot{position:relative;height:376px;animation:cardin .44s cubic-bezier(.2,.9,.3,1) both}
.card{
  position:absolute;left:0;top:0;width:208px;height:376px;border-radius:18px;overflow:hidden;
  background:linear-gradient(158deg,var(--s2),var(--s1));border:1px solid var(--line);
  box-shadow:0 12px 28px rgba(0,0,0,.42);
  transition:height .2s cubic-bezier(.2,.9,.3,1), width .2s cubic-bezier(.2,.9,.3,1),
    left .2s cubic-bezier(.2,.9,.3,1), top .2s cubic-bezier(.2,.9,.3,1),
    box-shadow .2s ease, border-color .2s ease;
}
.slot:hover .card, .slot.up .card{
  width:248px;height:596px;left:-20px;top:-14px;z-index:20;
  border-color:rgba(245,185,66,.42);
  box-shadow:0 34px 74px rgba(0,0,0,.72), 0 0 0 1px rgba(245,185,66,.18);
}
.slot:hover, .slot.up{z-index:20}
.card .art{position:relative;width:100%;height:264px;overflow:hidden;
  transition:height .2s cubic-bezier(.2,.9,.3,1)}
.slot:hover .card .art, .slot.up .card .art{height:300px}
.card .art .poster{width:100%;height:100%;aspect-ratio:auto;border-radius:0;border:none;
  box-shadow:none;object-fit:cover}
.card .art .ph{padding:14px}
.card .art .ph-t{font-size:15px;line-height:1.12;padding-right:0;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card .art .ph-f{font-size:18px}
.card .imdb{
  position:absolute;top:9px;right:9px;font-size:12px;font-weight:800;letter-spacing:.02em;
  padding:5px 9px;border-radius:999px;background:rgba(13,11,20,.82);
  border:1px solid rgba(245,185,66,.34);color:var(--amber);
}
.card .seenflag{
  position:absolute;top:9px;left:9px;font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(13,11,20,.82);
  border:1px solid var(--line);color:var(--muted);
}
.card .seenflag.yes{color:#9fe0c0;border-color:rgba(99,192,138,.42)}
.card .body{padding:13px 15px 0}
.card .ct{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cby{margin-top:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.card .detail{
  opacity:0;max-height:0;overflow:hidden;padding:0 15px;
  transition:opacity .16s ease, max-height .2s cubic-bezier(.2,.9,.3,1), padding .2s ease;
}
.slot:hover .card .detail, .slot.up .card .detail{opacity:1;max-height:260px;padding:12px 15px 16px}
.card .cast{margin-top:8px;font-size:11.5px;line-height:1.35;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .syn{font-size:12.5px;line-height:1.42;color:#c3bcd4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.fact{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.fact.paw{color:var(--amber);border-color:rgba(245,185,66,.3)}
.fact.on{color:#9fe0c0;border-color:rgba(99,192,138,.35)}
.card .more{
  display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  margin-top:12px;min-height:38px;padding:0 18px;width:100%;
  font:inherit;font-size:12px;font-weight:800;line-height:1;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;color:#231806;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  border:none;border-radius:999px;
}
.card .more:hover{filter:brightness(1.06)}

/* empty frames so a young library looks intentional rather than broken */
.slot.ghost .frame{
  position:absolute;inset:0;border-radius:18px;border:1px dashed rgba(244,239,232,.13);
  background:rgba(255,255,255,.016);
}
.slot.ghost .frame::after{
  content:"";position:absolute;left:50%;top:44%;width:34px;height:34px;margin:-17px 0 0 -17px;
  border-radius:50%;border:1px dashed rgba(244,239,232,.14);
}

/* staggered entrance — the wall assembles itself rather than appearing (see .slot above) */
@keyframes cardin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------------- the details modal ---------------- */
#modal{position:absolute;inset:0;z-index:40;display:none}
/* Centred by the container, never by transform: the open animation ends on transform:none,
   so anything that positioned the dialog with a transform would be dropped the moment it
   settled. Flex does the centring; the keyframes only do the motion. */
#modal.on{display:flex;align-items:center;justify-content:center;padding:40px}
#modal .scrim{position:absolute;inset:0;background:rgba(8,6,14,.78);backdrop-filter:blur(10px);
  animation:fadein .2s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
#modal .box{
  position:relative;width:min(1400px,100%);max-height:100%;overflow-y:auto;
  display:flex;gap:46px;padding:46px;
  border-radius:28px;background:linear-gradient(158deg,var(--s2),var(--s1));
  border:1px solid var(--line);box-shadow:0 60px 140px rgba(0,0,0,.8);
  animation:popin .26s cubic-bezier(.2,.9,.3,1) both;transform-origin:center center;
}
#modal .cover{width:380px;flex:none;position:relative}
#modal .cover .poster{width:380px;height:570px;aspect-ratio:auto;border-radius:18px;
  box-shadow:0 30px 70px rgba(0,0,0,.6)}
/* Mouse over the poster and the trailer offers itself. */
.playbtn{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-decoration:none;
  background:rgba(13,11,20,.55);opacity:0;transition:opacity .18s ease}
#modal .cover:hover .playbtn,.playbtn:focus-visible{opacity:1}
@media(hover:none){.playbtn{opacity:1;background:none}
  .playbtn i{background:rgba(13,11,20,.65)}}
.playbtn span{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
  background:var(--amber);color:#0d0b14;font-size:34px;padding-left:7px;
  box-shadow:0 18px 50px rgba(0,0,0,.65)}
.playbtn i{font-style:normal;font-size:13px;font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;color:var(--text);padding:4px 12px;border-radius:999px}
/* The cinema: the trailer plays here, on this screen, not on a tab somewhere else. */
#cinema{position:fixed;inset:0;z-index:90;display:none}
#cinema.on{display:block;animation:fadein .2s ease both}
#cinema .cscrim{position:absolute;inset:0;background:rgba(8,6,14,.88);cursor:pointer}
#cinema .cframe{position:absolute;inset:0;margin:auto;width:min(1620px,92vw);
  aspect-ratio:16/9;max-height:86vh}
#cinema iframe{width:100%;height:100%;border:0;border-radius:18px;background:#000;
  box-shadow:0 60px 140px rgba(0,0,0,.85),0 0 0 1px rgba(245,185,66,.22)}
#cinema .cx{position:absolute;top:-52px;right:0}
.pillbtn.mute{position:fixed;left:26px;bottom:24px;z-index:40;opacity:.55}
.pillbtn.mute:hover{opacity:1}
.mcredit{position:fixed;left:26px;top:16px;z-index:40;font-size:11px;
  color:var(--muted);opacity:.45;letter-spacing:.04em}
.spinaux{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:16px;
  min-height:30px}
.ready{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--amber);opacity:.75}
.ready:empty{display:none}
#modal .side{flex:1;min-width:0}
#modal h3{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin:0}
#modal .yr{color:var(--muted);font-weight:600}
#modal .mfacts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
#modal .msyn{margin-top:22px;font-size:19px;line-height:1.55;color:#c9c2da}
#modal .mcast{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:20px}
#modal .mcast .ck{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
#modal .den{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px 26px}
#modal .den div{font-size:15px;color:var(--muted)}
#modal .den b{display:block;margin-top:3px;font-size:22px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums}
#modal .x{position:absolute;top:22px;right:26px}
/* Where to watch it. Logos come from TMDB's own image host, so they are plain images with
   a name beside them — nobody should have to recognise a roundel. */
.watch{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.watch .wrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.watch .wrow:first-of-type{margin-top:0}
.watch .wk{flex:none;width:64px;font-size:12px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.watch .wp{display:flex;flex-wrap:wrap;gap:8px}
.watch .wp a{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;
  padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--text);text-decoration:none;
  transition:border-color .15s ease}
.watch .wp a:hover,.watch .wp a:focus-visible{border-color:var(--amber);outline:none}
.watch .wp img{width:26px;height:26px;border-radius:7px;display:block}
.watch .wlink{display:inline-block;margin-top:16px;font-size:14px;font-weight:800;
  letter-spacing:.04em;color:var(--amber);text-decoration:none}
.watch .wlink:hover{text-decoration:underline}
.watch .wattr{margin-top:12px;font-size:12px;color:var(--muted);opacity:.7}

/* ---------------- the stat strip ---------------- */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;
  margin-bottom:34px}
.tile{padding:16px 18px;border-radius:16px;background:linear-gradient(158deg,var(--s2),var(--s1));
  border:1px solid var(--line)}
.tile .k{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted)}
.tile .v{margin-top:7px;font-size:30px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
/* Folklore reads at couch distance: the answer leads, the stat seconds it, the line lands. */
.folkstrip{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tile.folk .k{font-size:12px}
.tile .fv{margin-top:9px;font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile .fsub{margin-top:7px;font-size:17px;font-weight:700;color:var(--amber)}
.tile .fs{margin-top:8px;font-size:15px;color:var(--muted);line-height:1.5}
.tile .s{margin-top:5px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tile.amber .v{color:var(--amber)}
/* The stats board is a single 1080 screen: tighter rhythm, no scrolling. */
#board .vwrap{padding-bottom:20px;min-height:0}
#board .vhead{padding:26px 64px 14px;margin-bottom:14px}
#board .secthead{margin:20px 0 12px}
.secthead{margin:36px 0 18px;font-size:15px;font-weight:800;letter-spacing:.28em;
  text-transform:uppercase;color:var(--muted)}
.bempty{color:var(--muted);font-size:20px}

/* ---------------- admin panel: a control room, not a document ---------------- */
.err{margin-bottom:18px;padding:14px 18px;border-radius:14px;font-size:17px;font-weight:600;
  color:#ffd9df;background:rgba(219,87,109,.16);border:1px solid rgba(219,87,109,.45)}
.nrow{padding:18px 20px;border-radius:18px;background:linear-gradient(158deg,var(--s2),var(--s1));
  border:1px solid var(--line)}
.nrow + .nrow{margin-top:14px}
.nrow.open{border-color:rgba(245,185,66,.4)}
.nhead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;cursor:pointer}
.ntitle{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.nmeta{margin-top:6px;font-size:15px;color:var(--muted)}
.chip2{flex:none;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;color:var(--amber);background:rgba(245,185,66,.1);
  border:1px solid rgba(245,185,66,.32)}
.chip2.spun{color:#9fe0c0;background:rgba(99,192,138,.12);border-color:rgba(99,192,138,.35)}
.chip2.done{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.abtn{
  font:inherit;font-size:16px;font-weight:800;cursor:pointer;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;
  padding:14px 22px;min-height:52px;
}
.abtn:hover{border-color:rgba(244,239,232,.3)}
.abtn.go{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#231806;
  border-color:transparent}
.abtn.warn{color:#ffc2cc;border-color:rgba(219,87,109,.4)}
.abtn:disabled{opacity:.45;cursor:default}
.elist{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.erow{display:flex;align-items:center;gap:16px;padding:10px 0;font-size:17px}
.erow + .erow{border-top:1px dashed rgba(244,239,232,.08)}
.erow .et{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .ew{flex:none;color:var(--muted);font-size:15px}
.form label{display:block;margin-top:18px;font-size:13px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.form input, .form select, .form textarea{
  width:100%;margin-top:8px;font:inherit;font-size:18px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;outline:none;
}
.form textarea{min-height:88px;resize:vertical}
.form input:focus, .form select:focus, .form textarea:focus{border-color:rgba(245,185,66,.45)}
.form option{background:#171225}

@media (prefers-reduced-motion: reduce){
  .grain,.bulbs,.chip,.pw,.slot{animation:none}
  .scoreboard{transition:none}
  .pagedots .dot::before,.pgbtn{transition:none}
  .srow .dossier{transition:none}
  .panel{transition:none}
  .card,.card .art,.card .detail{transition:none}
  #modal .box,#modal .scrim{animation:none}
}
</style>
</head>
<body>
<div id="stage">
  <div id="lobby">
    <div class="left">
      <section class="panel spot" id="hdr">
        <span class="bulbs"></span>
        <div class="brand">THE DEN</div>
        <div class="label" id="label">Loading the projector</div>
        <div class="countdown" id="countdown"></div>
        <div class="whenline" id="whenline"></div>
        <div class="theme" id="theme"></div>
        <div><span class="status" id="status">standby</span></div>
        <div class="notes" id="notes"></div>
      </section>

      <section class="panel" id="roll">
        <div class="eyebrow">Who is coming<span class="heads" id="rollHeads"></span></div>
        <div class="seats" id="seatGrid"></div>
        <div id="rollList"></div>
        <div class="snacks" id="snackList"></div>
      </section>

      <section class="panel" id="wall">
        <div class="eyebrow">Tonight&#39;s entries<span class="heads" id="wallHeads"></span></div>
        <div class="scoreboard" id="scoreboard"></div>
        <div class="pager" id="pager">
          <button class="pgbtn" data-page="prev" aria-label="previous page">&lsaquo;</button>
          <div class="pagedots" id="pageDots"></div>
          <button class="pgbtn" data-page="next" aria-label="next page">&rsaquo;</button>
        </div>
        <div class="more" id="wallMore"></div>
      </section>
    </div>

    <div class="right">
      <div class="needle"></div>
      <div class="wheelbox">
        <div id="wheel"></div>
        <div class="hub"><span class="paw">&#128062;</span><span class="t">THE DEN</span></div>
      </div>
      <button id="spin">Spin the wheel</button>
      <div class="spinaux">
        <button id="sealBtn" class="pillbtn seal" style="display:none">🔒 seal the ballots</button>
        <span id="readyLabel" class="ready"></span>
      </div>

    </div>
  </div>

  <div id="board"></div>
  <div id="libboard"></div>
  <div id="admin"></div>
  <div id="modal"></div>
  <div id="cinema"></div>
  <button id="muteBtn" class="pillbtn mute"></button>
  <div class="mcredit">&#9834; Kevin MacLeod &middot; incompetech.com &middot; CC-BY</div>
  <div class="navrow" id="navrow"></div>

  <div id="reveal"></div>
  <canvas id="confetti" width="1920" height="1080"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<script>
(function(){
  var PARAMS = new URLSearchParams(location.search);
  var KEY = PARAMS.get('key') || '';
  /* The group link carries ?key= and shows everything. The hosts' bookmark adds &host=,
     and only that can turn the wheel. */
  var HOSTKEY = PARAMS.get('host') || '';
  var IS_HOST = HOSTKEY.length > 0;
  function spinUrl(){
    return API + 'spin?key=' + encodeURIComponent(KEY) + '&host=' + encodeURIComponent(HOSTKEY);
  }
  /* This page is hosted on GitHub Pages, so the API is a different origin entirely. */
  var API = 'https://psomtujaikgcvblklzgv.supabase.co/functions/v1/app/api/';
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var wheel = document.getElementById('wheel');
  var spinBtn = document.getElementById('spin');
  var revealEl = document.getElementById('reveal');
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');

  var rotation = 0;         /* current wheel angle, degrees, monotonically increasing */
  var drawn = [];           /* candidates currently painted on the wheel */
  var shownSpins = {};      /* spin ids already revealed */
  var spinning = false;
  var firstState = true;
  var features = [];        /* every film that has won tonight, in running order */
  var canRollAgain = false; /* is there anything left for a second feature? */
  var SECOND_LABEL = 'Roll again';
  var FIRST_LABEL = 'Spin the wheel';
  var lobbyRolls = false;   /* the lobby button is offering the second feature, not the first */
  var wonIds = {};          /* every film that has already won tonight */
  var dossiers = {};        /* film_id -> the library's file on it, for the hover panels */
  var dossiersAsked = false;
  var hoverRow = '';        /* the row under the pointer, if any */
  var lastReveal = null;    /* the reveal we can put back on screen */
  var SEAT_CAP = 14;        /* the living room's capacity, mirrored from the API */
  /* The ceremony's clock. The group announcement is scheduled 10s after the spin resolves,
     so the reveal at 9.2s lands first — on purpose, and by a margin that survives latency. */
  var SPIN_MS = 9000;
  var REVEAL_GAP_MS = 200;
  var ejectArmed = '';      /* the film whose eject confirm is showing */
  var sigs = {};            /* last-painted signature per section — the anti-flicker record */
  var lastBoard = null;     /* what the scoreboard last drew, so a tap can redraw it */

  /* Slice colours come from this by INDEX, so neighbours always differ. Who suggested what
     is carried by the label, not the colour. */
  var WHEEL_COLORS = [
    '#e0736f', '#e09455', '#d9b356', '#a9c05e', '#63c08a', '#4fb9b0',
    '#5aa6dd', '#7d8ce4', '#a97ae0', '#d071c8', '#dd6f9c', '#c08a6a'
  ];

  function sliceColors(n){
    var out = [], i, c;
    for (i = 0; i < n; i++) {
      c = WHEEL_COLORS[i % WHEEL_COLORS.length];
      if (i > 0 && c === out[i - 1]) c = WHEEL_COLORS[(i + 1) % WHEEL_COLORS.length];
      /* The last slice touches the first one, so close the loop too. */
      if (i === n - 1 && n > 2 && c === out[0]) c = WHEEL_COLORS[(i + 2) % WHEEL_COLORS.length];
      out.push(c);
    }
    return out;
  }

  /* Pointer fades out of the way after a few still seconds, like a video player. */
  var idleTimer = null;
  function wakeCursor(){
    document.body.className = '';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.className = 'idlecursor'; }, 3000);
  }
  document.addEventListener('mousemove', wakeCursor);
  wakeCursor();

  /* ------------------------------------------------ helpers */
  var ENT = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ENT[c]; }); }
  function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? String(c) : '#b48ef2'; }
  function hash(s){
    var h = 0, str = String(s || '');
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  function rgba(hex, a){
    var h = safeColor(hex).slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h.slice(0, 6), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function poster(title, url){
    if (url) return '<img class="poster" alt="" src="' + esc(url) + '">';
    var h = hash(title), a = h % 360, b = (h >> 7) % 360;
    return '<div class="poster ph" style="background:linear-gradient(158deg,hsl(' + a +
      ' 42% 27%),hsl(' + b + ' 52% 13%))"><span class="ph-t">' + esc(title) +
      '</span><span class="ph-f">&#127916;</span></div>';
  }
  /* A real Telegram photo when we have one; the animal emoji when we don't. */
  function avatar(m){
    var c = safeColor(m && m.color);
    if (m && m.avatar) {
      return '<span class="av" style="box-shadow:inset 0 0 0 2px ' + c + '99">' +
        '<img src="' + esc(m.avatar) + '" alt=""></span>';
    }
    return '<span class="av" style="background:' + c + '33;box-shadow:inset 0 0 0 2px ' + c + '99">' +
      ((m && m.emoji) ? esc(m.emoji) : '&#128062;') + '</span>';
  }
  function pct(o){ return Math.round((o || 0) * 100) + '%'; }
  function fmtDate(iso){
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    } catch (e) { return ''; }
  }
  function statusText(s){
    var map = { planned:'Entries open', locked:'Voting is open', spun:'The wheel has chosen', watched:'Watched' };
    return map[s] || 'standby';
  }

  /* ------------------------------------------------ stage fit */
  function fit(){
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ------------------------------------------------ the wheel */
  function signature(list){
    return list.map(function(c){
      return c.film_id + ':' + Math.round((c.odds || 0) * 1000) + ':' +
        (c.votes || 0) + ':' + (c.jokers || 0);
    }).join('|');
  }

  /**
   * Slices run clockwise from 12 o'clock, matching CSS conic-gradient's own origin,
   * so a slice's on-screen angle is exactly its cumulative-odds position.
   *
   * The odds handed in are already honest about a majority lock (the winner is on 100%,
   * everyone else on 0), so a locked wheel is one full slice and the rest vanish. Slivers too
   * thin to read get no label.
   */
  /**
   * What a second roll would actually draw from: tonight's entries minus whatever has
   * already won, with the weights shared out again over what is left. Weight is the honest
   * basis — a night locked by majority has odds of 1 and 0 on the board, and those mean
   * nothing once the winner is off the wheel.
   */
  function remainingRunners(entries, won){
    var out = [], total = 0, i, k;
    for (i = 0; i < entries.length; i++) {
      if (won[entries[i].film_id]) continue;
      var c = {};
      for (k in entries[i]) c[k] = entries[i][k];
      var w = c.weight;
      if (!(w > 0)) w = 1 + (c.votes || 0) + (c.jokers || 0);
      c.weight = w;
      total += w;
      out.push(c);
    }
    for (i = 0; i < out.length; i++) out[i].odds = total > 0 ? out[i].weight / total : 0;
    return out;
  }

  function buildWheel(list, majority){
    drawn = list.slice();
    var maj = majority || {};
    if (!drawn.length) {
      wheel.style.background = 'radial-gradient(circle, #1d1731, #120e1e)';
      wheel.innerHTML = '';
      return;
    }
    var stops = [], labels = [], acc = 0, i;
    var colors = sliceColors(drawn.length);
    for (i = 0; i < drawn.length; i++) {
      var c = drawn[i];
      var start = acc * 360;
      acc += (c.odds || 0);
      var end = acc * 360;
      var span = end - start;
      var tone = rgba(colors[i], 0.9);
      stops.push('rgba(244,239,232,.24) ' + start.toFixed(3) + 'deg ' + (start + 0.4).toFixed(3) + 'deg');
      stops.push(tone + ' ' + (start + 0.4).toFixed(3) + 'deg ' + end.toFixed(3) + 'deg');
      if (span < 6) continue;

      var full = span >= 359;
      var mid = full ? 0 : (start + end) / 2;
      var title = String(c.title || '');
      if (title.length > 14) title = title.slice(0, 13) + '…';
      var flip = mid > 180;
      labels.push('<div class="lab" style="transform:rotate(' + mid.toFixed(3) +
        'deg) translateY(-218px) rotate(' + (flip ? '90' : '-90') + 'deg)">' +
        '<span>' + esc(c.emoji || '') + '</span>' +
        '<span>' + esc(title) + '</span>' +
        (c.votes ? '<span class="o">' + c.votes + '&#128499;&#65039;</span>' : '') +
        (c.jokers ? '<span class="o j">' + c.jokers + '&#127183;</span>' : '') +
        '<span class="o">' + (maj.locked && full ? 'LOCKED' : pct(c.odds)) + '</span></div>');
    }
    wheel.style.background = 'conic-gradient(from 0deg, ' + stops.join(', ') + ')';
    wheel.innerHTML = labels.join('');
  }

  /**
   * Land the winner's slice under the needle at 12 o'clock.
   *   slice centre (clockwise from top) = 360 * (cumulative odds before it + own odds / 2)
   *   final rotation R must satisfy (centre + R) = 0 (mod 360), plus whole extra turns.
   * The landing point is nudged inside the slice by the server's own roll, so the stop
   * position is deterministic and always strictly within the winning wedge.
   */
  /**
   * Where inside the winning wedge the needle rests is pure theatre — the winner was
   * chosen on the server before the wheel ever moved. More often than not it hugs a
   * divider, so the room reads barely-in or nearly-lost from a result that was never in
   * doubt. Derived from the server's own roll, so every screen rests on the same degree.
   */
  function landingAngle(list, winnerId, roll){
    var acc = 0, i;
    for (i = 0; i < list.length; i++) {
      var o = list[i].odds || 0;
      if (list[i].film_id === winnerId) {
        var span = o * 360;
        var start = acc * 360;
        var r = roll == null ? 0.5 : roll;
        var pick = (r * 977) % 1;   /* decorrelated coin: which kind of landing */
        var frac = (r * 131) % 1;   /* and where exactly within that kind */
        var off;
        if (pick < 0.35) off = span * 0.02 + frac * span * 0.10;         /* just over the line in */
        else if (pick < 0.7) off = span * 0.88 + frac * span * 0.10;     /* almost rolled on */
        else off = span * (0.25 + frac * 0.5);                           /* clean middle */
        /* Never visually ON a divider, whatever the slice width. */
        var margin = Math.max(span * 0.02, 1.2);
        if (off < margin) off = margin;
        if (off > span - margin) off = span - margin;
        return start + off;
      }
      acc += o;
    }
    return null;
  }

  /**
   * The choreographed spin: one continuous ride narration whose measured length IS the
   * wheel's duration, so the wheel turns for exactly as long as the announcer speaks and
   * stops on his "...and tonight's winner is" — at which instant the sting fires, the
   * winner's name call plays, and the reveal lands. Muted or offline, the wheel simply
   * spins on its own randomized clock, same as ever.
   */
  function runSpinAnimation(spin, voters){
    var res = spin && spin.result;
    if (!res || !res.candidates || !res.candidates.length) return;
    stopMusic(false);
    spinning = true;
    stage.classList.add('busy');
    spinBtn.disabled = true;

    buildWheel(res.candidates, res.majority);
    var land = landingAngle(res.candidates, res.winner_film_id, res.roll);
    if (land == null) { spinning = false; spinBtn.disabled = false; return; }

    if (REDUCED) {
      var delta0 = ((((-land) % 360 + 360) % 360 - (rotation % 360)) % 360 + 360) % 360;
      wheel.style.transition = 'none';
      wheel.style.transform = 'rotate(' + (rotation + delta0) + 'deg)';
      rotation = rotation + delta0;
      showReveal(res, voters);
      return;
    }

    prepareCeremonyAudio(res, function(clip, stopMs){
      /* One continuous clip; the wheel stops where the name begins inside it. No clip,
         no problem: the old randomized nine-ish seconds, silent. */
      var ms = stopMs || Math.round(SPIN_MS * (0.8 + Math.random() * 0.55));
      var TURNS = Math.max(7, Math.round(10 * ms / SPIN_MS));
      var target = ((-land) % 360 + 360) % 360;
      var delta = ((target - (rotation % 360)) % 360 + 360) % 360;
      var end = rotation + TURNS * 360 + delta;

      if (clip) playClip(clip);
      scheduleTicks(ms, end - rotation, res.candidates.length);

      /* The first control point sits high and early, so most of the rotation is spent in
         the first couple of seconds; the tail is a crawl that keeps looking like it has
         stopped and then moves again — right up to the words. */
      wheel.style.transition = 'transform ' + (ms / 1000) + 's cubic-bezier(.03,.72,.28,1)';
      wheel.style.transform = 'rotate(' + end.toFixed(3) + 'deg)';
      rotation = end;
      setTimeout(function(){
        sting();
        showReveal(res, voters);
      }, ms + REVEAL_GAP_MS);
    });
  }

  /**
   * Fetch the winner's one-clip ceremony — cache-warm since the seal, so normally
   * instant; the wheel never waits more than two seconds. The stop point is the full
   * clip's length minus the measured length of its own name-call tail: the wheel halts
   * exactly as the announcer reaches the name, inside one continuous track.
   */
  function prepareCeremonyAudio(res, cb){
    if (MUTED) { cb(null, null); return; }
    audioCtx();
    var winner = null, i;
    for (i = 0; i < res.candidates.length; i++) {
      if (res.candidates[i].film_id === res.winner_film_id) winner = res.candidates[i];
    }
    var maj = res.majority || {};
    var called = false;
    var fire = function(clip, stop){
      if (called) return;
      called = true;
      spinBtn.textContent = lobbyRolls ? SECOND_LABEL : FIRST_LABEL;
      cb(clip, stop);
    };
    if (!winner) { fire(null, null); return; }

    /* Prewarmed since the seal: the show starts with no network at all. */
    var warm = ceremonyCache[winner.film_id];
    if (warm && warm.stop_ms) {
      fire(warm.audio, Math.round(Math.max(4500, Math.min(22000, warm.stop_ms))));
      return;
    }

    /* Not warmed (spun seconds after the seal, or a chat-triggered roll): the voice is
       worth a short wait — the button says so — but never more than eight seconds. */
    spinBtn.textContent = '🎙 cueing the announcer...';
    setTimeout(function(){ fire(null, null); }, 8000);

    fetch(API + 'ceremony?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: ceremonyBody(winner, !!maj.locked)
    })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.url) { fire(null, null); return; }
        var full = new Audio(j.url);
        full.preload = 'auto';
        if (j.stop_ms) {
          /* The server measured where the name begins inside the spliced clip. */
          fire(full, Math.round(Math.max(4500, Math.min(22000, j.stop_ms))));
          return;
        }
        /* Fallback clip has no name section: the wheel stops when the words run out. */
        full.addEventListener('loadedmetadata', function(){
          fire(full, Math.round(Math.max(4500, Math.min(22000,
            full.duration * 1000 + 200))));
        });
        full.addEventListener('error', function(){ fire(null, null); });
      })
      .catch(function(){ fire(null, null); });
  }

  /* ---------------- the announcer + sfx ----------------
     The whole soundtrack is optional garnish: every play() failure is swallowed, so a
     browser that hasn't been touched yet (autoplay rules) just runs a silent ceremony. */
  var AUDIO_BASE = 'https://psomtujaikgcvblklzgv.supabase.co/storage/v1/object/public/audio/';
  var CLIP_COUNTS = { tminus10: 3, tminus2: 3 };
  var UNDERDOG_ODDS = 0.08;
  var MUTED = false;
  try { MUTED = localStorage.getItem('den-muted') === '1'; } catch (e) {}
  var actx = null;

  function audioCtx(){
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(function(){});
    return actx;
  }
  function playClip(a){
    if (MUTED || !a) return;
    a.play().catch(function(){});
  }
  function randomClip(group){
    var n = 1 + Math.floor(Math.random() * CLIP_COUNTS[group]);
    var a = new Audio(AUDIO_BASE + group + '-' + n + '.wav');
    a.preload = 'auto';
    return a;
  }

  /* ---------------- lobby music ----------------
     Real lounge jazz — Kevin MacLeod (incompetech.com), CC-BY, four tracks in the audio
     bucket, shuffled, at a fraction of the announcer's level. Plays while the room waits,
     ducks out for the ceremony, and never returns once the night has rolled. The credit
     line by the mute pill is part of the license. */
  var MUSIC_TRACKS = 4;
  var MUSIC_VOL = 0.24;
  var music = null;
  var lastNightStatus = '';

  function fadeAudio(a, to, ms, done){
    var from = a.volume;
    var t0 = Date.now();
    var iv = setInterval(function(){
      var k = Math.min(1, (Date.now() - t0) / ms);
      try { a.volume = from + (to - from) * k; } catch (e) {}
      if (k === 1) { clearInterval(iv); if (done) done(); }
    }, 60);
  }

  function startMusic(){
    if (music || MUTED) return;
    var order = [];
    for (var i = 1; i <= MUSIC_TRACKS; i++) order.push(i);
    order.sort(function(){ return Math.random() - 0.5; });
    music = { audio: null, order: order, idx: 0 };
    (function nextTrack(){
      if (!music) return;
      var n = music.order[music.idx % music.order.length];
      music.idx++;
      var a = new Audio(AUDIO_BASE + 'lobby-' + n + '.mp3');
      a.volume = 0;
      music.audio = a;
      a.addEventListener('ended', function(){ if (music) setTimeout(nextTrack, 1500); });
      a.play()
        .then(function(){ fadeAudio(a, MUSIC_VOL, 3000); })
        .catch(function(){ music = null; /* not unlocked yet — a later click retries */ });
    })();
  }

  function stopMusic(gentle){
    if (!music) return;
    var m = music;
    music = null;
    var a = m.audio;
    if (!a) return;
    fadeAudio(a, 0, gentle ? 1400 : 250, function(){
      try { a.pause(); a.src = ''; } catch (e) {}
    });
  }

  function musicWanted(){
    return !MUTED && !spinning &&
      lastNightStatus !== 'spun' && lastNightStatus !== '' &&
      revealEl.className !== 'on' &&
      document.getElementById('lobby').style.display !== 'none';
  }
  function syncMusic(){
    if (musicWanted()) startMusic();
    else stopMusic(true);
  }

  /* The same curve the wheel animates with, solved for progress at a moment in time. */
  function easeAt(x){
    var p1x = 0.03, p1y = 0.72, p2x = 0.28, p2y = 1;
    var t = x;
    for (var i = 0; i < 6; i++) {
      var cx = 3 * p1x * t * (1 - t) * (1 - t) + 3 * p2x * t * t * (1 - t) + t * t * t - x;
      var dx = 3 * p1x * (1 - 4 * t + 3 * t * t) + 3 * p2x * (2 * t - 3 * t * t) + 3 * t * t;
      if (Math.abs(dx) < 1e-6) break;
      t -= cx / dx;
      if (t < 0) t = 0; else if (t > 1) t = 1;
    }
    return 3 * p1y * t * (1 - t) * (1 - t) + 3 * p2y * t * t * (1 - t) + t * t * t;
  }

  /* One soft tick per divider the needle passes, on the wheel's own deceleration. */
  function scheduleTicks(ms, totalDeg, slices){
    var ac = audioCtx();
    if (!ac || MUTED || !slices) return;
    var per = 360 / slices;
    var t0 = ac.currentTime + 0.05;
    var crossed = per;
    for (var step = 1; step <= 400; step++) {
      var deg = easeAt(step / 400) * totalDeg;
      while (deg >= crossed && crossed <= totalDeg) {
        var at = t0 + (step / 400) * (ms / 1000);
        var osc = ac.createOscillator();
        var g = ac.createGain();
        osc.type = 'square';
        osc.frequency.value = 1700 + Math.random() * 300;
        g.gain.setValueAtTime(0.05, at);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.03);
        osc.connect(g); g.connect(ac.destination);
        osc.start(at); osc.stop(at + 0.04);
        crossed += per;
      }
    }
  }

  /* Three rising notes under the reveal — the announcer carries the rest. */
  function sting(){
    var ac = audioCtx();
    if (!ac || MUTED) return;
    var notes = [523.25, 659.25, 783.99];
    for (var i = 0; i < notes.length; i++) {
      var at = ac.currentTime + i * 0.09;
      var osc = ac.createOscillator();
      var g = ac.createGain();
      osc.type = 'triangle';
      osc.frequency.value = notes[i];
      g.gain.setValueAtTime(0.12, at);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.7);
      osc.connect(g); g.connect(ac.destination);
      osc.start(at); osc.stop(at + 0.75);
    }
  }

  /* Two films are a double bill; the room can keep going. */
  function billName(count){
    if (count <= 2) return 'A double bill';
    if (count === 3) return 'A triple bill';
    if (count === 4) return 'A quadruple bill';
    return count + ' films tonight';
  }

  /* ------------------------------------------------ reveal + confetti */
  function showReveal(res, voters, quiet){
    var cands = (res && res.candidates) || [];
    var maj = (res && res.majority) || {};
    var winner = null, i;
    for (i = 0; i < cands.length; i++) {
      if (cands[i].film_id === res.winner_film_id) winner = cands[i];
    }
    if (!winner) { spinning = false; return; }

    var backers = (voters || []).filter(function(p){ return p.for_winner; });
    var others = (voters || []).length - backers.length;

    var tally = '';
    if ((voters || []).length) {
      tally = '<div class="voted"><span class="eyebrow">' +
        (maj.locked ? 'The majority' : backers.length ? 'Who voted for it' : 'The vote') +
        '</span><div class="votedrow">' +
        (backers.length
          ? backers.map(function(p){
              return '<span class="chip">' + avatar(p) + esc(p.name) + '</span>';
            }).join('')
          : '<span class="chip" style="opacity:.6">No votes for this one</span>') +
        '</div>' +
        (backers.length && others
          ? '<div class="hint" style="margin-top:14px">' + others + ' voted elsewhere.</div>'
          : '') +
        '</div>';
    }

    /* A locked win was decided by the room, so it is quoted as a majority, not as odds. */
    var line = maj.locked
      ? 'locked by majority &middot; ' + (winner.votes || 0) + ' of ' + (maj.attendee_basis || 0)
      : pct(winner.odds) + ' odds';

    /* The bill so far. A second roll makes this a double feature. */
    var bill = features.filter(function(f){ return f.film_id !== winner.film_id; });
    var second = (res.round === 2) || bill.length > 0;
    /* The bill grows sideways: each extra feature earns the art block more room. */
    var art = second && bill.length
      ? '<div class="art double" style="width:' +
        Math.min(400 + 180 * bill.length, 940) + 'px">' + bill.map(function(f){
          return poster(f.title, f.poster);
        }).join('') + poster(winner.title, winner.poster) + '</div>'
      : '<div class="art">' + poster(winner.title, winner.poster) + '</div>';

    var firstLine = '';
    if (second && bill.length) {
      firstLine = '<div class="first">First feature: <b>' + esc(bill[0].title) + '</b>' +
        (bill[0].year ? ' (' + esc(bill[0].year) + ')' : '') +
        ' &middot; ' + esc(bill[0].member) + '</div>';
    }

    var again = '';
    if (IS_HOST && canRollAgain && !second) {
      again = '<button id="again">' + SECOND_LABEL + '</button>';
    }

    revealEl.innerHTML =
      '<button id="revClose">Back to The Lobby</button>' + art +
      '<div class="meta">' +
      '<div class="kicker">' +
        (second
          ? billName(bill.length + 1)
          : maj.locked ? 'The room locked it in' : 'Tonight you are watching') +
        '</div>' +
      '<h1>' + esc(winner.title) +
        (winner.year ? ' <span class="yr">(' + esc(winner.year) + ')</span>' : '') + '</h1>' +
      '<div class="by">' + avatar(winner) + 'suggested by ' + esc(winner.member) +
        '<span style="color:var(--muted);font-weight:600"> &middot; ' + line + '</span></div>' +
      firstLine + tally +
      /* Where to press play, right under the verdict. Filled late if the shelf is still
         loading when the ceremony ends. */
      '<div id="revwatch">' +
      (dossiers[winner.film_id]
        ? watchBlock(dossiers[winner.film_id].watch_providers, winner.title) : '') +
      '</div>' + again + '</div>';
    revealEl.className = 'on';
    lastReveal = { res: res, voters: voters };
    var againBtn = document.getElementById('again');
    if (againBtn) againBtn.addEventListener('click', rollAgain);
    var closeBtn = document.getElementById('revClose');
    if (closeBtn) closeBtn.addEventListener('click', hideReveal);
    syncPicksLink();
    var head = revealEl.querySelector('h1');
    var len = head.textContent.length;
    head.style.fontSize = (len > 34 ? 52 : len > 26 ? 60 : len > 18 ? 68 : 84) + 'px';
    if (!REDUCED && !quiet) confetti(winner.color);
    spinning = false;
    stage.classList.remove('busy');
  }

  /* The reveal can be dismissed and reopened — nobody should be stranded on it. */
  function hideReveal(){
    revealEl.className = '';
    syncPicksLink();
  }

  function reopenReveal(){
    if (!lastReveal) return;
    showReveal(lastReveal.res, lastReveal.voters, true);
  }

  /* The way back in, only offered when there is something to go back to. */
  function syncPicksLink(){
    var want = Boolean(lastReveal) && revealEl.className !== 'on' && !fullScreen() && !spinning;
    var el = document.getElementById('navPicks');
    var cls = 'pillbtn' + (want ? '' : ' hidden');
    if (el.className !== cls) el.className = cls;
  }

  /**
   * The lobby's own copy of the shelf, fetched once and never polled. tv-state carries what
   * the room is doing; the library carries what a film IS — synopsis, ratings, cast — and
   * that does not change from one poll to the next.
   */
  function loadDossiers(){
    if (dossiersAsked) return;
    dossiersAsked = true;
    fetch(API + 'tv-library?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var list = (d && d.ok && d.library) ? d.library : [];
        for (var i = 0; i < list.length; i++) dossiers[list[i].film_id] = list[i];
        /* Fill in the panels already on screen. The board itself is not touched. */
        repaintBoard();
        /* A reveal that beat the shelf to the screen gets its watch links now. */
        var rw = document.getElementById('revwatch');
        if (rw && !rw.innerHTML && lastReveal) {
          var res = lastReveal.res || {};
          var cands = res.candidates || [];
          for (var k = 0; k < cands.length; k++) {
            if (cands[k].film_id === res.winner_film_id && dossiers[cands[k].film_id]) {
              rw.innerHTML = watchBlock(dossiers[cands[k].film_id].watch_providers,
                cands[k].title);
            }
          }
        }
      })
      .catch(function(){ dossiersAsked = false; });
  }

  /* Host asked for a second feature: hide the reveal, run the wheel again on what is left.
     One path, two doors — the button on the reveal and the one in the lobby both come here. */
  function rollAgain(){
    rollSecond(document.getElementById('again'), SECOND_LABEL);
  }

  function rollSecond(btn, label){
    if (spinning) return;
    /* The hint line only ever carries a server refusal; a fresh attempt starts clean. */
    document.getElementById('hint').textContent = '';
    if (btn) { btn.disabled = true; btn.textContent = 'Rolling...'; }
    spinning = true;
    fetch(spinUrl(), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ again: true })
    })
      .then(function(r){ return r.json(); })
      .then(function(j){
        spinning = false;
        if (!j || !j.ok || !j.spin) {
          if (btn) { btn.disabled = false; btn.textContent = label; }
          if (j && j.message) {
            document.getElementById('hint').textContent = j.message;
          }
          return;
        }
        if (shownSpins[j.spin.id]) return;
        shownSpins[j.spin.id] = true;
        revealEl.className = '';
        syncPicksLink();
        runSpinAnimation(j.spin, j.votes);
      })
      .catch(function(){
        spinning = false;
        if (btn) { btn.disabled = false; btn.textContent = label; }
      });
  }

  var parts = [];
  var raf = null;
  /* Two cannons at the bottom corners, firing inward across the frame. */
  function confetti(accent){
    var colors = [safeColor(accent), '#f5b942', '#f4efe8', '#8e57db', '#57d0db'];
    var cannons = [{ x: 130, dir: 1 }, { x: 1790, dir: -1 }];
    parts = [];
    for (var c = 0; c < cannons.length; c++) {
      for (var i = 0; i < 105; i++) {
        parts.push({
          x: cannons[c].x + (Math.random() - 0.5) * 90,
          y: 1070,
          vx: cannons[c].dir * (9 + Math.random() * 26),
          vy: -21 - Math.random() * 22,
          w: 7 + Math.random() * 11,
          h: 10 + Math.random() * 16,
          a: Math.random() * Math.PI * 2,
          va: (Math.random() - 0.5) * 0.3,
          c: colors[(Math.random() * colors.length) | 0],
          life: 165 + Math.random() * 70
        });
      }
    }
    if (raf) cancelAnimationFrame(raf);
    tick();
  }
  function tick(){
    ctx.clearRect(0, 0, 1920, 1080);
    var alive = 0;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.life <= 0) continue;
      alive++;
      p.life--;
      p.vy += 0.42;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.a += p.va;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 60));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive) raf = requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, 1920, 1080);
  }

  /* ------------------------------------------------ lobby rendering
     Every section is gated on a signature of its own data. A poll that brings nothing new
     touches no node at all, so nothing repaints and no image is ever recreated. */

  function section(key, sig, paint){
    if (sigs[key] === sig) return;
    sigs[key] = sig;
    paint();
  }

  /* The scoreboard: fourteen rows, always. Posters and row skeletons are built once per
     line-up; votes, jokers, odds and lock state are written into the rows that already
     exist, so a poll that brings nothing new touches nothing. */
  var SEG_GAP = 3, BAR_CELL = 150, ROW_LEFT = 72 + 12 + 150 + 12, COL_W = 460, COL_GAP = 20;
  var PAGE_SIZE = 6;        /* two columns of three */
  var PAGE_MS = 8000;       /* how long a page holds before the board turns */
  var MANUAL_MS = 30000;    /* how long a hand on the controls stands the timer down */
  var scoreNodes = {};
  var boardPage = 0;        /* which page of the running order is showing */
  var boardPages = 1;
  var pageTimer = null;
  var manualHold = false;   /* somebody is driving the board themselves */
  var manualTimer = null;
  var dotNodes = [];

  /* The running order: best chance first, so page one is always the contenders. Level odds
     are settled by votes, and a dead heat by title, so the order never jitters. */
  function rankEntries(entries){
    return entries.slice().sort(function(a, b){
      var d = (b.odds || 0) - (a.odds || 0);
      if (d) return d > 0 ? 1 : -1;
      d = (b.votes || 0) - (a.votes || 0);
      if (d) return d > 0 ? 1 : -1;
      return String(a.title || '').localeCompare(String(b.title || ''));
    });
  }
  function pageCountOf(n){ return Math.max(1, Math.ceil(n / PAGE_SIZE)); }
  /* Always six slots: a short last page keeps its shape with empty rows. */
  function pageSlice(sorted, page){
    var out = [];
    for (var i = 0; i < PAGE_SIZE; i++) out.push(sorted[page * PAGE_SIZE + i] || null);
    return out;
  }

  /* Numbers read as numbers on the bar; in a sentence they read as words. */
  var COUNT_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight',
    'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen'];
  function countWord(n){
    return COUNT_WORDS[n] === undefined ? String(n) : COUNT_WORDS[n];
  }
  function nameList(names){
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + ' and ' + names[1];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }
  /* "Three votes &middot; Kit and Asher played a joker on it" */
  function dossierWho(c, voting){
    var votes = voting ? (c.votes || 0) : 0;
    var line = votes === 0
      ? 'No votes yet'
      : countWord(votes).charAt(0).toUpperCase() + countWord(votes).slice(1) +
        (votes === 1 ? ' vote' : ' votes');
    var players = (c.joker_players || []).map(function(j){ return j.name; });
    if (players.length) {
      line += ' &middot; ' + esc(nameList(players)) +
        (players.length === 1 ? ' played a joker on it' : ' played jokers on it');
    }
    return line;
  }

  function slotCount(threshold, entries){
    var most = 0;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i]) most = Math.max(most, entries[i].votes || 0);
    }
    /* Room to see the finish line, plus whatever runs past it. */
    return Math.max(threshold + 2, most + 1);
  }
  function segWidth(slots){
    return Math.max(6, Math.floor((BAR_CELL - (slots - 1) * SEG_GAP) / slots));
  }

  function buildScoreboard(entries, threshold, slots){
    var el = document.getElementById('scoreboard');
    scoreNodes = {};
    hoverRow = '';
    var segW = segWidth(slots);
    var rows = [];
    for (var i = 0; i < PAGE_SIZE; i++) {
      var c = entries[i];
      var segs = '';
      for (var k = 0; k < slots; k++) {
        segs += '<span class="seg" style="width:' + segW + 'px"></span>';
      }
      /* Only the top row of each column opens its dossier downward; the lower two open
         upward so nothing ever runs off the bottom of a 1080 screen. */
      rows.push('<div class="srow' + (c ? '' : ' free') + (i % 3 !== 0 ? ' up' : '') + '"' +
        (c ? ' data-id="' + esc(c.film_id) + '"' : '') +
        ' style="animation-delay:' + i * 26 + 'ms">' +
        '<div class="th">' + (c ? poster(c.title, c.poster) : '<div class="frame"></div>') + '</div>' +
        '<div class="st"><b>' + (c ? esc(c.title) : 'open slot') + '</b>' +
        '<i>' + (c ? esc(c.emoji) + ' ' + esc(c.member) : 'waiting for a film') + '</i>' +
        '<span class="wontag">&#128081; won tonight</span>' +
        '<div class="jk"></div></div>' +
        '<div class="tb">' + segs + '</div>' +
        '<div class="sp">' + (c ? '' : '&mdash;') + '</div>' +
        (c
          ? '<div class="dossier"><div class="dfacts"></div><p class="dsyn"></p>' +
            '<div class="dstream"></div><div class="dwho"></div>' +
            '<button class="pillbtn dmore" data-dossier="' + esc(c.film_id) + '">' +
            'Full details</button></div>'
          : '') +
        (c && IS_HOST
          ? '<button class="ejx" data-eject="' + esc(c.film_id) + '">&times;</button>' +
            '<div class="ejc"><span class="q">Eject ' + esc(c.title) + '?</span>' +
            '<button class="yes" data-ejectyes="' + esc(c.film_id) + '">eject</button>' +
            '<button data-ejectno="1">keep</button></div>'
          : '') +
        '</div>');
    }
    /* One line per column, at the same offset inside each, so the threshold reads as one
       rule across the whole board. The line sits one segment shy of the count, so the
       deciding vote visibly CROSSES it rather than merely touching it. */
    var x = ROW_LEFT + (threshold - 1) * (segW + SEG_GAP) - SEG_GAP / 2;
    el.innerHTML = rows.join('') +
      '<div class="thline" style="left:' + x.toFixed(1) + 'px"><span>landslide &middot; ' +
      threshold + '</span></div>' +
      '<div class="thline" style="left:' + (COL_W + COL_GAP + x).toFixed(1) + 'px"></div>';

    var list = el.querySelectorAll('.srow');
    for (var j = 0; j < list.length; j++) {
      var id = list[j].getAttribute('data-id');
      if (!id) continue;
      scoreNodes[id] = {
        root: list[j],
        segs: list[j].querySelectorAll('.seg'),
        jk: list[j].querySelector('.jk'),
        pct: list[j].querySelector('.sp'),
        facts: list[j].querySelector('.dfacts'),
        syn: list[j].querySelector('.dsyn'),
        who: list[j].querySelector('.dwho'),
        stream: list[j].querySelector('.dstream'),
        more: list[j].querySelector('.dmore'),
        v: -1, p: '', j: '', cls: '', df: '', ds: '', dw: '', dm: '', dst: ''
      };
    }
  }

  /* Redraw the board and nothing else. Called by the page timer, by a host arming or
     cancelling an eject, and by the poll when the line-up itself has changed. */
  function repaintBoard(){
    var b = lastBoard;
    if (!b) return;
    var rows = pageSlice(b.sorted, boardPage);
    var sig = b.threshold + '#' + b.slots + '#' + boardPage + '#' + rows.map(function(c){
      return c ? c.film_id + ':' + (c.poster || '') : '-';
    }).join('|');
    section('scoreboard', sig, function(){ buildScoreboard(rows, b.threshold, b.slots); });
    paintScoreboard(rows, b.threshold, b.maj, b.voting, b.won || {});
    paintDots();
  }

  function paintDots(){
    var el = document.getElementById('pageDots');
    section('dotcount', String(boardPages), function(){
      var html = '';
      for (var i = 0; i < boardPages; i++) {
        html += '<button class="dot" data-page="' + i + '" aria-label="page ' +
          (i + 1) + '"></button>';
      }
      el.innerHTML = html;
      dotNodes = el.querySelectorAll('.dot');
    });
    for (var k = 0; k < dotNodes.length; k++) {
      var want = k === boardPage ? 'dot on' : 'dot';
      if (dotNodes[k].className !== want) dotNodes[k].className = want;
    }
    /* One page needs no controls. */
    section('pagervis', String(boardPages > 1), function(){
      document.getElementById('pager').style.display = boardPages > 1 ? '' : 'none';
    });
