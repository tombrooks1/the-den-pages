  }

  /* A hand on the arrows or the dots wins: the board goes where it is told and the timer
     stands down for half a minute, then picks up again from wherever it was left. */
  function driveTo(page){
    manualHold = true;
    if (manualTimer) clearTimeout(manualTimer);
    manualTimer = setTimeout(function(){ manualHold = false; }, MANUAL_MS);
    if (boardPages > 1) turnTo(((page % boardPages) + boardPages) % boardPages);
  }

  /* Turn to a page with a short fade. Reduced motion gets the swap with no fade at all. */
  function turnTo(page){
    if (page === boardPage) return;
    boardPage = page;
    var el = document.getElementById('scoreboard');
    if (REDUCED) { repaintBoard(); return; }
    el.className = 'scoreboard turning';
    setTimeout(function(){
      repaintBoard();
      el.className = 'scoreboard';
    }, 180);
  }

  /* One page at a time, on the board's own clock — never on the poll's. A host reading an
     eject confirm holds the page still until they answer it. */
  function startPageCycle(){
    if (pageTimer) return;
    pageTimer = setInterval(function(){
      if (boardPages < 2 || ejectArmed || spinning || manualHold || hoverRow) return;
      /* Nobody is looking at the board during the ceremony or on another screen. */
      if (document.getElementById('lobby').style.display === 'none') return;
      turnTo((boardPage + 1) % boardPages);
    }, PAGE_MS);
  }

  function paintScoreboard(entries, threshold, maj, voting, won){
    for (var i = 0; i < entries.length; i++) {
      var c = entries[i];
      if (!c) continue;
      var node = scoreNodes[c.film_id];
      if (!node) continue;

      var isLock = !!(maj.locked && maj.leading === c.film_id);
      /* A film that has already won keeps its row, so the picture of the night stays whole,
         but it wears a crown so nobody reads it as still in the running. */
      /* The positional 'up' must survive every repaint, or bottom dossiers clip again. */
      var cls = 'srow' + (i % 3 !== 0 ? ' up' : '') +
        (won[c.film_id] ? ' won' : '') + (isLock ? ' lock' : '') +
        (maj.leading === c.film_id ? ' lead' : '') + (ejectArmed === c.film_id ? ' arm' : '');
      if (node.cls !== cls) { node.cls = cls; node.root.className = cls; }

      /* Segments are human votes and nothing else — the bar is the lock rule made visible. */
      var votes = voting ? (c.votes || 0) : 0;
      if (node.v !== votes) {
        node.v = votes;
        for (var k = 0; k < node.segs.length; k++) {
          var want = k < votes ? (k >= threshold - 1 ? 'seg on over' : 'seg on') : 'seg';
          if (node.segs[k].className !== want) node.segs[k].className = want;
        }
      }

      /* Jokers sit beside the bar, named, and never inside it. */
      var players = (c.joker_players || []).map(function(j){ return j.emoji + j.name; }).join('|');
      if (node.j !== players) {
        node.j = players;
        node.jk.innerHTML = (c.joker_players || []).map(function(j){
          return '<span>&#127183; ' + esc(j.name) + '</span>';
        }).join('');
      }

      var pct = isLock ? 'LOCK' : Math.round((c.odds || 0) * 100) + '%';
      if (node.p !== pct) { node.p = pct; node.pct.textContent = pct; }

      /* The hover panel. Its facts arrive with the library, which lands once and late, so
         everything here is written only when the text itself has changed. */
      var d = dossiers[c.film_id];
      var facts = '';
      if (d) {
        if (d.imdb_rating) {
          facts += '<span class="star">&#11088; ' + esc(d.imdb_rating) + ' imdb</span>';
        }
        if (d.avg_paws != null) {
          facts += '<span class="star">&#128062; ' +
            (Math.round(d.avg_paws * 10) / 10).toFixed(1) + ' from ' + (d.rating_count || 0) +
            '</span>';
        }
        if (d.runtime) facts += '<span>' + esc(d.runtime) + '</span>';
        var gs = (d.genres || []).slice(0, 2);
        for (var g = 0; g < gs.length; g++) facts += '<span>' + esc(gs[g]) + '</span>';
      }
      if (node.df !== facts) { node.df = facts; node.facts.innerHTML = facts; }

      var syn = d && d.synopsis
        ? d.synopsis
        : (d ? 'No synopsis on file for this one.' : 'Looking this one up...');
      if (node.ds !== syn) { node.ds = syn; node.syn.textContent = syn; }

      var stream = d ? streamLine(d.watch_providers) : '';
      if (node.dst !== stream) { node.dst = stream; node.stream.innerHTML = stream; }

      var who = dossierWho(c, voting);
      if (node.dw !== who) { node.dw = who; node.who.innerHTML = who; }

      /* Nothing to open until the shelf has answered. */
      var more = d ? '' : 'none';
      if (node.dm !== more) { node.dm = more; node.more.style.display = more; }
    }
  }

  function renderLobby(state){
    var n = state.night;
    var maj = state.majority || {};
    var locked = !!(maj.locked && n && n.status === 'locked');
    /* A different night means different clips: the warm cache belongs to one ceremony. */
    if ((n ? n.id : '') !== lastNightId) {
      ceremonyCache = {};
      prewarmed = false;
      ceremonyReady = false;
    }
    lastNightId = n ? n.id : '';

    var label = n ? n.label : 'No night scheduled';
    lastNightStatus = n ? String(n.status || '') : '';
    lastVotingClosed = !!(n && n.voting_closed);
    /* Sealed — by the clock or by the host's hand — means the ceremony can be prepared. */
    if (lastVotingClosed && lastNightStatus === 'locked') prewarmCeremony();
    paintCeremonyState();
    var when = (n && n.date_label) ? n.date_label : '';
    var theme = n && n.theme ? n.theme : '';
    var notes = (n && n.notes) ? n.notes : '';

    var starts = (n && n.starts_at) ? Date.parse(n.starts_at) : NaN;
    var nextStarts = isNaN(starts) ? null : starts;

    /* Say each thing once. With no exact time the countdown already carries the date label,
       and a night named after its theme does not need the theme repeated underneath. */
    var same = function(a, b){
      return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
    };
    var whenShown = nextStarts === null ? '' : when;
    var themeShown = (theme && same(theme, label)) ? '' : theme;

    section('head', label + '|' + whenShown + '|' + themeShown + '|' + notes, function(){
      document.getElementById('label').textContent = label;
      document.getElementById('whenline').textContent = whenShown;
      document.getElementById('theme').textContent = themeShown;
      document.getElementById('notes').textContent = notes;
    });
    if (nextStarts !== startsAt || when !== dateLabel) {
      startsAt = nextStarts;
      dateLabel = when;
      lastCount = null;
      tickCountdown();
    }

    var statusHtml = !n
      ? 'waiting for a host to plan the next one'
      : locked
      ? 'Locked by majority &middot; ' + (maj.leading_votes || 0) + ' of ' + (maj.attendee_basis || 0)
      : statusText(n.status);
    section('status', statusHtml + '|' + locked, function(){
      var el = document.getElementById('status');
      el.className = 'status' + (locked ? ' lock' : '');
      el.innerHTML = statusHtml;
    });

    var order = { 'in':0, 'maybe':1, 'out':2 };
    var sorted = (state.rsvps || []).slice().sort(function(a, b){
      return order[a.status] - order[b.status];
    });
    var rollSig = sorted.map(function(r){
      return r.member_id + ':' + r.status + ':' + (r.plus_ones || 0) + ':' + r.name +
        ':' + (r.avatar ? '1' : '0');
    }).join('|') + '#' + (state.headcount || 0);
    section('roll', rollSig, function(){
      var ins = sorted.filter(function(r){ return r.status === 'in'; });
      var maybes = sorted.filter(function(r){ return r.status === 'maybe'; });
      var outs = sorted.filter(function(r){ return r.status === 'out'; });

      /* Fourteen seats, always drawn. Every 'in' takes one and their guest takes the next,
         so the grid is a picture of the room rather than a list of names. */
      var taken = [];
      ins.forEach(function(r){
        taken.push({ who: r, guest: false });
        if (r.plus_ones === 1) taken.push({ who: r, guest: true });
      });
      var seats = [];
      for (var i = 0; i < SEAT_CAP; i++) {
        var t = taken[i];
        if (!t) {
          seats.push('<div class="seat free" style="animation-delay:' + (i * 18) +
            'ms"><span class="dot"></span></div>');
        } else if (t.guest) {
          seats.push('<div class="seat guest" style="animation-delay:' + (i * 18) + 'ms">' +
            avatar(t.who) + '<span class="nm">+1 of ' + esc(t.who.name) + '</span></div>');
        } else {
          seats.push('<div class="seat" data-member="' + t.who.member_id +
            '" style="animation-delay:' + (i * 18) + 'ms">' +
            avatar(t.who) + '<span class="nm">' + esc(t.who.name) + '</span></div>');
        }
      }
      document.getElementById('seatGrid').innerHTML = seats.join('');

      /* Maybes and outs take no seat, so they sit below the picture, clearly apart. */
      var html = '';
      if (maybes.length) {
        html += '<div class="roll"><span class="rtag">maybe</span>' +
          maybes.map(function(r, i){
            return '<span class="chip maybe" data-member="' + r.member_id +
              '" style="animation-delay:' + (i * 60) + 'ms">' +
              avatar(r) + esc(r.name) + (r.plus_ones === 1 ? ' +1' : '') +
              '<span class="q">?</span></span>';
          }).join('') + '</div>';
      }
      if (outs.length) {
        html += '<div class="outline">out &middot; ' + outs.map(function(r){
          return esc(r.emoji) + ' ' + esc(r.name);
        }).join(' &middot; ') + '</div>';
      }
      document.getElementById('rollList').innerHTML = html;
      document.getElementById('rollHeads').textContent =
        (state.headcount || 0) + ' of ' + SEAT_CAP + ' seats';
    });

    /* What people are bringing. Quiet when nobody has said. */
    var spread = state.snacks || [];
    var spreadSig = spread.map(function(s){ return s.name + ':' + s.snack; }).join('|');
    section('snacks', spreadSig, function(){
      document.getElementById('snackList').innerHTML = spread.length
        ? '&#127871; ' + spread.map(function(s){
            return '<b>' + esc(s.snack) + '</b> ' + esc(s.emoji) + ' ' + esc(s.name);
          }).join('<span class="sep">&middot;</span>')
        : '';
    });

    /* Tonight's line-up: one film per person, everything that was entered. */
    var entries = state.entries || [];
    var shown = entries.slice(0, SEAT_CAP);

    /* One section for the whole night: what is in, who brought it, and how the room is
       voting. The bars are skeletons until voting opens. */
    /* Votes stay on the board after the wheel fires — the night is on the record. */
    var voting = !!n && (n.status === 'locked' || n.status === 'spun');
    var threshold = maj.threshold || 4;

    /* Ranked once, here, and paged from there. Everything the board needs to redraw itself
       between polls is kept, so the page timer never has to ask the server. */
    /* Whatever has already played tonight, so the board and the wheel agree on it. */
    wonIds = {};
    for (var w = 0; w < features.length; w++) wonIds[features[w].film_id] = true;

    var sorted = rankEntries(shown);
    boardPages = pageCountOf(sorted.length);
    if (boardPage >= boardPages) boardPage = 0;
    lastBoard = {
      sorted: sorted, threshold: threshold, maj: maj, voting: voting, won: wonIds,
      slots: slotCount(threshold, entries)
    };
    repaintBoard();
    startPageCycle();

    var moreTxt = entries.length > shown.length
      ? '+ ' + (entries.length - shown.length) + ' more entered'
      : '';
    var headsTxt = entries.length + ' of ' + SEAT_CAP + ' entered';
    section('wallmeta', moreTxt + '|' + headsTxt, function(){
      document.getElementById('wallMore').textContent = moreTxt;
      document.getElementById('wallHeads').textContent = headsTxt;
    });

    /* Three states for one button. Before the wheel it spins; between features it rolls the
       second one; once the night is settled there is nothing to press and it goes away. */
    var openForSpin = !!n && (n.status === 'planned' || n.status === 'locked');
    var rollable = !!n && n.status === 'spun' && canRollAgain &&
      remainingRunners(entries, wonIds).length > 0;
    lobbyRolls = rollable && IS_HOST;

    var offered = IS_HOST && (rollable || (openForSpin && entries.length > 0));
    var label = rollable ? SECOND_LABEL : FIRST_LABEL;
    var live = !spinning && (rollable || (openForSpin && entries.length > 0));
    section('spinbtn', String(offered) + '|' + label + '|' + String(live), function(){
      spinBtn.style.display = offered ? '' : 'none';
      spinBtn.textContent = label;
      spinBtn.disabled = !live;
    });
  }

  /* A host can cancel a no-show's film without leaving the wheel screen. */
  function ejectEntry(filmId){
    var night = lastNightId;
    if (!night) return;
    ejectArmed = '';
    fetch(API + 'admin/act', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key: KEY, host: HOSTKEY, action: 'eject',
        night_id: night, film_id: filmId })
    })
      .then(function(r){ return r.json(); })
      .then(function(){ poll(); })
      .catch(function(){ poll(); });
  }

  document.getElementById('pager').addEventListener('click', function(e){
    var el = e.target.closest('[data-page]');
    if (!el) return;
    var where = el.getAttribute('data-page');
    if (where === 'prev') driveTo(boardPage - 1);
    else if (where === 'next') driveTo(boardPage + 1);
    else driveTo(Number(where));
  });

  /* Knowing which row is under the pointer is a variable, not a repaint — the panel itself
     opens in CSS. The board will not turn the page out from under a reader. */
  document.getElementById('scoreboard').addEventListener('mouseover', function(e){
    var row = e.target.closest ? e.target.closest('.srow') : null;
    if (row) hoverRow = row.getAttribute('data-id') || 'row';
  });
  document.getElementById('scoreboard').addEventListener('mouseout', function(e){
    var to = e.relatedTarget;
    var still = to && to.closest ? to.closest('.srow') : null;
    if (!still) hoverRow = '';
  });

  document.getElementById('scoreboard').addEventListener('click', function(e){
    /* The same centred modal the library opens, from the same data. */
    var det = e.target.closest('[data-dossier]');
    if (det) { openModal(det.getAttribute('data-dossier')); return; }
    var el = e.target.closest('[data-eject], [data-ejectyes], [data-ejectno]');
    if (!el || !IS_HOST) return;
    if (el.getAttribute('data-ejectno')) { ejectArmed = ''; repaintBoard(); return; }
    var yes = el.getAttribute('data-ejectyes');
    if (yes) { ejectEntry(yes); repaintBoard(); return; }
    ejectArmed = el.getAttribute('data-eject');
    repaintBoard();
  });

  /* ------------------------------------------------ the countdown
     The only thing on this page that moves without a poll. It writes one element, and only
     when the rendered text actually changes, so the lobby's zero-repaint rule still holds. */
  var startsAt;            /* the current night's exact time, if it has one */
  var dateLabel;           /* what to show when it does not */
  var lastCount = null;

  function countdownText(){
    if (!startsAt) return dateLabel ? esc(dateLabel) : '';
    var ms = startsAt - Date.now();
    if (ms <= 0) return 'tonight';
    var total = Math.floor(ms / 1000);
    var days = Math.floor(total / 86400);
    var hours = Math.floor((total % 86400) / 3600);
    var mins = Math.floor((total % 3600) / 60);
    var secs = total % 60;
    var two = function(n){ return (n < 10 ? '0' : '') + n; };
    var unit = function(n, u){ return n + '<span class="u">' + u + '</span>'; };
    /* The clock always runs to the second — the wait should feel like a countdown. */
    var clock = (days > 0 || hours > 0 ? two(hours) + ':' : '') + two(mins) + ':' + two(secs);
    return (days > 0 ? unit(days, days === 1 ? 'day' : 'days') : '') + clock;
  }

  /* ---------------- the announcer's house calls ----------------
     Crossing ten minutes out: refreshments. Crossing two: seats and silenced phones. Each
     fires once per night (the crossing is the trigger, so a page opened late only gets the
     calls still ahead of it), the jazz ducks under the voice and swells back after. */
  var lastMsToGo = null;
  var prewarmed = false;
  var TMINUS = [
    { at: 30 * 60000, kind: 'votecall' },
    { at: 10 * 60000, kind: 'clip', group: 'tminus10', prewarm: true },
    { at: 2 * 60000, kind: 'clip', group: 'tminus2' }
  ];

  /* Ballots seal at ten minutes out, so every clip the ceremony could need can be made
     ahead of time: the ride, and a name call for every film still on the wheel. All
     cached server-side — a page opened late warms the same cache in one round. */
  var ceremonyReady = false;
  var lastVotingClosed = false;

  function ceremonyBody(c, locked){
    return JSON.stringify({
      title: c.title,
      name: c.member,
      underdog: !locked && (c.odds || 0) < UNDERDOG_ODDS,
      locked: locked
    });
  }

  /* Prewarmed ceremonies, by film id: the response AND a preloaded Audio, so the spin
     needs zero network to start the show. */
  var ceremonyCache = {};

  function prewarmCeremony(){
    if (prewarmed) return;
    prewarmed = true;
    paintCeremonyState();
    var locked = !!(lastBoard && lastBoard.maj && lastBoard.maj.locked);
    var jobs = [];
    var entries = (lastBoard && lastBoard.sorted) || [];
    entries.forEach(function(c){
      if (!c) return;
      jobs.push(fetch(API + 'ceremony?key=' + encodeURIComponent(KEY), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: ceremonyBody(c, locked)
      })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (j && j.url) {
            var a = new Audio(j.url);
            a.preload = 'auto';
            ceremonyCache[c.film_id] = { url: j.url, stop_ms: j.stop_ms || null, audio: a };
          }
        })
        .catch(function(){}));
    });
    Promise.all(jobs).then(function(){
      ceremonyReady = true;
      paintCeremonyState();
    });
  }

  /* The little truth line by the spin button: sealing offered to the host while voting
     is open, quiet progress while the clips generate, «ready to spin» when they're in. */
  function paintCeremonyState(){
    var seal = document.getElementById('sealBtn');
    var label = document.getElementById('readyLabel');
    var live = lastNightStatus === 'locked';
    seal.style.display =
      IS_HOST && live && !lastVotingClosed && !spinning ? '' : 'none';
    label.textContent = !live || spinning
      ? ''
      : ceremonyReady
      ? 'ready to spin'
      : lastVotingClosed || prewarmed
      ? 'preparing the ceremony...'
      : '';
  }

  function checkTminus(ms){
    if (ms == null ||
        (lastNightStatus !== 'planned' && lastNightStatus !== 'locked')) {
      lastMsToGo = ms;
      return;
    }
    /* A page opened inside the ten-minute window still warms the ceremony cache. */
    if (ms > 0 && ms <= 10 * 60000 && lastNightStatus === 'locked') prewarmCeremony();
    if (MUTED) { lastMsToGo = ms; return; }
    for (var i = 0; i < TMINUS.length; i++) {
      var t = TMINUS[i];
      if (lastMsToGo !== null && lastMsToGo > t.at && ms <= t.at && ms > 0) {
        var guard = 'den-tminus-' + t.at + '-' + startsAt;
        var seen = false;
        try {
          seen = !!localStorage.getItem(guard);
          localStorage.setItem(guard, '1');
        } catch (e) {}
        if (seen) continue;
        if (t.kind === 'votecall') {
          fetch(API + 'votecall?key=' + encodeURIComponent(KEY), { method: 'POST' })
            .then(function(r){ return r.json(); })
            .then(function(j){
              if (j && j.url) {
                var a = new Audio(j.url);
                a.preload = 'auto';
                duckThenPlay(a);
              }
            })
            .catch(function(){});
        } else {
          duckThenPlay(randomClip(t.group));
        }
      }
    }
    lastMsToGo = ms;
  }
  function duckThenPlay(clip){
    var restore = function(){
      if (music && music.audio) fadeAudio(music.audio, MUSIC_VOL, 1400);
    };
    if (music && music.audio) fadeAudio(music.audio, 0.07, 600);
    clip.addEventListener('ended', restore);
    clip.addEventListener('error', restore);
    playClip(clip);
  }

  function tickCountdown(){
    checkTminus(startsAt ? startsAt - Date.now() : null);
    var txt = countdownText();
    if (txt === lastCount) return;
    lastCount = txt;
    document.getElementById('countdown').innerHTML = txt;
  }
  setInterval(tickCountdown, 1000);

  /* ------------------------------------------------ attention cycle */
  var spots = ['hdr', 'roll', 'wall'];
  var spotAt = 0;
  setInterval(function(){
    if (spinning || revealEl.className === 'on' || fullScreen()) return;
    spotAt = (spotAt + 1) % spots.length;
    spots.forEach(function(id, i){
      var want = 'panel' + (i === spotAt ? ' spot' : '');
      var el = document.getElementById(id);
      if (el.className !== want) el.className = want;
    });
  }, 6000);

  /* ------------------------------------------------ history & stats board */
  function boardOn(){ return location.hash === '#stats'; }
  function libOn(){ return location.hash === '#library'; }
  function fullScreen(){ return boardOn() || libOn() || adminOn(); }

  /* ------------------------------------------------ the host admin panel */
  var admData = null;      /* last /api/admin/state payload */
  var admBusy = '';        /* the one action currently in flight */
  var admError = '';       /* plain inline message, never an alert */
  var admOpen = '';        /* night whose line-up is expanded */
  var admForm = { title: '', theme: '', own: '', notes: '', starts: '' };
  var admEdit = '';        /* night being edited, '' while creating */
  var admBase = null;      /* the form as it was loaded, so we can send only what moved */

  function blankForm(){
    return { title: '', theme: '', own: '', notes: '', starts: '' };
  }

  /* datetime-local speaks the viewer's local clock; the API speaks ISO. */
  function toLocalInput(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocalInput(v){
    if (!v) return null;
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d.toISOString();
  }
  /* '__own' is the free-text option; anything else in the select is the theme itself. */
  function effectiveTheme(f){
    return f.theme === '__own' ? f.own.trim() : f.theme;
  }

  function startEdit(n){
    var ideas = (admData && Array.isArray(admData.theme_ideas)) ? admData.theme_ideas : [];
    var known = ideas.some(function(t){ return t.text === n.theme; });
    admEdit = n.id;
    admForm = {
      title: n.title || '',
      theme: n.theme ? (known ? n.theme : '__own') : '',
      own: (n.theme && !known) ? n.theme : '',
      notes: n.notes || '',
      starts: toLocalInput(n.starts_at)
    };
    admBase = { title: admForm.title, theme: effectiveTheme(admForm),
      notes: admForm.notes, starts: admForm.starts };
    admError = '';
  }

  function adminOn(){ return location.hash === '#admin'; }

  function admQs(){
    return '?key=' + encodeURIComponent(KEY) + '&host=' + encodeURIComponent(HOSTKEY);
  }

  function statusChip(status){
    var cls = status === 'spun' ? ' spun'
      : (status === 'watched' || status === 'cancelled') ? ' done' : '';
    var map = { planned:'entries open', locked:'voting open', spun:'picked',
      watched:'watched', cancelled:'called off' };
    return '<span class="chip2' + cls + '">' + esc(map[status] || status) + '</span>';
  }

  function actBtn(id, label, night, action, cls){
    var busy = admBusy === id;
    return '<button class="abtn' + (cls ? ' ' + cls : '') + '" data-adm="' + esc(action) +
      '" data-night="' + esc(night) + '" data-id="' + esc(id) + '"' +
      (admBusy ? ' disabled' : '') + '>' + (busy ? 'working...' : esc(label)) + '</button>';
  }

  function nightBlock(n){
    var open = admOpen === n.id;
    var bits = [];
    if (n.date_label) bits.push(esc(n.date_label));
    if (n.theme) bits.push(esc(n.theme));
    else bits.push('open night');
    bits.push(n.entries.length + (n.entries.length === 1 ? ' entry' : ' entries'));
    if (n.headcount) bits.push(n.headcount + ' coming');

    var acts = [];
    if (n.status === 'planned' || n.status === 'locked') {
      acts.push('<button class="abtn" data-adm="edit" data-night="' + esc(n.id) +
        '" data-id="edit:' + esc(n.id) + '"' + (admBusy ? ' disabled' : '') + '>' +
        (admEdit === n.id ? 'Editing...' : 'Edit') + '</button>');
    }
    if (n.status === 'planned') {
      acts.push(actBtn('openvote:' + n.id, 'Open voting', n.id, 'openvote', 'go'));
      acts.push(actBtn('cancel:' + n.id, 'Cancel night', n.id, 'cancel', 'warn'));
    } else if (n.status === 'locked') {
      acts.push(actBtn('cancel:' + n.id, 'Cancel night', n.id, 'cancel', 'warn'));
    } else if (n.status === 'spun') {
      acts.push(actBtn('again:' + n.id, 'Roll second feature', n.id, 'again', 'go'));
      acts.push(actBtn('done:' + n.id, 'Done, roll credits', n.id, 'done'));
    }

    var entries = '';
    if (open) {
      entries = '<div class="elist">' + (n.entries.length
        ? n.entries.map(function(e){
            var w = [];
            if (e.votes) w.push(e.votes + ' &#128499;&#65039;');
            if (e.jokers) w.push(e.jokers + ' &#127183;');
            return '<div class="erow"><span class="et">' + esc(e.title) +
              ' <span style="color:var(--muted)">&middot; ' + esc(e.emoji) + ' ' +
              esc(e.member) + '</span></span>' +
              '<span class="ew">' + (w.length ? w.join(' ') : '&mdash;') + '</span>' +
              '<button class="abtn warn" data-adm="eject" data-night="' + esc(n.id) +
              '" data-film="' + esc(e.film_id) + '" data-id="eject:' + esc(e.film_id) + '"' +
              (admBusy ? ' disabled' : '') + '>' +
              (admBusy === 'eject:' + e.film_id ? 'working...' : 'Remove') + '</button></div>';
          }).join('')
        : '<div class="bempty" style="font-size:17px">No films entered yet.</div>') + '</div>';
    }

    return '<div class="nrow' + (open ? ' open' : '') + '">' +
      '<div class="nhead" data-adm="expand" data-night="' + esc(n.id) + '">' +
      '<div><div class="ntitle">' + esc(n.title) + '</div>' +
      '<div class="nmeta">' + bits.join(' &middot; ') + '</div></div>' +
      statusChip(n.status) + '</div>' +
      (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') +
      entries + '</div>';
  }

  function createForm(){
    var ideas = (admData && Array.isArray(admData.theme_ideas)) ? admData.theme_ideas : [];
    var editing = admEdit !== '';
    var opts = ['<option value="">Open night &mdash; anything can be entered</option>'];
    ideas.forEach(function(t){
      opts.push('<option value="' + esc(t.text) + '"' +
        (admForm.theme === t.text ? ' selected' : '') + '>' + esc(t.text) +
        ' &mdash; ' + esc(t.name) + '</option>');
    });
    opts.push('<option value="__own"' + (admForm.theme === '__own' ? ' selected' : '') +
      '>Type my own theme</option>');
    return '<div class="nrow form">' +
      '<div class="ntitle">' + (editing ? 'Edit this night' : 'Create a night') + '</div>' +
      (editing
        ? '<div class="nmeta">Changes go straight to the announcement.</div>'
        : '') +
      '<label for="admTitle">Name</label>' +
      '<input id="admTitle" type="text" placeholder="The one with the robots">' +
      '<label for="admTheme">Theme</label>' +
      '<select id="admTheme">' + opts.join('') + '</select>' +
      (admForm.theme === '__own'
        ? '<input id="admOwn" type="text" placeholder="Films with terrible dads" ' +
          'style="margin-top:12px">'
        : '') +
      '<label for="admStarts">Date &amp; start time &mdash; voting opens automatically ' +
      '7 days before</label>' +
      '<input id="admStarts" type="datetime-local">' +
      '<label for="admNotes">Anything else (optional)</label>' +
      '<textarea id="admNotes" placeholder="Parking is awful, get the bus."></textarea>' +
      '<div class="acts">' +
      '<button class="abtn go" data-adm="' + (editing ? 'save' : 'create') +
      '" data-id="' + (editing ? 'save' : 'create') + '"' + (admBusy ? ' disabled' : '') + '>' +
      (admBusy === 'save' ? 'saving...'
        : admBusy === 'create' ? 'announcing...'
        : editing ? 'Save changes' : 'Create and announce') + '</button>' +
      (editing
        ? '<button class="abtn" data-adm="canceledit" data-id="canceledit"' +
          (admBusy ? ' disabled' : '') + '>Stop editing</button>'
        : '') +
      '</div></div>';
  }

  function drawAdmin(){
    var el = document.getElementById('admin');
    if (!admData) {
      el.innerHTML = '<div class="vwrap"><div class="bempty">Loading the panel...</div></div>';
      return;
    }
    var nights = Array.isArray(admData.nights) ? admData.nights : [];
    var live = nights.filter(function(n){
      return n.status === 'planned' || n.status === 'locked' || n.status === 'spun';
    });
    var past = nights.filter(function(n){
      return n.status === 'watched' || n.status === 'cancelled';
    });
    el.innerHTML =
      '<div class="vhead"><div class="vtitle">Admin</div><div class="vspace"></div>' +
      '<a class="pillbtn" href="#" id="navBack3">Back to The Lobby</a></div>' +
      '<div class="vwrap admgrid">' +
      '<div>' + (admError ? '<div class="err">' + esc(admError) + '</div>' : '') +
      '<div class="secthead" style="margin-top:0">Nights</div>' +
      (live.length
        ? live.map(nightBlock).join('')
        : '<div class="bempty">Nothing planned. Create one on the right.</div>') +
      (past.length
        ? '<div class="secthead">Recently</div>' + past.map(nightBlock).join('')
        : '') +
      '</div><div>' + createForm() + '</div></div>';

    /* Put typed values back after the repaint and keep them as they change. */
    var bind = function(id, key){
      var node = document.getElementById(id);
      if (!node) return;
      node.value = admForm[key];
      node.addEventListener('input', function(e){ admForm[key] = e.target.value; });
    };
    bind('admTitle', 'title');
    bind('admStarts', 'starts');
    bind('admNotes', 'notes');
    bind('admOwn', 'own');
    var sel = document.getElementById('admTheme');
    if (sel) {
      sel.value = admForm.theme;
      sel.addEventListener('change', function(e){
        admForm.theme = e.target.value;
        renderAdmin();
      });
    }
  }

  function loadAdmin(){
    fetch(API + 'admin/state' + admQs())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) {
          admData = { nights: [], theme_ideas: [] };
          admError = (d && d.message) || 'That did not load.';
        } else {
          admData = d;
        }
        renderAdmin();
      })
      .catch(function(){
        admData = { nights: [], theme_ideas: [] };
        admError = 'No signal from the Den.';
        renderAdmin();
      });
  }

  /* One tap, one action, then the panel refetches so the result is the DB's word, not ours. */
  function adminAct(id, action, night, film){
    if (admBusy) return;
    admBusy = id;
    admError = '';
    renderAdmin();

    var done = function(j){
      admBusy = '';
      if (!j || !j.ok) admError = (j && j.message) || 'That did not go through.';
      loadAdmin();
    };
    var failed = function(){
      admBusy = '';
      admError = 'Could not reach the Den. Try again in a moment.';
      renderAdmin();
    };

    /* The second feature is the wheel's own endpoint, the rest are host commands. */
    if (action === 'again') {
      fetch(spinUrl(), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ again: true })
      }).then(function(r){ return r.json(); }).then(done).catch(failed);
      return;
    }

    var payload = { key: KEY, host: HOSTKEY, action: action };
    if (night) payload.night_id = night;
    if (film) payload.film_id = film;
    if (action === 'create_night') {
      var theme = effectiveTheme(admForm);
      payload.title = admForm.title.trim();
      payload.theme = theme ? theme : null;
      payload.notes = admForm.notes.trim() ? admForm.notes.trim() : null;
      payload.starts_at = fromLocalInput(admForm.starts);
    }
    if (action === 'update_night') {
      /* Only what the host actually changed travels; an emptied field clears it. */
      var base = admBase || {};
      if (admForm.title.trim() !== base.title) payload.title = admForm.title.trim();
      var nowTheme = effectiveTheme(admForm);
      if (nowTheme !== base.theme) payload.theme = nowTheme ? nowTheme : null;
      var nowNotes = admForm.notes.trim();
      if (nowNotes !== base.notes) payload.notes = nowNotes ? nowNotes : null;
      if (admForm.starts !== base.starts) payload.starts_at = fromLocalInput(admForm.starts);
    }
    fetch(API + 'admin/act', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok && (action === 'create_night' || action === 'update_night')) {
        admForm = blankForm();
        admEdit = '';
        admBase = null;
      }
      done(j);
    }).catch(failed);
  }

  document.getElementById('admin').addEventListener('click', function(e){
    var el = e.target.closest('[data-adm]');
    if (!el) return;
    var what = el.getAttribute('data-adm');
    if (what === 'expand') {
      var nid = el.getAttribute('data-night');
      admOpen = admOpen === nid ? '' : nid;
      renderAdmin();
      return;
    }
    if (what === 'edit') {
      var target = null;
      ((admData && admData.nights) || []).forEach(function(n){
        if (n.id === el.getAttribute('data-night')) target = n;
      });
      if (target) startEdit(target);
      renderAdmin();
      return;
    }
    if (what === 'canceledit') {
      admEdit = '';
      admBase = null;
      admForm = blankForm();
      admError = '';
      renderAdmin();
      return;
    }
    if (what === 'create' || what === 'save') {
      if (!admForm.title.trim()) { admError = 'Give the night a name first.'; renderAdmin(); return; }
      if (what === 'create' && !admForm.starts) {
        admError = 'Pick a date and start time.';
        renderAdmin();
        return;
      }
      if (what === 'save') adminAct('save', 'update_night', admEdit, '');
      else adminAct('create', 'create_night', '', '');
      return;
    }
    adminAct(el.getAttribute('data-id'), what, el.getAttribute('data-night'),
      el.getAttribute('data-film'));
  });

  /* A view that throws must still say something. An eternal spinner is never acceptable. */
  function guard(id, fn){
    try {
      fn();
    } catch (err) {
      console.log('[view] ' + id + ' failed: ' + String(err));
      document.getElementById(id).innerHTML =
        '<div class="vwrap"><div class="bempty">Something went wrong drawing this view. ' +
        'Go back to The Lobby and try again.</div>' +
        '<a class="pillbtn back" href="#">Back to The Lobby</a></div>';
    }
  }
  function renderBoard(){ guard('board', drawBoard); }
  function renderLibBoard(){ guard('libboard', drawLibBoard); }
  function renderAdmin(){ guard('admin', drawAdmin); }

  /* ------------------------------------------------ the shared film card
     One card language for both full-screen views. Hovering lifts a card out of the wall
     rather than reflowing its neighbours: at this size a grid that shuffles on mouse-move
     reads as a glitch, an elevated card reads as attention. */

  var libData = null;      /* the shelf, as fetched */
  var boardData = null;    /* history + films + stats */
  var libFilter = 'all';   /* all | watched | unwatched | by:<member_id> */
  var libSort = 'new';     /* new | az | paws | imdb */
  var modalFilm = null;    /* the film whose details are open */

  function pawText(f){
    if (f.avg_paws == null) return null;
    return '&#128062; ' + (Math.round(f.avg_paws * 10) / 10).toFixed(1) +
      ' from ' + f.rating_count;
  }
  function whenText(iso){
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return ''; }
  }

  /* "with A, B, C" — top billing only, and nothing at all when the file is thin. */
  function castLine(list, n){
    var names = (list || []).slice(0, n);
    if (!names.length) return '';
    return 'with ' + names.map(esc).join(', ') + ((list || []).length > n ? '...' : '');
  }

  function filmCard(f, i){
    var facts = [];
    var paws = pawText(f);
    if (paws) facts.push('<span class="fact paw">' + paws + '</span>');
    if (f.watched) {
      facts.push('<span class="fact on">seen ' + esc(whenText(f.watched_at)) + '</span>');
    } else {
      facts.push('<span class="fact">not watched yet</span>');
    }
    if (f.times_entered) {
      facts.push('<span class="fact">entered &times;' + f.times_entered + '</span>');
    }
    if (f.night && f.night.by_majority) {
      facts.push('<span class="fact">won by majority</span>');
    }

    var delay = Math.min(i, 26) * 26;
    return '<div class="slot" data-film="' + esc(f.film_id) + '" style="animation-delay:' +
      delay + 'ms"><div class="card">' +
      '<div class="art">' +
      (f.imdb_rating ? '<span class="imdb">&#11088; ' + esc(f.imdb_rating) + '</span>' : '') +
      '<span class="seenflag' + (f.watched ? ' yes' : '') + '">' +
      (f.watched ? 'seen' : 'unseen') + '</span>' +
      poster(f.title, f.poster) +
      '</div>' +
      '<div class="body"><div class="ct">' + esc(f.title) +
      (f.year ? ' <span style="color:var(--muted);font-weight:600">' + esc(f.year) + '</span>' : '') +
      '</div><div class="cby">' +
      (f.brought_by ? esc(f.brought_by.emoji) + ' ' + esc(f.brought_by.name) : '&nbsp;') +
      (f.night ? ' &middot; ' + esc(f.night.night) : '') +
      '</div></div>' +
      '<div class="detail">' +
      (f.synopsis
        ? '<div class="syn">' + esc(f.synopsis) + '</div>'
        : '<div class="syn" style="opacity:.55">No synopsis on file.</div>') +
      (castLine(f.cast_list, 3) ? '<div class="cast">' + castLine(f.cast_list, 3) + '</div>' : '') +
      (streamLine(f.watch_providers)
        ? '<div class="cstream">' + streamLine(f.watch_providers) + '</div>'
        : '') +
      '<div class="facts">' + facts.join('') + '</div>' +
      '<button class="more" data-film="' + esc(f.film_id) + '">Full details</button>' +
      '</div></div></div>';
  }

  function ghostSlots(n){
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push('<div class="slot ghost" style="animation-delay:' +
        (Math.min(i, 26) * 26) + 'ms"><div class="frame"></div></div>');
    }
    return out.join('');
  }

  /* ------------------------------------------------ filters and sorting */
  function sortFilms(list){
    var copy = list.slice();
    if (libSort === 'az') {
      copy.sort(function(a, b){ return String(a.title).localeCompare(String(b.title)); });
    } else if (libSort === 'paws') {
      copy.sort(function(a, b){
        var x = a.avg_paws == null ? -1 : a.avg_paws;
        var y = b.avg_paws == null ? -1 : b.avg_paws;
        return y - x;
      });
    } else if (libSort === 'imdb') {
      copy.sort(function(a, b){
        var x = a.imdb_rating ? parseFloat(a.imdb_rating) : -1;
        var y = b.imdb_rating ? parseFloat(b.imdb_rating) : -1;
        return (isNaN(y) ? -1 : y) - (isNaN(x) ? -1 : x);
      });
    }
    /* 'new' is the order the API already returns: newest into the library first. */
    return copy;
  }

  function filterFilms(list){
    if (libFilter === 'watched') {
      return list.filter(function(f){ return f.watched; });
    }
    if (libFilter === 'unwatched') {
      return list.filter(function(f){ return !f.watched; });
    }
    if (libFilter.indexOf('by:') === 0) {
      var who = libFilter.slice(3);
      return list.filter(function(f){
        return f.brought_by && String(f.brought_by.member_id) === who;
      });
    }
    return list;
  }

  function filterBar(list){
    var owners = [];
    var seen = {};
    list.forEach(function(f){
      if (!f.brought_by) return;
      var id = String(f.brought_by.member_id);
      if (seen[id]) return;
      seen[id] = true;
      owners.push(f.brought_by);
    });
    var chip = function(val, label, extra){
      return '<button class="fchip' + (libFilter === val ? ' on' : '') +
        '" data-filter="' + esc(val) + '">' + (extra || '') + esc(label) + '</button>';
    };
    var sortChip = function(val, label){
      return '<button class="fchip' + (libSort === val ? ' on' : '') +
        '" data-sort="' + esc(val) + '">' + esc(label) + '</button>';
    };
    return '<div class="vbar"><span class="vlabel">show</span>' +
      chip('all', 'all') + chip('watched', 'watched') + chip('unwatched', 'unwatched') +
      owners.map(function(o){
        return chip('by:' + o.member_id, o.name, avatar(o));
      }).join('') +
      '<span class="vsep"></span><span class="vlabel">sort</span>' +
      sortChip('new', 'newest') + sortChip('az', 'a to z') +
      sortChip('paws', 'paws') + sortChip('imdb', 'imdb') +
      '</div>';
  }

  /* ------------------------------------------------ the library screen */
  function drawLibBoard(){
    var el = document.getElementById('libboard');
    if (!libData) { el.innerHTML = '<div class="vwrap"><div class="bempty">Loading the shelf...</div></div>'; return; }
    var all = Array.isArray(libData.library) ? libData.library : [];
    var shown = sortFilms(filterFilms(all));
    /* Empty frames only when the shelf itself is young — a filter finding nothing is an
       answer, not a gap to paper over. */
    var ghosts = (libFilter === 'all' && all.length < 16) ? 16 - shown.length : 0;

    el.innerHTML = '<div class="vhead">' +
      '<div class="vtitle">The library<span class="vcount">' + all.length +
      (all.length === 1 ? ' film' : ' films') + '</span></div>' +
      '<div class="vspace"></div>' + filterBar(all) +
      '<a class="pillbtn" href="#" id="navBack2">Back to The Lobby</a></div>' +
      '<div class="vwrap">' +
      (shown.length || ghosts
        ? '<div class="filmwall">' + shown.map(filmCard).join('') + ghostSlots(ghosts) + '</div>'
        : '<div class="bempty">No films match that filter.</div>') +
      '</div>';
  }

  function loadLibBoard(){
    libData = null;
    renderLibBoard();
    fetch(API + 'tv-library?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(d){
        libData = (d && d.ok) ? d : { library: [] };
        renderLibBoard();
      })
      .catch(function(){
        libData = { library: [] };
        renderLibBoard();
      });
  }

  /* ------------------------------------------------ the history and stats board */
  /* Null-safe formatting: a missing number never becomes NaN, undefined, or a thrown
     .toFixed on nothing. */
  function num(v){ return (v == null || v === '') ? null : v; }
  function one(v){ return v == null ? null : (Math.round(v * 10) / 10).toFixed(1); }

  function statTile(k, v, sub, amber){
    /* Nothing to report is still worth a tile: the strip keeps its shape and the blank
       reads as "not yet" rather than as a missing feature. */
    var shown = (v == null || v === '') ? '&mdash;' : esc(String(v));
    return '<div class="tile' + (amber ? ' amber' : '') + '"><div class="k">' + esc(k) +
      '</div><div class="v">' + shown + '</div>' +
      (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
  }

  function drawBoard(){
    var el = document.getElementById('board');
    if (!boardData) { el.innerHTML = '<div class="vwrap"><div class="bempty">Loading the history...</div></div>'; return; }
    var films = Array.isArray(boardData.films) ? boardData.films : [];
    var st = (boardData.stats) || {};
    var n = st.numbers || {};
    var cards = Array.isArray(st.cards) ? st.cards : [];

    /* One row of tiles — the board fits a 1080 screen with nothing to scroll. */
    /* Plain '·' — this string goes through esc(), which would mangle the entity form. */
    var jokerSub = [
      n.jokers_spent == null ? '' : n.jokers_spent + ' burned',
      n.jokers_ever == null ? '' : n.jokers_ever + ' ever issued'
    ].filter(Boolean).join(' · ');
    var tiles = [
      statTile('films watched', num(n.films_watched),
        n.films_in_library ? n.films_in_library + ' on the shelf' : ''),
      statTile('house average', one(n.house_average),
        n.paws_cast ? n.paws_cast + ' paws cast' : '', true),
      statTile('votes cast', num(n.votes_cast),
        n.entries_total ? n.entries_total + ' entries in all' : ''),
      statTile('landslides', n.majority_rate == null ? null : n.majority_rate + '%',
        n.spins_total ? (n.majority_locked || 0) + ' of ' + n.spins_total + ' spins' : ''),
      statTile('jokers banked', num(n.jokers_banked), jokerSub, true),
      statTile('longest streak', n.longest_streak ? n.longest_streak + ' nights' : null,
        n.streak_holder || ''),
      statTile('most agreed on', num(n.least_divisive_spread), n.least_divisive || '')
    ].join('');

    /* Everything fits one screen: the wall keeps the latest row, the library holds the rest. */
    var wall = films.slice(0, 8);
    var earlier = films.length - wall.length;
    var shownCards = cards.filter(function(c){
      return c.key !== 'divisive' && c.key !== 'persuasive';
    });

    el.innerHTML = '<div class="vhead">' +
      '<div class="vtitle">History &amp; stats<span class="vcount">' + films.length +
      (films.length === 1 ? ' film watched' : ' films watched') + '</span></div>' +
      '<div class="vspace"></div>' +
      '<a class="pillbtn" href="#" id="navBack">Back to The Lobby</a></div>' +
      '<div class="vwrap">' +
      (tiles ? '<div class="strip">' + tiles + '</div>' : '') +
      '<div class="secthead">What we have watched' +
      (earlier > 0
        ? '<span class="vcount">the last ' + wall.length + ' &middot; ' + earlier +
          ' earlier in the Library</span>'
        : '') + '</div>' +
      (wall.length
        ? '<div class="filmwall">' + wall.map(filmCard).join('') + '</div>'
        : '<div class="bempty">Nothing watched yet. The first night starts the record.</div>') +
      (shownCards.length
        ? '<div class="secthead">The folklore</div><div class="strip folkstrip">' +
          shownCards.map(function(c){
            /* The big line is the answer — a name or a film — never a bare number. */
            var head = (c.member && c.member.name === c.headline)
              ? esc(c.member.emoji) + ' ' + esc(c.headline)
              : esc(c.headline);
            return '<div class="tile folk"><div class="k">' + esc(c.badge) + ' ' +
              esc(c.title) + '</div>' +
              '<div class="fv">' + head + '</div>' +
              (c.sub ? '<div class="fsub">' + esc(c.sub) + '</div>' : '') +
              '<div class="fs">' + esc(c.line) + '</div></div>';
          }).join('') + '</div>'
        : '') +
      '</div>';
  }

  function loadBoard(){
    boardData = null;
    renderBoard();
    fetch(API + 'tv-stats?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(d){
        boardData = (d && d.ok) ? d : { films: [], stats: {} };
        renderBoard();
      })
      .catch(function(){
        boardData = { films: [], stats: {} };
        renderBoard();
      });
  }

  /* ------------------------------------------------ the details modal */
  function findFilm(id){
    if (dossiers[id]) return dossiers[id];
    var pools = [(libData && libData.library) || [], (boardData && boardData.films) || []];
    for (var p = 0; p < pools.length; p++) {
      for (var i = 0; i < pools[p].length; i++) {
        if (pools[p][i].film_id === id) return pools[p][i];
      }
    }
    return null;
  }

  /* TMDB serves the logos; this is the size their own docs recommend for a chip. */
  var TMDB_IMG = 'https://image.tmdb.org/t/p/w92';

  /**
   * Every chip opens the film's own TMDB watch page — the JustWatch-maintained page for
   * exactly this movie, with a real working button per service. True per-service deep
   * links aren't public API (hand-built search URLs proved to 404 on half the services),
   * so the one reliable door is the page that has them all.
   */
  function providerUrl(name, title, link){
    return link || ('https://www.google.com/search?q=' +
      encodeURIComponent((title || '') + ' watch ' + (name || '')));
  }

  function watchRow(key, list, title, fallback){
    if (!list || !list.length) return '';
    return '<div class="wrow"><span class="wk">' + key + '</span><span class="wp">' +
      list.map(function(p){
        /* The scraped per-service link when we have it; the film's watch page when not. */
        return '<a href="' + esc(p.url || providerUrl(p.name, title, fallback)) +
          '" target="_blank" rel="noopener">' +
          (p.logo ? '<img src="' + esc(TMDB_IMG + p.logo) + '" alt="">' : '') +
          esc(p.name) + '</a>';
      }).join('') + '</span></div>';
  }

  /**
   * Where to watch it, drawn the same way everywhere it appears. Nothing at all when the
   * film has never been looked up or has nothing on offer — an empty box says less than no
   * box. The attribution line is required by TMDB's terms and is never optional.
   */
  function watchBlock(w, title){
    if (!w) return '';
    var rows = watchRow('Stream', w.flatrate, title, w.link) +
      watchRow('Rent', w.rent, title, w.link) + watchRow('Buy', w.buy, title, w.link);
    if (!rows) return '';
    return '<div class="watch">' + rows +
      '<div class="wattr">streaming data by JustWatch via TMDB</div></div>';
  }

  /* The trailer, one click away. A known key plays right here in the cinema overlay; with
     no key the button falls back to an exact-title YouTube search in a new tab. */
  function trailerBtn(f){
    var w = f.watch_providers;
    var key = w && w.trailer ? String(w.trailer) : '';
    var href = key
      ? 'https://www.youtube.com/watch?v=' + encodeURIComponent(key)
      : 'https://www.youtube.com/results?search_query=' +
        encodeURIComponent(f.title + ' ' + (f.year || '') + ' trailer');
    return '<a class="playbtn" href="' + esc(href) + '" target="_blank" rel="noopener"' +
      (key ? ' data-trailer="' + esc(key) + '"' : '') +
      ' aria-label="Watch the trailer"><span>&#9654;</span><i>trailer</i></a>';
  }

  /* ---------------- the cinema overlay ---------------- */
  function openCinema(key){
    var el = document.getElementById('cinema');
    el.innerHTML = '<div class="cscrim" data-cclose="1"></div>' +
      '<div class="cframe"><button class="pillbtn cx" data-cclose="1">close</button>' +
      '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(key) +
      '?autoplay=1&rel=0" title="Trailer"' +
      ' allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>';
    el.className = 'on';
  }
  /* Emptying the overlay is what stops the sound. */
  function closeCinema(){
    var el = document.getElementById('cinema');
    el.className = '';
    el.innerHTML = '';
  }

  /* "streaming on Disney Plus &middot; Crave" — the passing version, for a hover panel. */
  function streamLine(w){
    var list = (w && w.flatrate) || [];
    if (!list.length) return '';
    /* Each name is escaped on its own — escaping the joined string would turn the
       separator into literal text on the screen. */
    var names = list.slice(0, 2).map(function(p){ return esc(p.name); });
    return 'streaming on ' + names.join(' &middot; ') + (list.length > 2 ? '&hellip;' : '');
  }

  function renderModal(){
    var el = document.getElementById('modal');
    if (!modalFilm) { el.className = ''; el.innerHTML = ''; return; }
    var f = modalFilm;
    var facts = [];
    if (f.year) facts.push('<span class="fact">' + esc(f.year) + '</span>');
    if (f.runtime) facts.push('<span class="fact">' + esc(f.runtime) + '</span>');
    if (f.imdb_rating) {
      facts.push('<span class="fact paw">&#11088; ' + esc(f.imdb_rating) + ' imdb</span>');
    }
    (f.genres || []).forEach(function(g){
      facts.push('<span class="fact">' + esc(g) + '</span>');
    });

    var den = [];
    den.push('<div>Our paws<b>' +
      (f.avg_paws == null ? '&mdash;' : (Math.round(f.avg_paws * 10) / 10).toFixed(1) +
        ' from ' + f.rating_count) + '</b></div>');
    if (f.director) den.push('<div>Directed by<b>' + esc(f.director) + '</b></div>');
    den.push('<div>Times entered<b>' + (f.times_entered || 0) + '</b></div>');
    den.push('<div>Brought in by<b>' +
      (f.brought_by ? esc(f.brought_by.emoji) + ' ' + esc(f.brought_by.name) : '&mdash;') +
      '</b></div>');
    den.push('<div>' + (f.watched ? 'Watched' : 'On the shelf since') + '<b>' +
      esc(whenText(f.watched ? f.watched_at : f.created_at) || 'not yet') + '</b></div>');
    if (f.night) {
      den.push('<div>That night<b>' + esc(f.night.night) +
        (f.night.by_majority ? ' &middot; by majority' : '') + '</b></div>');
    }

    el.innerHTML = '<div class="scrim" data-close="1"></div><div class="box">' +
      '<button class="pillbtn x" data-close="1">close</button>' +
      '<div class="cover">' + poster(f.title, f.poster) + trailerBtn(f) + '</div>' +
      '<div class="side"><h3>' + esc(f.title) +
      (f.year ? ' <span class="yr">(' + esc(f.year) + ')</span>' : '') + '</h3>' +
      (facts.length ? '<div class="mfacts">' + facts.join('') + '</div>' : '') +
      '<p class="msyn">' + (f.synopsis ? esc(f.synopsis) : 'No synopsis on file for this one.') +
      '</p>' +
      ((f.cast_list || []).length
        ? '<div class="mcast"><span class="ck">Starring</span>' +
          f.cast_list.slice(0, 6).map(function(c){
            return '<span class="fact">' + esc(c) + '</span>';
          }).join('') + '</div>'
        : '') +
      '<div class="den">' + den.join('') + '</div>' +
      watchBlock(f.watch_providers, f.title) + '</div></div>';
    el.className = 'on';
  }

  function openModal(id){
    modalFilm = findFilm(id);
    modalProfile = null;
    renderModal();
  }
  function closeModal(){
    modalFilm = null;
    modalProfile = null;
    renderModal();
  }

  /* ------------------------------------------------ member profiles */
  var modalProfile = null;

  function openProfile(id){
    fetch(API + 'tv-profile?key=' + encodeURIComponent(KEY) + '&member=' + encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(p){
        if (!p || !p.ok) return;
        modalProfile = p;
        modalFilm = null;
        renderProfileModal();
      })
      .catch(function(){});
  }

  function profileRows(title, rows){
    if (!rows.length) return '';
    return '<div class="psec">' + title + '</div>' + rows.join('');
  }

  function renderProfileModal(){
    var el = document.getElementById('modal');
    var p = modalProfile;
    if (!p) { el.className = ''; el.innerHTML = ''; return; }
    var m = p.member, c = p.counts;

    var face = m.avatar
      ? '<img class="pface" src="' + esc(m.avatar) + '" alt="">'
      : '<div class="pface pemoji" style="background:' + safeColor(m.color) + '33">' +
        esc(m.emoji) + '</div>';

    var facts = [
      '<span class="fact">&#127183; ' + (m.jokers || 0) +
        (m.jokers === 1 ? ' joker' : ' jokers') + ' in the bank</span>',
      '<span class="fact">' + c.nights_in + (c.nights_in === 1 ? ' night in' : ' nights in') +
        '</span>',
      '<span class="fact">' + c.entries + (c.entries === 1 ? ' film entered' : ' films entered') +
        '</span>',
      '<span class="fact">' + c.wins + (c.wins === 1 ? ' win' : ' wins') + '</span>'
    ].join('');

    var entries = p.entries.slice(0, 6).map(function(e){
      return '<div class="prow">' + poster(e.title, e.poster) +
        '<div class="pt"><b>' + esc(e.title) +
        (e.year ? ' <span class="dim">(' + esc(e.year) + ')</span>' : '') + '</b>' +
        '<i>' + esc(e.night) + '</i></div>' +
        (e.won ? '<span class="pwon">&#128081; won</span>' : '') + '</div>';
    });

    var votes = p.votes.slice(0, 6).map(function(v){
      return '<div class="pline">' + esc(v.title) + ' <span class="dim">&middot; ' +
        esc(v.night) + '</span></div>';
    });
    if (p.sealed_votes > 0) {
      votes.push('<div class="pline dim">' + p.sealed_votes +
        (p.sealed_votes === 1 ? ' ballot sealed' : ' ballots sealed') +
        ' until the night ends</div>');
    }

    var ratings = p.ratings.slice(0, 6).map(function(r){
      return '<div class="pline">' + esc(r.title) + ' <span class="paws">' +
        '&#128062;'.repeat(Math.max(1, Math.min(5, r.paws || 0))) + '</span></div>';
    });

    var jokers = p.jokers_played.slice(0, 6).map(function(j){
      return '<div class="pline">&#127183; on ' + esc(j.title) +
        ' <span class="dim">&middot; ' + esc(j.night) +
        (j.refunded ? ' &middot; refunded' : '') + '</span></div>';
    });

    el.innerHTML = '<div class="scrim" data-close="1"></div><div class="box pbox">' +
      '<button class="pillbtn x" data-close="1">close</button>' +
      '<div class="pcol">' + face + '</div>' +
      '<div class="side"><h3>' + esc(m.emoji) + ' ' + esc(m.name) +
      (m.is_host ? ' <span class="phost">host</span>' : '') + '</h3>' +
      '<div class="mfacts">' + facts + '</div>' +
      profileRows('Their films', entries) +
      profileRows('Votes on the record', votes) +
      profileRows('Their paws', ratings) +
      profileRows('Jokers played', jokers) +
      '</div></div>';
    el.className = 'on';
  }

  /* ------------------------------------------------ screen wiring */
  function screenClick(e){
    /* A play button with a known key stays in the room: the cinema, not a new tab. */
    var tr = e.target.closest('[data-trailer]');
    if (tr) { e.preventDefault(); openCinema(tr.getAttribute('data-trailer')); return; }
    var el = e.target.closest('[data-film], [data-filter], [data-sort], [data-close]');
    if (!el) return;
    if (el.getAttribute('data-close')) { closeModal(); return; }
    var film = el.getAttribute('data-film');
    /* Only the button opens the modal; hovering a card is not a commitment. */
    if (film && el.className && el.className.indexOf('more') >= 0) { openModal(film); return; }
    var flt = el.getAttribute('data-filter');
    if (flt) { libFilter = flt; renderLibBoard(); return; }
    var srt = el.getAttribute('data-sort');
    if (srt) { libSort = srt; renderLibBoard(); return; }
  }
  document.getElementById('libboard').addEventListener('click', screenClick);
  document.getElementById('board').addEventListener('click', screenClick);
  document.getElementById('modal').addEventListener('click', screenClick);
  document.getElementById('cinema').addEventListener('click', function(e){
    if (e.target.closest('[data-cclose]')) closeCinema();
  });

  /* Sealing early is a host act with a confirm-by-double-take: one click arms, the second
     within four seconds commits. */
  var sealArmed = null;
  document.getElementById('sealBtn').addEventListener('click', function(){
    var btn = document.getElementById('sealBtn');
    if (!sealArmed) {
      btn.textContent = '🔒 seal now — no more votes';
      sealArmed = setTimeout(function(){
        sealArmed = null;
        btn.textContent = '🔒 seal the ballots';
      }, 4000);
      return;
    }
    clearTimeout(sealArmed);
    sealArmed = null;
    btn.disabled = true;
    fetch(API + 'admin/act', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key: KEY, host: HOSTKEY, action: 'close_voting',
        night_id: lastNightId })
    })
      .then(function(r){ return r.json(); })
      .then(function(){
        btn.disabled = false;
        btn.textContent = '🔒 seal the ballots';
        poll();
      })
      .catch(function(){ btn.disabled = false; });
  });

  /* The mute switch doubles as the audio unlock: any click on it counts as the user
     gesture browsers want before a page may make noise. */
  function paintMute(){
    document.getElementById('muteBtn').textContent = MUTED ? '🔇 muted' : '🔊 sound on';
  }
  document.getElementById('muteBtn').addEventListener('click', function(){
    MUTED = !MUTED;
    try { localStorage.setItem('den-muted', MUTED ? '1' : '0'); } catch (e) {}
    if (!MUTED) audioCtx();
    paintMute();
    syncMusic();
  });
  paintMute();
  /* Any click on the page is the gesture browsers want — after one, the lobby can hum. */
  document.addEventListener('click', function(){
    if (MUTED) return;
    audioCtx();
    setTimeout(syncMusic, 150);
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    /* The cinema sits on top of everything, so it leaves first. */
    if (document.getElementById('cinema').className === 'on') { closeCinema(); return; }
    if (modalFilm || modalProfile) closeModal();
  });

  /* Any face in the lobby opens the person behind it. */
  function memberClick(e){
    var el = e.target.closest('[data-member]');
    if (el) openProfile(el.getAttribute('data-member'));
  }
  document.getElementById('seatGrid').addEventListener('click', memberClick);
  document.getElementById('rollList').addEventListener('click', memberClick);

  function routeView(){
    /* A dialog belongs to the view that opened it. */
    if (modalFilm || modalProfile) closeModal();
    var stats = boardOn(), lib = libOn();
    /* A viewer who guesses the hash still gets nothing: the panel needs the host link. */
    var adm = adminOn() && IS_HOST;
    var any = stats || lib || adm;
    document.getElementById('board').className = stats ? 'on' : '';
    document.getElementById('libboard').className = lib ? 'on' : '';
    document.getElementById('admin').className = adm ? 'on' : '';
    document.getElementById('navrow').style.display = any ? 'none' : '';
    document.getElementById('lobby').style.display = any ? 'none' : '';
    revealEl.style.display = any ? 'none' : '';
    syncPicksLink();
    if (stats) loadBoard();
    if (lib) loadLibBoard();
    if (adm) { admError = ''; loadAdmin(); }
  }
  window.addEventListener('hashchange', routeView);

  /* ------------------------------------------------ polling */
  var lastRevealSig = '';
  function revealSig(state){
    return (state.spin ? state.spin.id : '') + '|' + (canRollAgain ? '1' : '0') + '|' +
      features.length;
  }
  function poll(){
    fetch(API + 'tv-state?key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(state){
        if (!state || !state.ok) return;
        features = state.features || [];
        canRollAgain = state.second_roll === true;
        renderLobby(state);

        if (state.spin && state.spin.id) {
          if (firstState) {
            /* Opened after the ceremony: show the outcome, do not re-run the theatre. */
            shownSpins[state.spin.id] = true;
            var res = state.spin.result || {};
            buildWheel(res.candidates || [], res.majority);
            var land = landingAngle(res.candidates || [], res.winner_film_id, res.roll);
            if (land != null) {
              rotation = ((-land) % 360 + 360) % 360;
              wheel.style.transition = 'none';
              wheel.style.transform = 'rotate(' + rotation.toFixed(3) + 'deg)';
            }
            showReveal(res, state.votes, true);
            lastRevealSig = revealSig(state);
          } else if (!shownSpins[state.spin.id] && !spinning) {
            shownSpins[state.spin.id] = true;
            runSpinAnimation(state.spin, state.votes);
          } else if (!spinning && revealEl.className === 'on' &&
              revealSig(state) !== lastRevealSig) {
            /* The roll-again button's inputs arrive a poll behind a live spin —
               repaint the reveal when they change so the host actually sees it. */
            lastRevealSig = revealSig(state);
            showReveal(state.spin.result || {}, state.votes, true);
          }
        } else if (!spinning && revealEl.className !== 'on') {
          /* The wheel is tonight's entries, nothing else. */
          var runners = state.entries || [];
          var sig = signature(runners);
          if (sig !== signature(drawn)) buildWheel(runners, state.majority);
        }

        /* Between features, back in the lobby: the wheel shows the field a second roll
           would really draw from. The winners come off it, and the lock that settled the
           first feature is spent — round two is decided by weight alone. */
        if (!spinning && revealEl.className !== 'on' && state.night &&
            state.night.status === 'spun') {
          var left = remainingRunners(state.entries || [], wonIds);
          if (left.length && signature(left) !== signature(drawn)) buildWheel(left, {});
        }
        syncPicksLink();
        syncMusic();
        firstState = false;
      })
      .catch(function(){ /* projector keeps calm and carries on */ });
  }

  spinBtn.addEventListener('click', function(){
    if (spinning || spinBtn.disabled) return;
    /* Same call, same animation, same dual reveal as the button on the reveal itself.
       No preamble: the click IS the ceremony — the wheel moves at once and the ride
       narration runs over it. */
    if (lobbyRolls) { rollSecond(spinBtn, SECOND_LABEL); return; }
    audioCtx();
    spinning = true;
    spinBtn.disabled = true;
    fetch(spinUrl(), { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        spinning = false;
        if (!j || !j.ok || !j.spin) { spinBtn.disabled = false; return; }
        if (shownSpins[j.spin.id]) return;
        shownSpins[j.spin.id] = true;
        runSpinAnimation(j.spin, j.votes);
      })
      .catch(function(){ spinning = false; spinBtn.disabled = false; });
  });

  document.getElementById('navrow').innerHTML =
    '<button class="pillbtn hidden" id="navPicks">tonight&#39;s picks</button>' +
    '<a class="pillbtn" id="navLib" href="#library">library</a>' +
    '<a class="pillbtn" id="navBoard" href="#stats">history &amp; stats</a>' +
    (IS_HOST ? '<a class="pillbtn" id="navAdmin" href="#admin">admin</a>' : '');
  document.getElementById('navPicks').addEventListener('click', reopenReveal);

  routeView();
  poll();
  loadDossiers();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
